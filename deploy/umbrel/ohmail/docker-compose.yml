# The ohmail stack, shaped for umbrelOS — see ../README.md for the design decisions
# and ../SUBMISSION.md for where this stands with the app store.
#
# Same seven services as deploy/selfhost/docker-compose.yml, with the differences a
# home-server OS imposes:
#
#   · No `.env` beside this file. umbrelOS apps have no install-time configuration, so
#     `hooks/pre-start` generates every secret on the device (once, kept under
#     ${APP_DATA_DIR}/data/env/) and seeds a `settings.env` the person edits for the one
#     value only they can know: OHMAIL_ORIGIN. The env files below are that hook's output.
#   · The TLS front door publishes HOST PORT 4443, not 443 — umbrelOS keeps 80 and 443
#     for itself. The router forwards outside port 443 to this device's 4443; Caddy still
#     terminates TLS and obtains its certificate over the TLS-ALPN challenge, which rides
#     the forwarded connection and needs no port of its own.
#   · `app_proxy` (Umbrel's own front door) points at a small plain-HTTP launcher site on
#     the proxy. Configured, it redirects to the real https origin; unconfigured, it shows
#     the exact setup steps — so the app's "Open" button always lands somewhere useful.
#   · Hostnames inside the generated env files and the rendered Caddyfile use Umbrel's
#     injected container names (`ohmail_db_1`, …), the convention of the official apps.
#
# Every image is pinned `name:tag@sha256:…` with the multi-arch index digest; the three
# ohmail images are built by the release workflow in this repository (linux/amd64 and
# linux/arm64) and `version:` in umbrel-app.yml tracks their tag.

version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ohmail_proxy_1
      # The launcher site: plain HTTP. Configured, it answers every request with a
      # redirect to OHMAIL_ORIGIN; unconfigured, it serves the setup steps. The product
      # itself is served on the TLS port below.
      APP_PORT: 8099

  proxy:
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: on-failure
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    ports:
      # The one raw host port: the https front door. Raw because it is TLS, not something
      # app_proxy can front — the router forwards outside 443 here, and the certificate
      # (TLS-ALPN) arrives over the same forwarded connection. 4443 because umbrelOS
      # itself owns 80 and 443.
      - "4443:443"
    volumes:
      # Rendered by hooks/pre-start on every start from settings.env, so the app updates
      # with the package and reacts to configuration without a shell inside the container.
      - ${APP_DATA_DIR}/data/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${APP_DATA_DIR}/data/caddy/state:/data
      - ${APP_DATA_DIR}/data/caddy/config:/config

  web:
    image: ghcr.io/trafficflowhq/ohmail-web:0.11.0@sha256:946117baf939eca19ac590d0b268a7563ee607f09a8f3869a71b27448f4a406a
    restart: on-failure
    environment:
      # Where the web container's session gate asks "is this cookie a live session?" — the
      # api by its Umbrel container name (the same upstream the Caddyfile names), because
      # OHMAIL_ORIGIN resolves to this box's proxy from outside the app's network. Without
      # it the gate stays unarmed: signed-in visitors get the marketing page and a fresh
      # box is never steered to /setup. Mirrors deploy/selfhost/docker-compose.yml.
      OHMAIL_INTERNAL_API_ORIGIN: http://ohmail_api_1:8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    image: ghcr.io/trafficflowhq/ohmail-server:0.11.0@sha256:da2bb18bf09045682a280d909b41d56af17e3a9f9c68ed0c463140b50f435d40
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    env_file:
      # Generated first, settings second: anything the operator sets (SMTP, the
      # Microsoft OAuth block, the private-network allowances) overrides the
      # generated defaults; the secrets themselves are only in the generated file.
      - ${APP_DATA_DIR}/data/env/api.env
      - ${APP_DATA_DIR}/data/env/settings.env
    healthcheck:
      # /health answers only after boot migrations verified the schema and the key
      # ring loaded — "healthy" means "migrated, keyed, serving", exactly as in the
      # reference stack.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  organizer:
    image: ghcr.io/trafficflowhq/ohmail-worker:0.11.0@sha256:cef56cc30ba3a8f5bb289a5f14aac7bb020de846b0c8ec6789ed02b6db33b332
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    env_file:
      # Carries the SAME key ring and the SAME storage block as `api` (the organizer
      # is the only process that deletes staged attachment objects), plus its own
      # database variable: the organizer reads DATABASE_URL_SESSION, not DATABASE_URL.
      # The hook writes both files from one set of secrets so they cannot disagree.
      - ${APP_DATA_DIR}/data/env/organizer.env
      - ${APP_DATA_DIR}/data/env/settings.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  db:
    image: postgres:16.15@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    restart: on-failure
    environment:
      POSTGRES_USER: ohmail
      POSTGRES_DB: ohmail
    env_file:
      - ${APP_DATA_DIR}/data/env/db.env
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohmail -d ohmail"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: on-failure
    command: server /data
    env_file:
      - ${APP_DATA_DIR}/data/env/minio.env
    volumes:
      - ${APP_DATA_DIR}/data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    depends_on:
      minio:
        condition: service_healthy
    # One-shot, but retrying is safe (`--ignore-existing`), so a failed attempt — MinIO
    # blinking during a device reboot, say — heals itself instead of wedging `api`'s
    # start gate.
    restart: on-failure
    environment:
      S3_BUCKET: ohmail-staging
    env_file:
      - ${APP_DATA_DIR}/data/env/minio.env
    # One-shot bucket creation, idempotent across restarts. The storage client
    # deliberately has no CreateBucket call, so the bucket must exist before `api`
    # is allowed to start — otherwise the FIRST upload, not the boot, would fail.
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://ohmail_minio_1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$S3_BUCKET"

  mailpit:
    image: axllent/mailpit:v1.24.2@sha256:3ad9483ac2dea937ae402b95435ab12c3355d2373a1002a49491db0be536d8fa
    restart: on-failure
    # The default mail sink's web UI, LOOPBACK ON THE DEVICE ONLY: reachable over an SSH
    # tunnel for whoever wants to read verification mail before configuring a real SMTP
    # relay in settings.env. Never exposed to the network; drop the mapping entirely once
    # a relay is configured.
    ports:
      - "127.0.0.1:8025:8025"
