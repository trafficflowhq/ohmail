# The ohmail stack, shaped for umbrelOS. DRAFT — see ../README.md for status.
#
# Same seven services as deploy/selfhost/docker-compose.yml, with the differences a
# home-server OS imposes:
#
#   · No `.env` beside this file. umbrelOS apps have no install-time configuration, so
#     `hooks/pre-start` generates every secret on the device (once, kept under
#     ${APP_DATA_DIR}/env/) and seeds a `settings.env` the person edits for the one value
#     only they can know: OHMAIL_ORIGIN. The env files below are that hook's output.
#   · The proxy publishes host port 443 ONLY. umbrelOS itself serves its dashboard on
#     port 80, so the certificate comes over the TLS-ALPN challenge on 443 — the router
#     forwards outside 443 to this device and nothing else is needed.
#   · `app_proxy` (Umbrel's own front door) points at a small plain-HTTP site on the
#     proxy that redirects to the real origin, so the app's "Open" button lands people
#     on the https address instead of a page whose cookies cannot work.
#   · Hostnames inside the generated env files use Umbrel's container names
#     (`ohmail-server_db_1`, …), following the convention of the official apps.
#
# BEFORE ANY STORE SUBMISSION: pin every image below as `name:tag@sha256:…` — the store
# requires digests, and the ohmail images cannot be pinned until they are published.

version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ohmail-server_proxy_1
      # The launcher site: plain HTTP, answers every request with a redirect to
      # OHMAIL_ORIGIN. The product itself is served on 443 below.
      APP_PORT: 8099
      PROXY_AUTH_ADD: "false"

  proxy:
    image: caddy:2.10.2
    restart: on-failure
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    env_file:
      # OHMAIL_ORIGIN — the one value the operator sets, in settings.env.
      - ${APP_DATA_DIR}/env/settings.env
    ports:
      - "443:443"
    volumes:
      # The Caddyfile ships with the app (data/ is seeded into the app's data
      # directory on install); the two state dirs are created by hooks/pre-start.
      - ${APP_DATA_DIR}/data/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${APP_DATA_DIR}/data/caddy/state:/data
      - ${APP_DATA_DIR}/data/caddy/config:/config

  web:
    image: ghcr.io/trafficflowhq/ohmail-web:latest
    restart: on-failure
    environment:
      # Where the web container's session gate asks "is this cookie a live session?" — the api
      # by its Umbrel CONTAINER name (the same upstream the Caddyfile names), because
      # OHMAIL_ORIGIN resolves to this box's proxy from outside the app's network. Without it
      # the gate stays unarmed: signed-in visitors get the marketing page and a fresh box is
      # never steered to /setup. Mirrors deploy/selfhost/docker-compose.yml's web block.
      OHMAIL_INTERNAL_API_ORIGIN: http://ohmail-server_api_1:8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    image: ghcr.io/trafficflowhq/ohmail-server:latest
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    env_file:
      # Generated first, settings second: anything the operator sets (SMTP, the
      # Microsoft OAuth block, the private-network probe allowance) overrides the
      # generated defaults; the secrets themselves are only in the generated file.
      - ${APP_DATA_DIR}/env/api.env
      - ${APP_DATA_DIR}/env/settings.env
    healthcheck:
      # /health answers only after boot migrations verified the schema and the key
      # ring loaded — "healthy" means "migrated, keyed, serving", exactly as in the
      # reference stack.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  organizer:
    image: ghcr.io/trafficflowhq/ohmail-worker:latest
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    env_file:
      # Carries the SAME key ring and the SAME storage block as `api` (the organizer
      # is the only process that deletes staged attachment objects), plus its own
      # database variable: the organizer reads DATABASE_URL_SESSION, not DATABASE_URL.
      # The hook writes both files from one set of secrets so they cannot disagree.
      - ${APP_DATA_DIR}/env/organizer.env
      - ${APP_DATA_DIR}/env/settings.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  db:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: ohmail
      POSTGRES_DB: ohmail
    env_file:
      - ${APP_DATA_DIR}/env/db.env
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohmail -d ohmail"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: on-failure
    command: server /data
    env_file:
      - ${APP_DATA_DIR}/env/minio.env
    volumes:
      - ${APP_DATA_DIR}/data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      S3_BUCKET: ohmail-staging
    env_file:
      - ${APP_DATA_DIR}/env/minio.env
    # One-shot bucket creation, idempotent across restarts. The storage client
    # deliberately has no CreateBucket call, so the bucket must exist before `api`
    # is allowed to start — otherwise the FIRST upload, not the boot, would fail.
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://ohmail-server_minio_1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$S3_BUCKET"

  mailpit:
    image: axllent/mailpit:v1.24
    restart: on-failure
    # The default mail sink's web UI, loopback on the device: reachable over an SSH
    # tunnel for whoever wants to read verification mail before configuring a real
    # SMTP relay in settings.env.
    ports:
      - "127.0.0.1:8025:8025"
