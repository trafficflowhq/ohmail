# The ohmail SELF-HOST stack: everything a family install needs, on one box, from one file.
#
#   proxy      Caddy — the single origin. Routes the API's paths to `api` and everything
#              else to `web` (see ./Caddyfile). Automatic TLS when OHMAIL_ORIGIN is a domain.
#   web        the Next application, built with OHMAIL_FLAVOR=selfhost (no rewrite of its
#              own — the proxy owns the split).
#   api        the standalone server (apps/server). Runs BOTH migration journals at boot,
#              then mints the first-run setup token and prints it ONCE to this service's
#              log — `docker compose logs api` is the first thing to read on a fresh box.
#   organizer  the sync worker (apps/worker). The only process that opens IMAP to the
#              mail servers, and the only process that ever DELETES staged attachment
#              objects — which is why it carries the SAME storage variables as `api`:
#              an organizer without them would leave the staging bucket growing forever.
#   db         Postgres 16 — the operator's own database, plain URLs, no pooler.
#   minio      S3-compatible object storage for attachment staging. Internal only.
#   minio-init one shot: creates the staging bucket. MinIO does not auto-create buckets
#              and the storage client deliberately has no CreateBucket call — without this
#              the FIRST upload (not the boot) would be the thing that failed.
#   mailpit    an SMTP sink with a web UI (http://127.0.0.1:8025 on the box) so
#              verification and notification mail is viewable out of the box. Point
#              SMTP_URL at a real relay to deliver mail for real.
#
# Configuration lives in `.env` beside this file — copy `.env.example` and fill it in.
# Required values fail `docker compose config` loudly rather than booting half a stack.
#
# The three ohmail services run PREBUILT images from ghcr.io/trafficflowhq — `docker compose
# up -d` pulls them; OHMAIL_IMAGE_TAG in .env pins a version (default: latest). Each image is
# built BY THIS REPOSITORY'S OWN RELEASE WORKFLOW from the recipe in this tree —
# apps/server/Dockerfile, apps/worker/Dockerfile.selfhost, apps/webapp/Dockerfile — against
# the committed npm lockfile, so what an image contains is checkable against the source and
# the recipe beside it, and any of the three can be rebuilt from a clone:
# `docker build -f apps/server/Dockerfile .` from the repository root.
#
# Start order is dependency-checked, not hoped for: `api` waits for a HEALTHY database and
# a created bucket; `organizer` waits for a HEALTHY `api`, whose /health only answers after
# its boot migrations verified the schema — so the organizer can never race a cold
# database's migration.

name: ohmail

services:
  proxy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    environment:
      OHMAIL_ORIGIN: ${OHMAIL_ORIGIN:?set OHMAIL_ORIGIN in .env — the one browser origin this install serves, e.g. https://mail.example.com}
      # A PRIVATE ORIGIN'S ISSUER, as a switch rather than as configuration. `:+` substitutes
      # the literal text only when OHMAIL_TLS_INTERNAL is set and non-empty, so this variable
      # reaches the Caddyfile as exactly `tls internal` or as nothing — the operator's .env
      # cannot express any other Caddy directive. See the Caddyfile for what the default costs
      # on a name ACME can never issue for.
      OHMAIL_TLS_DIRECTIVE: ${OHMAIL_TLS_INTERNAL:+tls internal}
      # The staging bucket's name, because the Caddyfile's browser-upload route matches the
      # path `/<bucket>/*` — path-style object addressing puts the bucket in the URL. Must
      # stay the same value the api and organizer read, which the shared default guarantees.
      S3_BUCKET: ${S3_BUCKET:-ohmail-staging}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  web:
    image: ghcr.io/trafficflowhq/ohmail-web:${OHMAIL_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Where the web container's OWN session gate asks "is this cookie a live session?" —
      # the api by its in-network name, because OHMAIL_ORIGIN resolves to this box's proxy
      # from OUTSIDE the compose network (and `http://localhost` would point the web container
      # at itself). Read only by the selfhost-flavored build; the managed deployment's gate
      # runs on a compiled allow-list and never sees this variable.
      OHMAIL_INTERNAL_API_ORIGIN: http://api:8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    image: ghcr.io/trafficflowhq/ohmail-server:${OHMAIL_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      OHMAIL_ORIGIN: ${OHMAIL_ORIGIN:?set OHMAIL_ORIGIN in .env}
      DATABASE_URL: postgres://ohmail:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (URL-safe characters only)}@db:5432/ohmail
      # The key ring: TF_KEK_V1 required, higher versions optional so a ROTATION (add
      # TF_KEK_V2, keep TF_KEK_V1) is a .env edit rather than a compose edit. An empty value
      # reads as absent; the ring parser refuses gaps, and both processes read the same
      # variables so they cannot disagree about which version is active.
      TF_KEK_V1: ${TF_KEK_V1:?set TF_KEK_V1 in .env — 64 hex chars, e.g. `openssl rand -hex 32`; it encrypts mailbox credentials at rest}
      TF_KEK_V2: ${TF_KEK_V2:-}
      TF_KEK_V3: ${TF_KEK_V3:-}
      # Object storage for attachment staging — the bundled MinIO by default. The organizer
      # below MUST carry the identical block: it is the only process that deletes objects.
      # Browser uploads work through the proxy: grants are presigned against the PUBLIC origin
      # (S3_PUBLIC_ENDPOINT, defaulting to OHMAIL_ORIGIN in the server) and the Caddyfile's
      # `/<bucket>/*` route carries the PUT to MinIO with the Host preserved — same-origin for
      # the browser, valid SigV4 for the store. Set S3_PUBLIC_ENDPOINT only for an EXTERNAL
      # store whose own address is browser-reachable. This variable sits on `api` alone: it
      # shapes upload grants, and only the api mints those — the organizer's wire (download,
      # delete) stays on the in-network endpoint either way.
      TF_STORAGE_KIND: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-ohmail-staging}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env — the staging store credential}
      S3_BUCKET: ${S3_BUCKET:-ohmail-staging}
      # Outbound product mail (verification, notices). The bundled mailpit sink by default;
      # point SMTP_URL at a real relay to actually deliver. Both-or-neither: a half-set SMTP
      # block refuses the boot rather than pretending to send.
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-ohmail@selfhost.example}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      # Optional. Empty means: AI features answer as unconfigured, the add-mailbox probe
      # refuses private-network targets, no alert webhook is armed, no Microsoft 365 OAuth.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TF_PROBE_ALLOW_PRIVATE: ${TF_PROBE_ALLOW_PRIVATE:-}
      # A UnifiedPush distributor on your own LAN (an `ntfy` beside this server). Empty means
      # the endpoint a phone registers must be https and must resolve to a public address —
      # the organizer POSTs a content-free wake to it unattended, so the default refuses
      # private targets. DELIBERATELY NOT the same variable as TF_PROBE_ALLOW_PRIVATE: that one
      # permits ONE interactive dial behind a step-up session, this one permits a background
      # process to keep POSTing for as long as a registration lives. Set on BOTH services or
      # neither — the api validates the registration and the organizer dials it, and a value on
      # only one of them is a phone with a registration nothing ever rings.
      TF_PUSH_ALLOW_PRIVATE: ${TF_PUSH_ALLOW_PRIVATE:-}
      # The PUBLIC half of this install's wake-signing keypair, served to phones by
      # GET /push/vapid-key so a UnifiedPush connector can register with it. Not a secret: every
      # device that registers gets it, and it travels in the clear on every wake.
      #
      # TF_VAPID_PRIVATE_KEY IS DELIBERATELY ABSENT FROM THIS SERVICE. The api never signs a wake —
      # the organizer does — so a signing key here would be a capability with no caller, in the one
      # process that is reachable from the internet. A test asserts this omission, because "the api
      # holds only the public half" is the kind of property that is true until somebody tidies the
      # two blocks into a shared anchor.
      TF_VAPID_PUBLIC_KEY: ${TF_VAPID_PUBLIC_KEY:-}
      TF_ALERT_SECRET: ${TF_ALERT_SECRET:-}
      TF_ALERT_WEBHOOK_URL: ${TF_ALERT_WEBHOOK_URL:-}
      MS_OAUTH_CLIENT_ID: ${MS_OAUTH_CLIENT_ID:-}
      MS_OAUTH_CLIENT_SECRET: ${MS_OAUTH_CLIENT_SECRET:-}
      MS_OAUTH_TENANT: ${MS_OAUTH_TENANT:-}
      # Derived from the origin unless overridden: the exact URL the app registration must
      # list as a redirect URI. Read only when a Microsoft client is configured at all.
      MS_OAUTH_REDIRECT_URI: ${MS_OAUTH_REDIRECT_URI:-${OHMAIL_ORIGIN}/api/mailboxes/oauth/microsoft/callback}
      # THE SECOND MICROSOFT DOOR — a PUBLIC registration, driven by the device-code flow, for a
      # server with no app registration of its own. Unset is the default and means the door is dark:
      # the settings pane offers nothing and the two routes answer 503 naming this variable.
      #
      # It is a DIFFERENT registration from MS_OAUTH_CLIENT_ID and is never derived from it — a
      # confidential app's id fails the device grant outright, so borrowing it would turn a working
      # registration into a door that always fails. No secret: a public app has none.
      #
      # THE SAME PAIR IS ON THE ORGANIZER, deliberately and not as duplication to be tidied away:
      # a refresh token can only be renewed by the application that issued it, so a mailbox
      # connected through this door needs the organizer to hold the same public client id or it
      # stops syncing about an hour after it was connected.
      MS_DEVICE_CLIENT_ID: ${MS_DEVICE_CLIENT_ID:-}
      MS_DEVICE_TENANT: ${MS_DEVICE_TENANT:-}
    healthcheck:
      # /health is schema-complete or failing: the server migrates BEFORE it listens, and the
      # route 503s on a broken key ring — so "healthy" here really means "migrated, keyed,
      # serving". The organizer's start gate hangs off this.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  organizer:
    image: ghcr.io/trafficflowhq/ohmail-worker:${OHMAIL_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL_SESSION: postgres://ohmail:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/ohmail
      # WHO THIS ORGANIZER IS, in every mailbox's `ohmail/_meta` claim. REQUIRED, and unique
      # per install: without a value the worker's default identity is the one the HOSTED
      # service runs under, and two organizers sharing a name read each other's claims as
      # their own — dual organizing, the exact failure the claim exists to prevent, reached
      # the first time a mailbox that ohmail Cloud (or a second install) ever organized is
      # connected here. Generated once at install (`.env.example` shows the command) and
      # never changed: this install's claims are recognised as its own by this value.
      TF_ORGANIZER_INSTALL_ID: ${TF_ORGANIZER_INSTALL_ID:?set TF_ORGANIZER_INSTALL_ID in .env — this install's unique organizer identity, e.g. ohmail-selfhost:<openssl rand -hex 6>}
      # The SAME key ring as the api — the /health responses of the two carry a ring
      # fingerprint precisely so an operator can prove they agree.
      TF_KEK_V1: ${TF_KEK_V1:?set TF_KEK_V1 in .env}
      TF_KEK_V2: ${TF_KEK_V2:-}
      TF_KEK_V3: ${TF_KEK_V3:-}
      # THE SAME storage block as `api`, deliberately duplicated rather than shared through
      # indirection: the api MINTS staged attachment objects, the organizer is the only
      # process that ever DELETES them. Give the organizer a different (or no) block and the
      # bucket grows without bound while everything looks healthy.
      TF_STORAGE_KIND: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-ohmail-staging}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-ohmail-staging}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # THE SAME VALUE THE api GETS, and for the same reason the storage block above is
      # duplicated rather than shared: this process is the one that actually POSTs the wake, so a
      # value set on only one service produces a registration the api accepted and the organizer
      # refuses (logged as `push_wake_endpoint_refused`, invisible from the phone).
      TF_PUSH_ALLOW_PRIVATE: ${TF_PUSH_ALLOW_PRIVATE:-}
      # BOTH HALVES OF THE KEYPAIR, here and only here. This is the process that signs and sends a
      # wake, so it is the only one that needs the private key — and the only one that has it.
      #
      # Set neither and encrypted wakes are off: phones that registered for them are skipped (with
      # one log line saying so) and raw consumers still get the plaintext constant. Set them WRONG —
      # a mismatched pair, one half, a truncated paste — and the organizer refuses to send any wake
      # at all rather than let the arm that still works hide the mistake. `pnpm vapid:check` on the
      # host reports which of the three you are in.
      TF_VAPID_PUBLIC_KEY: ${TF_VAPID_PUBLIC_KEY:-}
      TF_VAPID_PRIVATE_KEY: ${TF_VAPID_PRIVATE_KEY:-}
      # Optional. RFC 8292's `sub` claim: a mailto: or https: URI a push service can use to reach
      # the operator about a misbehaving sender. Omitted from the signed token when unset, which is
      # conformant — the spec says SHOULD, and a made-up address would be a wrong fact in a token.
      TF_VAPID_SUBJECT: ${TF_VAPID_SUBJECT:-}
      TF_ALERT_WEBHOOK_URL: ${TF_ALERT_WEBHOOK_URL:-}
      MS_OAUTH_CLIENT_ID: ${MS_OAUTH_CLIENT_ID:-}
      MS_OAUTH_CLIENT_SECRET: ${MS_OAUTH_CLIENT_SECRET:-}
      MS_OAUTH_TENANT: ${MS_OAUTH_TENANT:-}
      MS_OAUTH_REDIRECT_URI: ${MS_OAUTH_REDIRECT_URI:-${OHMAIL_ORIGIN}/api/mailboxes/oauth/microsoft/callback}
      # THE PUBLIC CLIENT, HERE TOO — and this is the half that is easy to leave out.
      #
      # This process renews the access for every oauth mailbox, for ever. A refresh token can only
      # be renewed by the application that issued it, so a mailbox connected through the device-code
      # flow needs THIS service to hold the same public client id the api used. Set on the api alone,
      # such a mailbox connects, syncs once, and stops about an hour later — and it stops quietly,
      # because a rejected client is reported as "we could not reach Microsoft" rather than as a
      # dead credential, so nothing quarantines and nothing alerts.
      #
      # No redirect URI here: this door has none, which is the whole reason it works on a server
      # Microsoft has never heard of.
      MS_DEVICE_CLIENT_ID: ${MS_DEVICE_CLIENT_ID:-}
      MS_DEVICE_TENANT: ${MS_DEVICE_TENANT:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ohmail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ohmail
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohmail -d ohmail"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ohmail-staging}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ohmail-staging}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-ohmail-staging}
    # The one-shot bucket creation. `--ignore-existing` makes restarts idempotent. Grant
    # minting presigns locally — a missing bucket would surface only at the first UPLOAD,
    # which is why the bucket must exist before `api` is allowed to start.
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$S3_BUCKET"

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    ports:
      # The mail UI, loopback only: read verification mail on the box at http://127.0.0.1:8025.
      - "127.0.0.1:8025:8025"

volumes:
  db_data:
  minio_data:
  caddy_data:
  caddy_config:
