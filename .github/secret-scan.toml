# The secret scan ci.yml's plan job runs over a pull request's added lines, with the gitleaks image it pins.
# gitleaks' own rules, less generic-api-key (any long word near "key" or "token" in a diff), and one rule of
# this repository's: a key-ring key, the TF_*_V<n> variable the self-host guide names, set to 64 hex.
# ci.yml scans a control of each rule first, so a rule that stops matching fails the step.

[extend]
useDefault = true
disabledRules = ["generic-api-key"]

[[rules]]
id = "ohmail-key-ring"
description = "A key-ring key (the self-host guide's key variable, version n) set to 64 hex characters"
regex = '''\bTF_[K]EK_V[1-9][0-9]*["']?\s*[:=]\s*["']?([0-9a-fA-F]{64})\b'''
secretGroup = 1
keywords = ["_kek_v"]
