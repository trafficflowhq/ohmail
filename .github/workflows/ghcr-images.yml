# The self-host images: build the three recipes in THIS repository and push them to GHCR.
#
#   ghcr.io/trafficflowhq/ohmail-server   apps/server/Dockerfile             (the API host)
#   ghcr.io/trafficflowhq/ohmail-worker   apps/worker/Dockerfile.selfhost    (the organizer)
#   ghcr.io/trafficflowhq/ohmail-web      apps/webapp/Dockerfile             (the web app, selfhost flavor)
#
# BUILT HERE, FROM THIS TREE, BY THIS REPOSITORY'S OWN ACTIONS. The recipes build from the
# published source with the committed npm lockfile (`npm ci` inside each Dockerfile), so the
# images are provably produced from the code in front of you, by CI whose logs are public.
# Anyone can rebuild any of them from a clone, with BuildKit:
#   `docker build -f apps/server/Dockerfile .`
# Each recipe's build context is its own sibling `<Dockerfile>.dockerignore`, and only BuildKit
# reads a per-Dockerfile list; the legacy builder falls back to the root one and the build refuses
# by name. Install the buildx component if `docker buildx version` does not answer.
#
# RELEASE TAGS ONLY (plus a manual dispatch), deliberately: publishing images is a release
# act, so it runs on the release cadence and costs nothing between. The repository guard on
# every job keeps this inert on forks — a fork's run would try to push to this project's
# GHCR namespace and fail on permissions; refusing to start is clearer.
#
# NOTHING MOVES A PUBLIC TAG UNTIL EVERY GATE IS GREEN. The order is the design:
#
#   1. mirror-images — every image the stack boots that we do NOT build is copied into our own
#                      registry from `deploy/selfhost/images.lock`, by digest. Idempotent: a row
#                      already carrying its locked digest is verified, not re-pushed.
#   2. build-push    — each image × architecture builds NATIVELY and pushes a RUN-SCOPED
#                      staging tag (`stage-<version>-<run id>-<arch>`), then the prune check
#                      runs against exactly that tag. Run-scoped so no concurrent or later
#                      run can swap a checked layer for an unchecked one under the same name;
#                      the `concurrency` group below serializes runs besides.
#   3. gate-boot     — a FRESH CLONE of this repository boots the staged images through
#                      deploy/selfhost, exactly as the README tells a stranger to, and the
#                      stack must answer: /hello through the proxy, the web app, a healthy
#                      organizer. This is the claim's own test, before any public tag exists.
#                      ONCE PER ARCHITECTURE, each on its own native hardware — an image that
#                      only ever compiled is not an image anyone has run.
#   4. gate-visibility — the packages must be ANONYMOUSLY pullable, checked against a staged
#                      manifest. GHCR packages are born private and no workflow can flip
#                      that; on a first release this gate is EXPECTED to fail, its message
#                      names the one-time fix, and — because promotion has not run — the
#                      public tags have not moved at all.
#   5. promote       — only after 1–4 are green do the real tags move, as manifest-list
#                      compositions of the staged pair (no rebuild, so what was checked is what
#                      ships), and the promoted tags are then asserted anonymously pullable
#                      themselves. In TWO passes with a gate between them: every `<version>`
#                      manifest first, then — and only once all three are readable — `latest`,
#                      pointed at the version manifest rather than recomposed from the staging
#                      pair. See the step comments for the skew that ordering exists to stop.
#
# Promotion is six registry writes; each is retried once, and a failure prints which tags moved —
# re-running heals forward, because the run's staging tags persist. The residual window is three
# writes of `latest`, with every version tag whole behind it; pin OHMAIL_IMAGE_TAG to avoid it.
#
# Multi-arch: linux/amd64 + linux/arm64, each built AND BOOTED NATIVELY — GitHub's hosted
# arm64 runners (`ubuntu-24.04-arm`) are free for public repositories, which is both faster
# and less flaky than emulating a Node toolchain under QEMU.
#
# EVERY OTHER IMAGE IN THE COMPOSE HAS AN arm64 VARIANT, which is what makes the arm64 boot
# gate possible rather than aspirational: caddy, postgres, minio, minio/mc and mailpit all
# publish linux/arm64 in their own manifest lists — and we now serve those manifests ourselves,
# whole, so the arm64 half of each is ours to keep too. The base these three are built from
# (`node:22-bookworm-slim`) publishes arm64/v8. Checked against the registries, not assumed.
# `npm ci` picks the matching native halves off the committed lockfile — it records every
# platform's optional package with its `cpu`/`os` fields, so `@next/swc-linux-arm64-gnu` and
# `lightningcss-linux-arm64-gnu` install on the arm runner from the same lockfile the amd64
# runner installs the x64 ones from. The bundler is the one exception and is not a hole: the
# two bundled recipes install `esbuild@0.24.0` explicitly beside the build rather than from
# the lockfile, and npm resolves ITS platform package (`@esbuild/linux-arm64` here) the same
# way — by the host it is running on, which on a native runner is the host we want. No
# Dockerfile downloads a platform-specific binary by URL; nothing is kept in step by hand.

name: ghcr-images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for the images (e.g. 0.9.8). Must match the tree's own version; 'latest' is always also promoted."
        required: false
      candidate:
        description: "A release CANDIDATE: the 40-hex commit these images are built from. Pushes only rc-<sha>; no version tag and no latest."
        required: false

permissions:
  contents: read
  packages: write

# One release at a time. Staging tags are run-scoped so an overlap could not cross-promote
# anyway; serializing keeps `latest` from being decided by a race between two green runs.
concurrency:
  group: ghcr-images
  cancel-in-progress: false

jobs:
  # One place decides the tags, and it is DATA, never shell source: a dispatch input (or a
  # tag name — git allows `$` and parentheses in one) interpolated into a run: block would
  # execute with this workflow's packages:write token. Read through the environment, validate
  # against docker's own tag grammar, and refuse anything else.
  #
  # THE DECISION LIVES IN A SCRIPT (`.github/scripts/ghcr-image-tags.sh`) because a workflow's
  # YAML can be read by a test and a workflow's shell can only be run by GitHub. It answers with
  # four values, and `promote_public` is the one that decides whether any public tag moves:
  # a CANDIDATE run (`candidate: <40 hex>`) builds `rc-<sha>` and moves nothing.
  version:
    if: github.repository == 'trafficflowhq/ohmail'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.decide.outputs.version }}
      candidate: ${{ steps.decide.outputs.candidate }}
      image_tag: ${{ steps.decide.outputs.image_tag }}
      promote_public: ${{ steps.decide.outputs.promote_public }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide and validate the tags
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          DISPATCH_CANDIDATE: ${{ github.event.inputs.candidate }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TREE_VERSION="$(node -p 'require("./package.json").version')" \
            bash .github/scripts/ghcr-image-tags.sh >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # THE THIRD-PARTY HALF OF THE STACK, SERVED BY US. `deploy/selfhost/images.lock` names every
  # image the compose boots that this repository does not build — caddy, postgres, minio, mc and
  # mailpit — and this job copies each into `ghcr.io/trafficflowhq` before the boot gate needs it.
  #
  # WHY IT EXISTS: on 2026-09-12 both MinIO repositories were deleted from Docker Hub, and every
  # self-host install — on the release before this one as much as on this one — could no longer
  # pull its object store. The boot gate caught it and refused to promote, which is the gate
  # working; but an upstream can do that on any day, to any of these, and a release is not the
  # only thing it breaks. An install that pulls only from us cannot be taken down that way.
  #
  # `crane copy` re-pushes the manifest unchanged, so our copy answers to the SAME digest as the
  # original — which is what makes one column in the lock the identity of both and lets anyone
  # verify our mirror against upstream. `buildx imagetools create` would recompose the index and
  # is the wrong tool here for exactly that reason.
  #
  # IDEMPOTENT, and the script asks the DESTINATION first: a row already carrying its locked
  # digest is verified with no push and no upstream contact at all. Deletions upstream cannot
  # reach a release once the row is mirrored. The decision lives in a script for the same reason
  # the tag decision does — a workflow's YAML can be read by a test, its shell can only be run.
  mirror-images:
    if: github.repository == 'trafficflowhq/ohmail'
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: imjasonh/setup-crane@v0.4

      - name: Mirror every third-party image the lock names
        run: bash .github/scripts/mirror-images.sh

  build-push:
    if: github.repository == 'trafficflowhq/ohmail'
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [ohmail-server, ohmail-worker, ohmail-web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: ohmail-server
            dockerfile: apps/server/Dockerfile
          # The organizer's SELF-HOST recipe — the sibling plain `Dockerfile` is the managed
          # deployment's and builds only in the development workspace.
          - image: ohmail-worker
            dockerfile: apps/worker/Dockerfile.selfhost
          - image: ohmail-web
            dockerfile: apps/webapp/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the run-scoped STAGING tag (native ${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/trafficflowhq/${{ matrix.image }}:stage-${{ needs.version.outputs.version }}-${{ github.run_id }}-${{ matrix.arch }}
          # The source label points at this repository — the tree these images are built from.
          labels: |
            org.opencontainers.image.source=https://github.com/trafficflowhq/ohmail
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.revision=${{ github.sha }}
          # WHICH COMMIT THE RUNNING IMAGE CAN NAME. The label above is metadata a registry reader
          # sees; this is the same commit baked into the image, so the server's `/health`, the
          # organizer's build label and the web app's About pane answer it too. Without it all
          # three answered `dev` and only the registry digest identified a build. On a tag build
          # `github.sha` is the tagged commit.
          build-args: |
            TF_BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

      # The image-prune check, against the staged image and BEFORE any real tag exists: a
      # runtime layer must not carry what its recipe promises to exclude. The server and the
      # organizer are single-file bundles — no src/, no test/, no node_modules at all. The web
      # image still carries src (its runtime shape copies the built workspace — stated in its
      # Dockerfile) but must never carry a test tree. Findings are captured into a variable
      # and asserted with `test -z` — never `! producer | grep -q .`, where the producer dying
      # reads as a pass.
      - name: Prune check — no test trees in any runtime, no source or modules in the bundles
        env:
          IMG: ghcr.io/trafficflowhq/${{ matrix.image }}:stage-${{ needs.version.outputs.version }}-${{ github.run_id }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          HITS=$(docker run --rm --entrypoint sh "$IMG" -c \
            'find /app -type d \( -name test -o -name tests \) -not -path "*/node_modules/*"')
          test -z "$HITS" || { echo "test trees in $IMG:"; echo "$HITS"; exit 1; }
          if [ "${{ matrix.image }}" != "ohmail-web" ]; then
            SRC=$(docker run --rm --entrypoint sh "$IMG" -c \
              'find /app -type d \( -name src -o -name node_modules \)')
            test -z "$SRC" || { echo "src/module trees in $IMG:"; echo "$SRC"; exit 1; }
          fi

  # The boot gate: what the README tells a stranger must work from the PUBLIC tree with the
  # images this run just staged — clone, copy the env template, fill the five required
  # values, `docker compose up -d`, and the stack answers. Runs BEFORE promotion, so a
  # release that cannot boot never moves a public tag. Pulls authenticate: whether a stranger
  # can pull is gate-visibility's question, not this one's.
  #
  # ONCE PER ARCHITECTURE, ON THAT ARCHITECTURE'S OWN HARDWARE. The images were multi-arch
  # before this gate was, and for several releases the arm64 half was only ever COMPILED:
  # every runtime claim behind "runs on arm64" rested on the amd64 boot. That is a claim
  # about the wrong binary. A native runner costs nothing on a public repository, every
  # image in the compose publishes arm64 (the header lists them), and the failures this
  # catches are exactly the ones a cross-build cannot: a native module that resolved to the
  # wrong platform half, a base layer with no arm64 variant, an entrypoint that starts and
  # then dies. `matrix.arch` also selects the staging tag, so each leg boots the three
  # images this run staged for its own architecture — never a promoted tag, which does not
  # exist yet.
  gate-boot:
    if: github.repository == 'trafficflowhq/ohmail'
    needs: [version, build-push, mirror-images]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # Both arches are reported. Stopping the arm64 boot because amd64 failed would hide
      # which half is broken, and the promotion is blocked by either failing regardless.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone the public repository
        run: git clone --depth 1 https://github.com/trafficflowhq/ohmail.git mirror

      - name: The clone must carry the deployment this gate is about
        run: |
          set -euo pipefail
          if [ ! -f mirror/deploy/selfhost/docker-compose.yml ]; then
            echo "The public repository does not carry deploy/selfhost yet. The source publish"
            echo "and the image release are separate acts; publish the source, then re-run."
            exit 1
          fi

      - name: Configure from the template, exactly as the README says
        working-directory: mirror/deploy/selfhost
        env:
          STAGE_TAG: stage-${{ needs.version.outputs.version }}-${{ github.run_id }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          cp .env.example .env
          {
            echo "OHMAIL_ORIGIN=http://localhost"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "TF_KEK_V1=$(openssl rand -hex 32)"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "TF_ORGANIZER_INSTALL_ID=ohmail-selfhost:smoke-$(openssl rand -hex 6)"
            echo "OHMAIL_IMAGE_TAG=$STAGE_TAG"
          } >> .env
          docker compose config -q

      - name: Boot cold from the staged images (native ${{ matrix.arch }})
        working-directory: mirror/deploy/selfhost
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # EVERY IMAGE THIS STACK BOOTS IS ONE OF OURS, asserted against the tree an operator
          # actually clones. The root test asserts it in the monorepo; this is the same claim
          # measured on the published artifact, which is the one that ships.
          for REF in $(docker compose config --images); do
            case "$REF" in
              (ghcr.io/trafficflowhq/*) : ;;
              (*) echo "refusing: $REF is not served by us — see deploy/selfhost/images.lock"; exit 1 ;;
            esac
          done
          # PULLED ONE BY ONE, so an image that cannot be fetched is reported AS that image and
          # that registry. On 2026-09-12 this gate died at `minio-init` and the operative line was
          # `pull access denied for minio/mc` — the whole diagnosis, arrived at by reading a
          # service's crash. It is produced on purpose now rather than found in a log.
          FAILED=""
          for REF in $(docker compose config --images); do
            docker pull -q "$REF" >/dev/null 2>&1 || FAILED="$FAILED $REF"
          done
          if [ -n "$FAILED" ]; then
            echo "the stack could not pull:"
            for REF in $FAILED; do echo "  $REF   (registry: ${REF%%/*})"; done
            exit 1
          fi
          # WHAT THIS GATE RAN IS ASSERTED, NOT INFERRED FROM THE RUNNER LABEL. A matrix
          # whose tag suffix and runner drifted apart would boot one architecture twice and
          # report two green arches — and on hardware with binfmt installed it would not
          # even fail loudly. Ask the images themselves, before anything starts.
          for IMG in ohmail-server ohmail-worker ohmail-web; do
            REF=$(docker compose config --images | grep "/$IMG:")
            GOT=$(docker image inspect --format '{{.Architecture}}' "$REF")
            [ "$GOT" = "$ARCH" ] || { echo "$REF is $GOT, this gate is $ARCH"; exit 1; }
          done
          docker compose up -d
          # /hello through the proxy is the stranger's first request; the api healthcheck
          # already gates the organizer's start. Poll rather than sleep.
          BODY=""
          for i in $(seq 1 60); do
            if BODY=$(curl -fsS http://localhost/hello 2>/dev/null); then break; fi
            sleep 5
          done
          echo "$BODY"
          echo "$BODY" | grep -q '"needsSetup":true'
          # The web application must answer too — the proxy serving /hello proves only the
          # API path, and a stack whose web container died still passes that.
          curl -fsS -o /dev/null http://localhost/
          # And the organizer must reach HEALTHY: a mail product whose sync process is in a
          # crash loop is not "up". Poll its healthcheck through compose.
          for i in $(seq 1 36); do
            H=$(docker compose ps organizer --format '{{.Health}}' || true)
            [ "$H" = "healthy" ] && break
            sleep 5
          done
          [ "$H" = "healthy" ] || { echo "organizer never became healthy:"; docker compose ps; exit 1; }

      - name: Service logs on failure
        if: failure()
        working-directory: mirror/deploy/selfhost
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        working-directory: mirror/deploy/selfhost
        run: docker compose down -v

  # The compose an operator runs pulls ANONYMOUSLY, and a GHCR package is born private —
  # nothing in any workflow can flip that (it is a one-time change in each package's own
  # settings, made by a person with admin rights on it). Checked against a STAGED manifest,
  # BEFORE promotion: on a first release this gate is EXPECTED to fail, its message says
  # exactly what to do, and the public tags have not moved.
  gate-visibility:
    if: github.repository == 'trafficflowhq/ohmail'
    needs: [version, build-push, mirror-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Anonymous-pull gate — the packages must be publicly pullable
        env:
          TAG: stage-${{ needs.version.outputs.version }}-${{ github.run_id }}-amd64
        run: |
          set -euo pipefail
          check() { # <package> <reference>
            TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:trafficflowhq/$1:pull" | jq -r .token)
            curl -fsS -o /dev/null \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/trafficflowhq/$1/manifests/$2"
          }
          PRIVATE=""
          for IMG in ohmail-server ohmail-worker ohmail-web; do
            check "$IMG" "$TAG" || PRIVATE="$PRIVATE $IMG"
          done
          # THE MIRRORED IMAGES ARE CHECKED TOO, and they are the likelier half to be wrong: a
          # GHCR package is born PRIVATE, so the first release that mirrors a new row creates a
          # package nobody but us can pull. The compose would then name a registry an operator
          # cannot read — the same broken boot this mirroring exists to prevent, from the other
          # side. Read from the lock so a new row is covered the day it is added.
          while read -r NAME UPSTREAM _ _ _; do
            case "$NAME" in ""|\#*) continue ;; esac
            check "$NAME" "${UPSTREAM##*:}" || PRIVATE="$PRIVATE $NAME"
          done < deploy/selfhost/images.lock
          if [ -n "$PRIVATE" ]; then
            echo "not anonymously pullable:$PRIVATE"
            echo "One-time fix per package: package settings -> Danger Zone -> Change visibility"
            echo "-> Public. Then re-run this workflow."
            exit 1
          fi

  # The fan-in, LAST: only when every build, the prune checks, the boot and the visibility
  # gates are green do the real tags move, as manifest-list compositions of the staged pair —
  # no rebuild, so what was checked is what ships. Each composition is retried once; a
  # failure prints exactly which images moved, and re-running the workflow heals forward.
  # THE CANDIDATE'S OWN PROMOTION: one tag per image, `rc-<sha>`, composed from the same staged
  # pair the gates booted. No version tag, no `latest` — an unreleased build reaching an unpinned
  # install is the whole thing this shape exists to prevent, so the two promotions are two jobs
  # rather than one job with a flag inside it.
  promote-candidate:
    if: github.repository == 'trafficflowhq/ohmail' && needs.version.outputs.promote_public == 'no'
    needs: [version, build-push, gate-boot, gate-visibility]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: One manifest list per image, under rc-<sha> and nothing else
        env:
          V: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.image_tag }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # The guard, on the tag this job is about to write: a candidate job that found itself
          # holding a public tag would be the defect, so it refuses rather than writes.
          case "$TAG" in
            (rc-*) : ;;
            (*) echo "refusing: the candidate job may only write rc-* tags, and was given '$TAG'"; exit 1 ;;
          esac
          for IMG in ohmail-server ohmail-worker ohmail-web; do
            docker buildx imagetools create \
              -t "ghcr.io/trafficflowhq/$IMG:$TAG" \
              "ghcr.io/trafficflowhq/$IMG:stage-$V-$RUN-amd64" \
              "ghcr.io/trafficflowhq/$IMG:stage-$V-$RUN-arm64"
          done
          for IMG in ohmail-server ohmail-worker ohmail-web; do
            docker buildx imagetools inspect --raw "ghcr.io/trafficflowhq/$IMG:$TAG" > /dev/null
          done
          echo "candidate images ready: OHMAIL_IMAGE_TAG=$TAG"

  promote:
    if: github.repository == 'trafficflowhq/ohmail' && needs.version.outputs.promote_public == 'yes'
    needs: [version, build-push, gate-boot, gate-visibility]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The same refusal as a step, not only as a job condition: an `if:` edited away is a public
      # tag moved, and this is the one place where that is unrecoverable for every unpinned install.
      - name: Refuse to promote a candidate
        env:
          CANDIDATE: ${{ needs.version.outputs.candidate }}
          PROMOTE: ${{ needs.version.outputs.promote_public }}
        run: |
          set -euo pipefail
          if [ -n "$CANDIDATE" ] || [ "$PROMOTE" != "yes" ]; then
            echo "refusing: this run is a candidate ($CANDIDATE); latest and the version tag stay where they are"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TWO PASSES, `latest` SECOND. Three images are three registry writes and nothing makes them
      # one, so a puller mid-promotion sees a mixture — and under the old single pass that mixture
      # could be a new `latest` server beside an old `latest` worker, which accepts mail scheduled
      # for later without running its sender clock.
      #
      # Pass 1 writes only `<version>`: a part-way failure has moved no public tag. The gate then
      # requires all three readable, so a version tag never exists for one image alone — which is
      # what makes `OHMAIL_IMAGE_TAG=<version>` an atomic choice. Pass 2 points `latest` at that
      # checked manifest, so one image's two tags cannot disagree. The residual three-write window
      # is answered by pinning.
      - name: Pass 1 — one manifest list per image, under the version tag only
        env:
          V: ${{ needs.version.outputs.version }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          MOVED=""
          for IMG in ohmail-server ohmail-worker ohmail-web; do
            ok=0
            for attempt in 1 2; do
              if docker buildx imagetools create \
                   -t "ghcr.io/trafficflowhq/$IMG:$V" \
                   "ghcr.io/trafficflowhq/$IMG:stage-$V-$RUN-amd64" \
                   "ghcr.io/trafficflowhq/$IMG:stage-$V-$RUN-arm64"; then
                ok=1; break
              fi
              echo "imagetools create failed for $IMG:$V (attempt $attempt)"
            done
            if [ "$ok" -ne 1 ]; then
              echo 'PROMOTION INCOMPLETE, and latest has NOT moved for any image.'
              echo "Version tags written this run: ${MOVED:-none}."
              echo "The run's staging tags persist — re-run this workflow to finish the set."
              exit 1
            fi
            MOVED="$MOVED $IMG"
          done

      - name: The gate — every version manifest is readable before any latest moves
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for IMG in ohmail-server ohmail-worker ohmail-web; do
            docker buildx imagetools inspect --raw "ghcr.io/trafficflowhq/$IMG:$V" > /dev/null \
              || { echo "ghcr.io/trafficflowhq/$IMG:$V is not readable — refusing to move latest"; exit 1; }
          done
          echo "all three $V manifests readable"

      - name: Pass 2 — latest, last, pointed at the version manifest just checked
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          MOVED=""
          for IMG in ohmail-server ohmail-worker ohmail-web; do
            ok=0
            for attempt in 1 2; do
              if docker buildx imagetools create \
                   -t "ghcr.io/trafficflowhq/$IMG:latest" \
                   "ghcr.io/trafficflowhq/$IMG:$V"; then
                ok=1; break
              fi
              echo "imagetools create failed for $IMG:latest (attempt $attempt)"
            done
            if [ "$ok" -ne 1 ]; then
              echo "LATEST INCOMPLETE. Moved this run: ${MOVED:-none}."
              echo "Every $V tag is in place, so an install pinned to $V is whole."
              echo "Re-run this workflow to finish the set."
              exit 1
            fi
            MOVED="$MOVED $IMG"
          done

      # The promoted tags themselves must be anonymously pullable — same check as the gate,
      # now against what the README actually names. It can only fail if visibility changed
      # mid-run or the registry misbehaved after an identical pre-check passed.
      - name: The promoted tags answer an anonymous pull
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for IMG in ohmail-server ohmail-worker ohmail-web; do
            TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:trafficflowhq/$IMG:pull" | jq -r .token)
            curl -fsS -o /dev/null \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/trafficflowhq/$IMG/manifests/$V"
          done
