name: guard

# The workflows, their tools and the gate change only on a maintainer branch of this repository.
#
# Every pull request is refused when its tree holds a file of a font kind, or any commit it would merge
# adds or changes one. A pull request that changes `.github/`, `scripts/` or `.gate/` is refused unless a
# maintainer opened it from a `pr/<name>` branch of this repository (a name of letters, digits, `.`, `_`
# and `-`), and one carrying a `Monorepo-Commit:` line in a commit message, its title or its description
# is refused too; a maintainer's `publish/<utc>-<sha12>` branch is admitted apart from the font rule. Who
# counts as a maintainer, and what the rules cannot see, is in .github/scripts/assert-pr-guard.sh.
#
# `pull_request_target`, for the reason dco.yml gives: the checker comes from the BASE, the commits
# under review are fetched as objects and read with git, and nothing out of them runs. The title and
# the description reach the checker as a JSON file, never through this file's own text or the
# environment. In a merge group the pull request is read from the API by the number in the group's ref.
# Proof of the maintainer branch rule; this pull request is closed without merging.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: the workflows, their tools and the gate change only on a maintainer branch of this repository
    runs-on: ubuntu-latest
    steps:
      - name: check out the BASE revision — the checker must not come from the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 0

      - name: fetch the commits under review as OBJECTS, and the pull request as a file
        id: subject
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          pr="$RUNNER_TEMP/pull-request.json"
          if [ -n "${PR_NUMBER:-}" ]; then
            git fetch --no-tags --force origin "+refs/pull/${PR_NUMBER}/head:refs/guard/head"
            jq '.pull_request' "$GITHUB_EVENT_PATH" > "$pr"
            base="$PR_BASE"
          elif [ -n "${MG_HEAD_REF:-}" ]; then
            git fetch --no-tags --force origin "+${MG_HEAD_REF}:refs/guard/head"
            n="$(printf '%s' "$MG_HEAD_REF" | sed -n 's#^refs/heads/gh-readonly-queue/[^/]*/pr-\([0-9][0-9]*\)-[0-9a-f]*$#\1#p')"
            [ -n "$n" ] || { echo "guard: the merge group's ref names no pull request." >&2; exit 1; }
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${n}" > "$pr"
            base="$MG_BASE"
          else
            echo "guard: neither a pull_request_target nor a merge_group payload named a head. Refusing." >&2
            exit 1
          fi
          [ -n "$base" ] || { echo "guard: no base sha in the event payload. Refusing." >&2; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse refs/guard/head)" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: the workflows, their tools and the gate change only on a maintainer branch of this repository
        # The script comes from the base checkout above. Only two SHAs and a file path reach it.
        run: bash .github/scripts/assert-pr-guard.sh "${{ steps.subject.outputs.base }}" "${{ steps.subject.outputs.head }}" "${{ steps.subject.outputs.pr }}"
