name: ci

# The test suite, on every pull request, nightly and by hand.
#
# The suite runs serially in measured shards (test/support/ci-shards.json). Each shard gets its own
# Postgres, GreenMail and RustFS and makes its own database with scripts/lane-db.sh, so the
# *.pg.test.ts files run against a real server. TF_REQUIRE_PG=1 turns a missing database into a failure
# instead of a skip. A file marked `@postpush: alone` runs in a job of its own on a database made from
# empty, because it reads state its own seeding does not own. A new test file needs no edit here: a
# file the shard map does not name runs in the shard its path hashes to.
#
# The hosted runners are one pool for the whole organisation, so each matrix bounds how many of its
# jobs run at once (max-parallel): three suite shards, one alone file, one SQLite shard.
#
# Where the jobs run. Every job here, and build.yml's two engine jobs, run on the maintainers' own self-hosted
# runners when the repository variable OHMAIL_LINUX_RUNNER reads `zorin`, and then only for the nightly schedule, a
# push to main and a maintainer's pull request (a `pr/` branch of this repository, opened by a person who is its
# owner, a member or a collaborator, as guard.yml's door reads one), never for a run a bot started; each job runs in
# a fresh virtual machine of its own, with the same services. A fork's pull request, every other pull request, and
# every run while the variable is unset or reads `hosted`, runs on GitHub's ubuntu-latest
# (test/workflows-route-linux-jobs.test.ts).

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  plan:
    name: suite · plan
    runs-on: ${{ vars.OHMAIL_LINUX_RUNNER == 'zorin' && github.repository == 'trafficflowhq/ohmail' && !endsWith(github.actor, '[bot]') && !endsWith(github.triggering_actor, '[bot]') && (github.event_name == 'schedule' || github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'pr/') && github.event.pull_request.user.type == 'User' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) && fromJSON('["self-hosted","ohmail-zorin"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      alone: ${{ steps.plan.outputs.alone }}
      sqlite: ${{ steps.plan.outputs.sqlite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3

      - name: The shards, and the files that run alone
        id: plan
        run: |
          set -euo pipefail
          node test/support/ci-shards.mjs --check
          echo "shards=$(node test/support/ci-shards.mjs --indexes)" >> "$GITHUB_OUTPUT"
          echo "sqlite=$(node test/support/ci-shards.mjs --sqlite-indexes)" >> "$GITHUB_OUTPUT"
          # The glob form: a bare 'apps/*/test' pathspec matches no file under it, and an empty list
          # here would skip these files everywhere. The shard map's own walk must agree with it.
          rc=0
          files=$(git grep -l '@postpush: alone' -- ':(glob)apps/*/test/**' ':(glob)packages/*/test/**') || rc=$?
          if [ "$rc" -gt 1 ]; then echo "git grep failed rc $rc" >&2; exit "$rc"; fi
          alone=$(printf '%s' "$files" | node -e 'const t=require("fs").readFileSync(0,"utf8");process.stdout.write(JSON.stringify(t.split("\n").filter(Boolean).sort()))')
          walk=$(node test/support/ci-shards.mjs --alone)
          if [ "$alone" != "$walk" ]; then echo "::error::git grep and the shard map disagree on the files that run alone"; exit 1; fi
          echo "alone=$alone" >> "$GITHUB_OUTPUT"
          printf 'alone:\n%s\n' "$files"

  suite:
    name: suite (${{ matrix.shard }})
    needs: plan
    runs-on: ${{ vars.OHMAIL_LINUX_RUNNER == 'zorin' && github.repository == 'trafficflowhq/ohmail' && !endsWith(github.actor, '[bot]') && !endsWith(github.triggering_actor, '[bot]') && (github.event_name == 'schedule' || github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'pr/') && github.event.pull_request.user.type == 'User' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) && fromJSON('["self-hosted","ohmail-zorin"]') || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # Every image by digest, the same ones docker-compose.yml runs: Postgres from our mirror
    # (deploy/selfhost/images.lock), GreenMail and Dovecot as Docker Hub serves them.
    services:
      postgres:
        image: ghcr.io/trafficflowhq/mirror-postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: tf
          POSTGRES_PASSWORD: tf
          POSTGRES_DB: trafficflow_test
        ports: ["5433:5432"]
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U tf -d trafficflow_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      greenmail:
        image: greenmail/standalone:2.1.3@sha256:d6db42a4fc258fec0948b1ae7b579fd06947cc92087c162ec0597972a6c36850
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.users.login=email"
        ports: ["3143:3143", "3025:3025"]
    env:
      DATABASE_URL_PG_TEST: postgres://tf:tf@localhost:5433/trafficflow_test
      IMAP_HOST: 127.0.0.1
      IMAP_PORT: "3143"
      TF_REQUIRE_PG: "1"
      TF_REQUIRE_RUSTFS: "1"
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3

      - name: Install the locked dependency tree
        run: bash "$GITHUB_WORKSPACE/.github/scripts/retry-infra.sh" npm-network -- npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply the patches this repository carries
        run: node scripts/apply-patches.mjs apply

      - name: Install Chromium for the layout tests
        run: npx playwright install --with-deps chromium

      # Paper's UI face names Inter, and the geometry arms that sit near a threshold were measured in it
      # (apps/webapp/test/_measured-font.ts); without it they skip by name instead of measuring.
      - name: The font the layout tests were measured in
        run: sudo apt-get install -y --no-install-recommends fonts-inter

      # tsc -b over the project graph: the tests that load a package's built output read this.
      - name: The project build
        run: npm run build

      # The engine, the phone's engine and the self-host bundles, built as the release, the phone
      # build and the images build them; the tests that read a bundle read these.
      - name: Build the engine and the host bundles
        run: |
          set -euo pipefail
          node scripts/engine-bundle.mjs
          node apps/mobile/scripts/bundle-engine.mjs
          node scripts/bundle-host.mjs server
          node scripts/bundle-host.mjs worker

      # A service container cannot publish a port on loopback only, so RustFS starts by `docker run`.
      - name: Start RustFS
        env:
          RUSTFS_ACCESS_KEY: tf-staging
          RUSTFS_SECRET_KEY: tf-staging-password
          RUSTFS_CHECK_UPDATE: "false"
          RUSTFS_CONSOLE_ENABLE: "false"
        run: |
          set -euo pipefail
          docker run -d --name rustfs -p 127.0.0.1:3902:9000 -e RUSTFS_ACCESS_KEY -e RUSTFS_SECRET_KEY \
            -e RUSTFS_CHECK_UPDATE -e RUSTFS_CONSOLE_ENABLE \
            ghcr.io/trafficflowhq/mirror-rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3902/health/ready >/dev/null 2>&1; then echo "rustfs ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "rustfs never came up"; exit 1

      - name: Does this shard dial Dovecot
        id: dovecot
        run: echo "needed=$(node test/support/ci-shards.mjs --needs-dovecot "$SHARD")" >> "$GITHUB_OUTPUT"

      # Dovecot is the CONDSTORE server. It reads its configuration from the checkout, which a
      # service container starts before, so it is started here and only where a file dials it.
      - name: Start Dovecot
        if: steps.dovecot.outputs.needed == 'yes'
        run: |
          set -euo pipefail
          docker run -d --name dovecot -v "$GITHUB_WORKSPACE/test/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro" \
            -p 127.0.0.1:3144:143 dovecot/dovecot:2.3.21@sha256:1c18c756f20d03867077a1b509a6e2e3008ab1eafa56377b6f2eca12dc1ba581
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/3144) 2>/dev/null; then echo "dovecot up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "dovecot never came up"; exit 1

      # An open port is not an IMAP server: this waits for GreenMail's own "* OK" greeting.
      - name: Wait for GreenMail IMAP
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/3143 && read -r -t 5 greeting <&3 && [[ "$greeting" == "* OK"* ]]) 2>/dev/null; then
              echo "greenmail greeted after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "greenmail never greeted"; exit 1

      - name: This checkout's own database
        run: bash scripts/lane-db.sh "$GITHUB_WORKSPACE"

      - name: Test shard ${{ matrix.shard }} (real Postgres required)
        run: |
          set -euo pipefail
          list=$(node test/support/ci-shards.mjs --shard "$SHARD")
          mapfile -t files <<< "$list"
          echo "shard $SHARD runs ${#files[@]} file(s)"
          mkdir -p build
          npx vitest run --reporter=default --reporter=json --outputFile="build/ci-suite-$SHARD.json" "${files[@]}"

      # vitest runs the paths it can match and says nothing of one it cannot, so the report is
      # read back: every file the shard named ran, and nothing else did.
      - name: Every file of the shard ran
        if: always()
        run: node test/support/ci-shards.mjs --verify-report "$SHARD" "build/ci-suite-$SHARD.json"

      - name: Keep the per-file durations for the next pack
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: suite-durations-${{ matrix.shard }}
          path: build/ci-suite-${{ matrix.shard }}.json
          if-no-files-found: warn

  alone:
    name: suite alone (${{ matrix.file }})
    needs: plan
    if: needs.plan.outputs.alone != '[]'
    runs-on: ${{ vars.OHMAIL_LINUX_RUNNER == 'zorin' && github.repository == 'trafficflowhq/ohmail' && !endsWith(github.actor, '[bot]') && !endsWith(github.triggering_actor, '[bot]') && (github.event_name == 'schedule' || github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'pr/') && github.event.pull_request.user.type == 'User' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) && fromJSON('["self-hosted","ohmail-zorin"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        file: ${{ fromJSON(needs.plan.outputs.alone) }}
    services:
      postgres:
        image: ghcr.io/trafficflowhq/mirror-postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: tf
          POSTGRES_PASSWORD: tf
          POSTGRES_DB: trafficflow_test
        ports: ["5433:5432"]
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U tf -d trafficflow_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      greenmail:
        image: greenmail/standalone:2.1.3@sha256:d6db42a4fc258fec0948b1ae7b579fd06947cc92087c162ec0597972a6c36850
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.users.login=email"
        ports: ["3143:3143", "3025:3025"]
    env:
      DATABASE_URL_PG_TEST: postgres://tf:tf@localhost:5433/trafficflow_test
      IMAP_HOST: 127.0.0.1
      IMAP_PORT: "3143"
      TF_REQUIRE_PG: "1"
      FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3

      - name: Install the locked dependency tree
        run: bash "$GITHUB_WORKSPACE/.github/scripts/retry-infra.sh" npm-network -- npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply the patches this repository carries
        run: node scripts/apply-patches.mjs apply

      - name: The project build
        run: npm run build

      - name: Wait for GreenMail IMAP
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/3143 && read -r -t 5 greeting <&3 && [[ "$greeting" == "* OK"* ]]) 2>/dev/null; then
              echo "greenmail greeted after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "greenmail never greeted"; exit 1

      # The service's Postgres is new for this job, so this database is made from empty.
      - name: This checkout's own database, from empty
        run: bash scripts/lane-db.sh "$GITHUB_WORKSPACE"

      - name: Test the one file
        run: |
          set -euo pipefail
          mkdir -p build
          npx vitest run --reporter=default --reporter=json --outputFile=build/ci-alone.json "$FILE"
          node -e 'const n=require("./build/ci-alone.json").testResults.length;if(n!==1){console.error("expected the one file, the report holds "+n);process.exit(1)}'

  # The second store's run, in measured shards of its own (test/support/ci-shards-sqlite.json): as one
  # job it was 1828 s of serial file time and outran this bound; the longest shard is one 529 s file.
  sqlite:
    name: suite · sqlite (${{ matrix.shard }})
    needs: plan
    runs-on: ${{ vars.OHMAIL_LINUX_RUNNER == 'zorin' && github.repository == 'trafficflowhq/ohmail' && !endsWith(github.actor, '[bot]') && !endsWith(github.triggering_actor, '[bot]') && (github.event_name == 'schedule' || github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'pr/') && github.event.pull_request.user.type == 'User' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) && fromJSON('["self-hosted","ohmail-zorin"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.sqlite) }}
    services:
      postgres:
        image: ghcr.io/trafficflowhq/mirror-postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: tf
          POSTGRES_PASSWORD: tf
          POSTGRES_DB: trafficflow_test
        ports: ["5433:5432"]
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U tf -d trafficflow_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      greenmail:
        image: greenmail/standalone:2.1.3@sha256:d6db42a4fc258fec0948b1ae7b579fd06947cc92087c162ec0597972a6c36850
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.users.login=email"
        ports: ["3143:3143", "3025:3025"]
    env:
      DATABASE_URL_PG_TEST: postgres://tf:tf@localhost:5433/trafficflow_test
      IMAP_HOST: 127.0.0.1
      IMAP_PORT: "3143"
      TF_REQUIRE_PG: "1"
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3

      - name: Install the locked dependency tree
        run: bash "$GITHUB_WORKSPACE/.github/scripts/retry-infra.sh" npm-network -- npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply the patches this repository carries
        run: node scripts/apply-patches.mjs apply

      - name: The project build
        run: npm run build

      - name: Wait for GreenMail IMAP
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/3143 && read -r -t 5 greeting <&3 && [[ "$greeting" == "* OK"* ]]) 2>/dev/null; then
              echo "greenmail greeted after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "greenmail never greeted"; exit 1

      - name: This checkout's own database
        run: bash scripts/lane-db.sh "$GITHUB_WORKSPACE"

      # The sqlite project's own file set, as vitest reads its include list; the map splits that set.
      - name: The files the SQLite run holds
        run: |
          set -euo pipefail
          mkdir -p build
          npx vitest list --config vitest.sqlite.config.ts --filesOnly --json=build/sqlite-files.json

      - name: Test on SQLite, the second store the schema runs on, shard ${{ matrix.shard }}
        run: |
          set -euo pipefail
          list=$(node test/support/ci-shards.mjs --sqlite-shard "$SHARD" build/sqlite-files.json)
          mapfile -t files <<< "$list"
          echo "sqlite shard $SHARD runs ${#files[@]} file(s)"
          npx vitest run --config vitest.sqlite.config.ts --reporter=default --reporter=json --outputFile="build/ci-sqlite-$SHARD.json" "${files[@]}"

      - name: Every file of the SQLite shard ran
        if: always()
        run: node test/support/ci-shards.mjs --verify-sqlite-report "$SHARD" build/sqlite-files.json "build/ci-sqlite-$SHARD.json"

      - name: Keep the per-file durations for the next pack
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sqlite-durations-${{ matrix.shard }}
          path: build/ci-sqlite-${{ matrix.shard }}.json
          if-no-files-found: warn

  proxy-e2e:
    name: suite · proxy e2e
    needs: plan
    runs-on: ${{ vars.OHMAIL_LINUX_RUNNER == 'zorin' && github.repository == 'trafficflowhq/ohmail' && !endsWith(github.actor, '[bot]') && !endsWith(github.triggering_actor, '[bot]') && (github.event_name == 'schedule' || github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'pr/') && github.event.pull_request.user.type == 'User' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) && fromJSON('["self-hosted","ohmail-zorin"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    services:
      postgres:
        image: ghcr.io/trafficflowhq/mirror-postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: tf
          POSTGRES_PASSWORD: tf
          POSTGRES_DB: trafficflow_test
        ports: ["5433:5432"]
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U tf -d trafficflow_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL_PG_TEST: postgres://tf:tf@localhost:5433/trafficflow_test
      TF_REQUIRE_PG: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3

      - name: Install the locked dependency tree
        run: bash "$GITHUB_WORKSPACE/.github/scripts/retry-infra.sh" npm-network -- npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply the patches this repository carries
        run: node scripts/apply-patches.mjs apply

      - name: This checkout's own database
        run: bash scripts/lane-db.sh "$GITHUB_WORKSPACE"

      # next build type-checks every .ts the web app can see, and the image never shows it a test
      # directory (apps/webapp/Dockerfile.dockerignore: **/test). The same tree here, plus this file.
      - name: The tree the web image builds, plus the e2e file
        run: |
          set -euo pipefail
          cp apps/webapp/test/proxy.e2e.test.ts "$RUNNER_TEMP/proxy.e2e.test.ts"
          find apps packages -path '*/node_modules' -prune -o -type d -name test -prune -exec rm -rf {} +
          mkdir -p apps/webapp/test
          cp "$RUNNER_TEMP/proxy.e2e.test.ts" apps/webapp/test/proxy.e2e.test.ts

      # The only file that runs the middleware itself: a real next build and next start, driven over
      # a socket. It skips unless TF_PROXY_E2E is 1, which is set here and nowhere else.
      - name: Middleware e2e
        env:
          TF_PROXY_E2E: "1"
        run: npx vitest run apps/webapp/test/proxy.e2e.test.ts

  webapp-build:
    name: suite · webapp next build
    needs: plan
    runs-on: ${{ vars.OHMAIL_LINUX_RUNNER == 'zorin' && github.repository == 'trafficflowhq/ohmail' && !endsWith(github.actor, '[bot]') && !endsWith(github.triggering_actor, '[bot]') && (github.event_name == 'schedule' || github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'pr/') && github.event.pull_request.user.type == 'User' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) && fromJSON('["self-hosted","ohmail-zorin"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      OHMAIL_FLAVOR: selfhost
      NEXT_PUBLIC_GITHUB_STARS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3

      - name: Install the locked dependency tree
        run: bash "$GITHUB_WORKSPACE/.github/scripts/retry-infra.sh" npm-network -- npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply the patches this repository carries
        run: node scripts/apply-patches.mjs apply

      # The same type packages, check and module layout the self-host web image builds with.
      - name: The web build's type packages
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/retry-infra.sh" npm-network -- npm install --no-save --ignore-scripts --no-audit --no-fund \
            typescript@5.9.3 \
            @types/node@22.20.1 \
            @types/react@19.2.17 \
            @types/react-dom@19.2.7
          node scripts/apply-patches.mjs verify-tree --extra typescript --extra @types/node --extra @types/react --extra @types/react-dom
          [ ! -d apps/webapp/node_modules/react ] \
            || [ -d apps/webapp/node_modules/styled-jsx ] \
            || mv node_modules/styled-jsx apps/webapp/node_modules/styled-jsx

      # The image's context drops every test directory (apps/webapp/Dockerfile.dockerignore: **/test),
      # and next build type-checks every .ts it can see, so this build sees what the image's does.
      - name: The tree the web image builds
        run: find apps packages -path '*/node_modules' -prune -o -type d -name test -prune -exec rm -rf {} +

      - name: next build
        run: cd apps/webapp && npx --offline next build

  # The required check's name is this job's name, "typecheck": it is read by the repository's ruleset.
  typecheck:
    name: typecheck
    runs-on: ${{ vars.OHMAIL_LINUX_RUNNER == 'zorin' && github.repository == 'trafficflowhq/ohmail' && !endsWith(github.actor, '[bot]') && !endsWith(github.triggering_actor, '[bot]') && (github.event_name == 'schedule' || github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'pr/') && github.event.pull_request.user.type == 'User' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) && fromJSON('["self-hosted","ohmail-zorin"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3

      - name: Install the locked dependency tree
        run: bash "$GITHUB_WORKSPACE/.github/scripts/retry-infra.sh" npm-network -- npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply the patches this repository carries
        run: node scripts/apply-patches.mjs apply

      # tsc -b over the project graph tsconfig.json references.
      - name: The project build
        run: npm run build

      # The web app's own program, over every .ts it can see, its tests included: the root's type
      # packages cover the drivers its tests reach. No test directory is dropped here.
      - name: The web app and its tests
        run: ./node_modules/.bin/tsc --noEmit -p apps/webapp/tsconfig.json

      # The phone app's program and its tests' program, the script apps/mobile is checked with.
      - name: The phone app and its tests
        run: npm run typecheck:mobile

  # The desktop tests that import the desktop's own vite config, on the desktop's own install: that
  # config needs @vitejs/plugin-react, which only apps/desktop's lock carries.
  desktop:
    name: suite · desktop
    needs: plan
    runs-on: ${{ vars.OHMAIL_LINUX_RUNNER == 'zorin' && github.repository == 'trafficflowhq/ohmail' && !endsWith(github.actor, '[bot]') && !endsWith(github.triggering_actor, '[bot]') && (github.event_name == 'schedule' || github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'pr/') && github.event.pull_request.user.type == 'User' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) && fromJSON('["self-hosted","ohmail-zorin"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3

      - name: Install the locked dependency tree
        run: bash "$GITHUB_WORKSPACE/.github/scripts/retry-infra.sh" npm-network -- npm ci --ignore-scripts --no-audit --no-fund

      - name: The desktop app's own dependency tree
        run: cd apps/desktop && bash "$GITHUB_WORKSPACE/.github/scripts/retry-infra.sh" npm-network -- npm ci --ignore-scripts --no-audit --no-fund

      # After both installs: it patches every installed copy, the desktop tree's among them.
      - name: Apply the patches this repository carries
        run: node scripts/apply-patches.mjs apply

      # The files read from their import, so a new one moves here on its own; none dials a database.
      - name: The desktop files
        run: |
          set -euo pipefail
          list=$(node test/support/ci-shards.mjs --desktop)
          mapfile -t files <<< "$list"
          echo "the desktop job runs ${#files[@]} file(s)"
          mkdir -p build
          npx vitest run --reporter=default --reporter=json --outputFile=build/ci-desktop.json "${files[@]}"

      - name: Every desktop file ran
        if: always()
        run: node test/support/ci-shards.mjs --verify-report desktop build/ci-desktop.json
