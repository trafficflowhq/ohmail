name: release feeds

# Generates the two auto-update feeds and attaches them to a published release,
# so that
#
#   …/releases/latest/download/latest.json        (five platform keys, Tauri)
#   …/releases/latest/download/appcast-macos.xml   (the macOS HANDOVER, Sparkle)
#
# resolve to signed metadata the shipped clients are pinned to. The clients
# only ever NOTIFY and then install on the user's word; this workflow serves the
# metadata that lets them verify what they downloaded.
#
# ── WHY macOS IS IN BOTH ───────────────────────────────────────────────────
#
# macOS used to ship a different application: a SwiftUI client with the same
# bundle identifier and Sparkle as its updater. It now ships the same Tauri app
# as Windows and Linux, which reads latest.json — so the appcast is no longer
# how macOS updates, it is how an already-installed Swift client is handed over
# to the app that replaces it. Both feeds point at ONE archive, with two
# independent detached signatures over the same bytes.
#
# The appcast keeps being published on EVERY release, indefinitely. A Swift
# client that has not been opened in a year still asks for
# /releases/latest/download/appcast-macos.xml, and if the newest release has no
# appcast attached it gets a 404 and stays where it is for ever. Publishing one
# costs nothing; a bounded window strands exactly the installs least likely to
# be noticed.
#
# Both feeds are signed with keypairs that are independent of any OS
# code-signing certificate — the apps are unsigned, but an update payload an
# updater fetches and runs must still be cryptographically verified or the
# product ships remote code execution. The private keys are repo secrets:
#
#   TAURI_SIGNING_PRIVATE_KEY            minisign key for latest.json (Tauri)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password, if the key has one
#   OHMAIL_SPARKLE_ED_PRIVATE_KEY        Ed25519 key for the appcast (Sparkle)
#
# The macOS archive is signed with BOTH: minisign for the clients reading
# latest.json, EdDSA for the installed Swift clients reading the appcast. Two
# detached signatures over one file, neither of which the other can substitute
# for.
#
# The matching public keys are committed: SUPublicEDKey in Resources/Info.plist
# and plugins.updater.pubkey in apps/desktop/src-tauri/tauri.conf.json. If a
# private key is rotated, the committed public half must be rotated with it or
# the update can never verify.
#
# ── WHAT latest.json DOES NOT CARRY, AND WHY THAT IS A DECISION ────────────
#
# No `.deb` entry, for either architecture. `tauri-plugin-updater` builds its
# lookup key from a bundle-type marker the bundler PATCHES INTO THE BINARY, so a
# deb-installed build asks for `linux-x86_64-deb` (or `linux-aarch64-deb`) first
# and falls back to the plain key. Publishing the plain key alone means such a
# build downloads an AppImage it then refuses to install — measured, not
# inferred, on an Arch install at 0.12.1: the dialog appears, 130 MB is fetched,
# and the app says it could not install the update. Nothing on disk is touched.
#
# Adding a `-deb` key would NOT fix it. The updater would then hand the .deb to
# dpkg on a machine whose packages are owned by whatever installed them, which is
# an install path nobody here can exercise — there is no Debian-install test on
# any machine this project builds from. So the honest resolution is the one the
# release notes carry: a `.deb` install updates through the package manager it
# came from, and the README, the CHANGELOG and the AUR package all say so in
# those words. The absence of these keys is deliberate, and `verify-feeds.mjs`
# refusing any key not on its list is what keeps it deliberate — that refusal is
# the guard, not an oversight to work around.
#
# This runs on a released tag and works OFF the release's own binary assets, so
# it must run AFTER the build artifacts (the .dmg and .app.tar.gz, the
# -setup.exe and the two .AppImages) are attached to the release. It signs those
# exact bytes and points the feeds at their download URLs.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to (re)generate feeds for, e.g. v0.5.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-feeds-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  feeds:
    name: sign + publish latest.json and appcast-macos.xml
    # Desktop releases only. An Android release (android-v*) attaches an APK and
    # no desktop binaries, so running here could only fail — and a red run on
    # every phone release teaches people to ignore this workflow's failures,
    # which are the ones that strand updaters. A manual dispatch names its tag
    # on purpose and always runs.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    # macOS, because Sparkle's sign_update is a macOS binary; the Tauri minisign
    # step runs here too, so both feeds are produced from one asset download.
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      # CHECK OUT THE TAG BEING RELEASED, NOT THE REF THIS RUN WAS LAUNCHED ON.
      #
      # The version written into latest.json is read out of the CHECKED-OUT
      # tauri.conf.json, while the binaries are downloaded from RELEASE_TAG. A bare
      # checkout takes the launching ref, so the two agree only by luck: on a
      # release event the target commitish is usually the tag, but a
      # workflow_dispatch recovery against an older tag checks out the default
      # branch and labels that tag's binaries with the CURRENT version. Clients
      # would then be offered an update whose payload is the build they already
      # have — an install loop, and a feed that says a fix is available when it is
      # not. Pinning the ref makes the artifacts and the version come from one
      # commit; the assertion below refuses the run if they still disagree.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sign the artifacts and write both feeds
        env:
          GH_TOKEN: ${{ github.token }}
          # Secrets are read into the environment rather than interpolated into
          # the script text: a `${{ secrets.* }}` expanded inline would land in
          # the run-command and could leak through logs or shell parsing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OHMAIL_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.OHMAIL_SPARKLE_ED_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_TAG" || { echo "no release tag to work on" >&2; exit 1; }
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "TAURI_SIGNING_PRIVATE_KEY is not set" >&2; exit 1; }
          test -n "${OHMAIL_SPARKLE_ED_PRIVATE_KEY:-}" || { echo "OHMAIL_SPARKLE_ED_PRIVATE_KEY is not set" >&2; exit 1; }

          REPO="$GITHUB_REPOSITORY"                       # trafficflowhq/ohmail on the mirror
          BASE="https://github.com/$REPO/releases/download/$RELEASE_TAG"

          # The version the installed clients report — bare, no pre-release
          # identifier — taken from the tree the release was built from so it
          # cannot drift from the binaries.
          VERSION="$(node -e 'process.stdout.write(require("./apps/desktop/src-tauri/tauri.conf.json").version)')"
          test -n "$VERSION" || { echo "could not read the version from tauri.conf.json" >&2; exit 1; }

          # The tag names the binaries; the tree names the version. They are the same
          # release or this run must not write a feed — see the checkout note above.
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "tag $RELEASE_TAG does not name version $VERSION (expected v$VERSION)." >&2
            echo "The feed would label this tag's binaries with another release's version." >&2
            exit 1
          fi
          echo "release $RELEASE_TAG · version $VERSION"

          # ── ARM64 LINUX EXISTS FROM 0.13.3, AND NOT BEFORE ────────────────
          #
          # This workflow can be dispatched by hand against ANY published tag —
          # the header's own example is `v0.5.0` — and that recovery path is the
          # reason a client whose feed went missing is not stranded for ever.
          # Releases before 0.13.3 attached no arm64 artifact at all, so a flat
          # "there must be two AppImages" would refuse to regenerate a single one
          # of those feeds. The requirement is therefore a FLOOR read off the
          # release's own version, not a constant.
          #
          # Asserted in BOTH directions below: at or above the floor the arm64
          # AppImage is required and the manifest carries five keys; under it the
          # arm64 AppImage must be ABSENT and the manifest carries four. A
          # one-directional rule would let an old release quietly grow a key that
          # nothing was ever built for.
          # The comparison is done in node rather than with `sort -V | head -1`.
          # Two reasons, both concrete: this job runs on macOS, whose `sort` is
          # BSD and whose `-V` cannot be relied on; and `head` closing the pipe
          # is the SIGPIPE shape this repository has been bitten by, where the
          # producer's death is read as its answer.
          ARM_FROM=0.13.3
          ARM_LINUX="$(ARM_FROM="$ARM_FROM" VERSION="$VERSION" node -e '
            const p = (v) => String(v).split(".").map(Number);
            const [a, b] = [p(process.env.VERSION), p(process.env.ARM_FROM)];
            if (a.length !== 3 || a.some(Number.isNaN)) { process.stderr.write("bad version\n"); process.exit(1); }
            for (let i = 0; i < 3; i++) if (a[i] !== b[i]) { process.stdout.write(a[i] > b[i] ? "1" : "0"); process.exit(0); }
            process.stdout.write("1");
          ')"
          if [ "$ARM_LINUX" = 1 ]; then WANT_APPIMAGES=2; else WANT_APPIMAGES=1; fi
          echo "arm64 Linux: $([ "$ARM_LINUX" = 1 ] && echo required || echo "not expected (below $ARM_FROM)")"

          PUB_DATE_ISO="${RELEASE_PUBLISHED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          NOTES="${RELEASE_BODY:-ohmail $VERSION}"

          # ── Pull the release's binary assets ───────────────────────────────
          rm -rf assets && mkdir assets
          gh release download "$RELEASE_TAG" --repo "$REPO" --dir assets --clobber
          echo "downloaded:"; ls -la assets

          # ── THE METADATA FROM A PREVIOUS RUN IS DELETED, NOT KEPT ─────────
          #
          # `gh release download` takes EVERY asset, and on any second run of
          # this job — a draft signed and then published, a re-dispatch, a
          # recovery — that includes the `latest.json`, `appcast-macos.xml` and
          # `SHA256SUMS` this run is about to replace. Keeping them is not
          # harmless: the checksum file below hashes what is in this directory,
          # so it would publish hashes of three files that no longer exist in
          # that form, including a hash of its own previous self. The upload
          # `--clobber`s all three, and the mismatch only appears to whoever
          # runs `shasum --check` on the download — this job's own check runs
          # before the replacement and stays green.
          #
          # Deleted rather than filtered out of the glob, so that nothing later
          # in this job can read a stale feed by accident either.
          rm -f assets/latest.json assets/appcast-macos.xml assets/SHA256SUMS
          echo "assets to be signed and hashed:"; ls -la assets

          pick() { ls assets/$1 2>/dev/null | head -1 || true; }
          # ── NAMED, NOT GLOBBED, FOR THE REASON THE LINUX PICKS GIVE BELOW ──
          #
          # This was `pick '*-setup.exe'`, and `pick` ends in `head -1`. The
          # comment under the Linux picks argues the whole case: two files
          # matching one glob makes the payload choice arbitrary, and the
          # signature verifies either way because the feed says nothing about
          # what the bytes are. Windows had exactly one match and so the glob
          # was harmless — until the CLIENT started refusing a payload whose
          # signed asset name is not the one its build expects
          # (`updater.rs::EXPECTED_ASSET`). A glob that ever picked a
          # differently-named installer would now publish a feed every Windows
          # install silently refuses, reporting itself up to date. So the name is
          # written down, in the same place and the same way as the other three.
          WIN_EXE="assets/ohmail-windows-setup.exe"
          # ── THE TWO LINUX AppImages ARE PICKED BY NAME, NOT BY GLOB ────────
          #
          # This used to be `pick '*.AppImage'`, and `pick` ends in `head -1`.
          # That was correct for exactly as long as there was one AppImage on a
          # release. There are two now — x86_64 and aarch64 — and the glob would
          # have chosen between them by whatever order `ls` returned, then signed
          # that file and published it under BOTH Linux keys. Every arm64 install
          # would have been handed an x86_64 payload, or every x86_64 install an
          # arm64 one, and the signature would have verified either way: the feed
          # says nothing about what architecture the bytes are for.
          #
          # `build.yml`'s header calls the artifact names a contract for this
          # exact reason ("two files matching one glob makes the update feed's
          # payload pick arbitrary"). This is the consumer that contract exists
          # to protect, so it names both files and refuses if either is absent.
          LIN_X64_APPIMAGE="assets/ohmail-linux-x86_64.AppImage"
          LIN_ARM_APPIMAGE="assets/ohmail-linux-aarch64.AppImage"
          # A GZIPPED TAR AND NOT A ZIP, and this is not a preference. Tauri's
          # macOS updater unpacks its payload with GzDecoder + tar and has no
          # zip path at all (tauri-plugin-updater `install_inner`, macOS). The
          # previous `ohmail.app.zip` was for Sparkle, which reads both — so one
          # tar.gz serves both feeds and the zip is retired.
          # Named for the same reason as the Windows installer above: the
          # client refuses any asset name but its own build's.
          MAC_TGZ="assets/ohmail.app.tar.gz"
          test -s "$WIN_EXE"  || { echo "no ohmail-windows-setup.exe attached to $RELEASE_TAG" >&2; exit 1; }
          test -s "$MAC_TGZ"  || { echo "no ohmail.app.tar.gz attached to $RELEASE_TAG" >&2; exit 1; }
          test -s "$LIN_X64_APPIMAGE" || { echo "no ohmail-linux-x86_64.AppImage attached to $RELEASE_TAG" >&2; exit 1; }
          if [ "$ARM_LINUX" = 1 ]; then
            test -s "$LIN_ARM_APPIMAGE" || { echo "no ohmail-linux-aarch64.AppImage attached to $RELEASE_TAG" >&2; exit 1; }
          else
            test ! -e "$LIN_ARM_APPIMAGE" || {
              echo "$RELEASE_TAG is below $ARM_FROM but carries an arm64 AppImage — nothing built one for it" >&2
              exit 1
            }
          fi
          # …and NOTHING ELSE ends in .AppImage. Naming the two files above stops
          # a third one being picked by accident; it does not stop a third one
          # EXISTING, and a Linux artifact this job has never heard of is a
          # platform whose installs would silently be offered another
          # architecture's payload. Counted into a variable rather than piped
          # into `wc` behind a `grep -q`, for the reason `build.yml` gives at
          # length: a reader that closes the pipe early kills the producer and
          # the pipeline reports the wrong thing.
          APPIMAGES="$(ls assets/*.AppImage 2>/dev/null || true)"
          APPIMAGE_COUNT="$(printf '%s\n' "$APPIMAGES" | grep -c . || true)"
          if [ "$APPIMAGE_COUNT" != "$WANT_APPIMAGES" ]; then
            echo "expected exactly $WANT_APPIMAGES AppImage asset(s) at $VERSION, found $APPIMAGE_COUNT:" >&2
            printf '%s\n' "$APPIMAGES" >&2
            echo "Every Linux artifact needs a platform key of its own in latest.json." >&2
            exit 1
          fi

          # ══════════════════════════════════════════════════════════════════
          # SHA256SUMS — the checksums the download page has been promising.
          #
          # The apps are unsigned, and the same page that says so links "All
          # releases, notes and checksums". The releases published none: every
          # CI run printed its own artifacts' hashes into a run summary, which
          # is one platform's worth of hashes on a page most readers of a
          # download never open. A claim the product makes is a claim the
          # product has to honour, so the release now carries one file with all
          # of them.
          #
          # COMPUTED HERE AND NOT IN THE BUILD, on purpose. Each build job sees
          # only its own platform's output; this job is the one place the whole
          # asset set exists at once, and — the half that matters — these are
          # the bytes AS ATTACHED, downloaded back off the release. A sum
          # computed beside a freshly built file attests to the file the runner
          # had. This one attests to the file a reader will get.
          #
          # The feeds are deliberately not in it: they do not exist yet at this
          # point, and a checksum file that listed the file it is uploaded
          # beside would have to be written twice. Their integrity is the
          # signatures, which is a stronger claim than a hash on the same page.
          # `assets/` holds only the binary payloads at this point — the three
          # metadata files were deleted above — so the glob covers exactly what
          # this release publishes and nothing this job is about to rewrite.
          ( cd assets && shasum -a 256 -- * > ../SHA256SUMS )
          echo "--- SHA256SUMS ---"; cat SHA256SUMS
          # It covers every attached binary, asserted rather than assumed: a
          # glob that silently matched nothing would produce an empty file and
          # a release that still claims to publish checksums.
          SUM_LINES="$(grep -c . SHA256SUMS || true)"
          test "$SUM_LINES" -ge 5 || { echo "SHA256SUMS lists only $SUM_LINES file(s)" >&2; exit 1; }
          # And it verifies where it was made. `--check` reads the names
          # relative to the working directory, so it runs inside assets/.
          ( cd assets && shasum -a 256 --check ../SHA256SUMS )
          # The FRESH file is placed beside the payloads so the offline verifier
          # below reads the one this run is about to publish. Without this it
          # would read whatever a previous run left there, and certify it.
          cp SHA256SUMS assets/SHA256SUMS

          # ════════════════════════════════════════════════════════════════════
          # latest.json — the Tauri updater manifest, all three platforms.
          # Each artifact is minisign-signed; the `signature` field is the exact
          # contents of the .sig the signer emits, which is what the client
          # verifies against the committed pubkey.
          #
          # TWO darwin KEYS FOR ONE UNIVERSAL ARCHIVE. The updater composes its
          # lookup key as `{os}-{arch}` from the RUNNING binary — `darwin-aarch64`
          # or `darwin-x86_64` — and does an exact map lookup with no fallback.
          # There is no `darwin-universal` key it would ever ask for, so a single
          # entry under that name is a manifest every Mac misses. Both keys point
          # at the one universal archive and carry the one signature over it.
          #
          # TWO linux KEYS FOR TWO DIFFERENT ARCHIVES — the opposite arrangement,
          # and the reason the two Linux entries can never be collapsed. macOS
          # ships ONE artifact that runs on both architectures; Linux ships TWO
          # artifacts that each run on one. `tauri-plugin-updater` derives the
          # arch half of its key from `cfg!(target_arch)` in the running binary
          # (`updater.rs::updater_arch` in 2.10.1: `x86_64` → "x86_64",
          # `aarch64` → "aarch64"), so an arm64 install asks for `linux-aarch64`
          # and nothing else — there is no fallback to another architecture's
          # entry, and there must not be one: the payload would not run.
          # ════════════════════════════════════════════════════════════════════
          # ── THE VERSION IS SIGNED, AND THIS IS WHERE IT BECOMES SIGNED ─────
          #
          # `latest.json`'s own `version` field is UNSIGNED metadata. Every
          # payload is minisign-verified before the client will install it, but
          # nothing signs the manifest that says which payload is which — so
          # whoever can write this feed could otherwise advertise `99.0.0` and
          # point it at an OLD release's genuine, genuinely-signed artifact.
          # Every byte would verify, because the bytes are ours; the client would
          # compare 99.0.0 against what it is running, call it newer, and install
          # a build whose fixed vulnerabilities are in the changelog. That is a
          # downgrade of every install, available to anyone who can write one
          # file, without the signing key.
          #
          # minisign signs its own TRUSTED COMMENT as well as the payload — the
          # global signature covers `signature || trusted_comment` and
          # minisign-verify checks it on the same call — and the signer writes
          # `file:<name>` in there, taking `<name>` from the file it was handed.
          # So signing a COPY named `<version>@<asset>` puts the version inside
          # signed material at no cost: no new key, no second file, no schema
          # change, and the PUBLISHED asset names are untouched (the manifest's
          # urls below are still built from the original paths, and the AUR
          # PKGBUILD, the download page and SHA256SUMS never see this name).
          #
          # `updater.rs::signed_release` is the consumer, and it refuses a
          # payload it cannot read a version out of. That makes this step
          # load-bearing in a way that fails QUIETLY if it regresses — a client
          # that refuses every update reports "up to date" — so the offline
          # verifier at the end of this job asserts the trusted comment names
          # this release, and fails the publish rather than shipping a feed that
          # would stall every install.
          sign_tauri() {
            # Reads TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD) from the environment.
            # </dev/null so a password-required key fails fast instead of
            # blocking on a prompt; the signer's own chatter goes to stderr so
            # this function's stdout is ONLY the .sig content the manifest needs.
            mkdir -p signing
            # The copy is what gets signed; "$1" is what gets published. Same
            # bytes, so the signature verifies against the published asset.
            local signed_as="signing/${VERSION}@$(basename "$1")"
            cp "$1" "$signed_as"
            npx --yes @tauri-apps/cli@2 signer sign "$signed_as" < /dev/null 1>&2
            cat "$signed_as.sig"
          }
          WIN_SIG="$(sign_tauri "$WIN_EXE")"
          LIN_X64_SIG="$(sign_tauri "$LIN_X64_APPIMAGE")"
          MAC_SIG="$(sign_tauri "$MAC_TGZ")"
          test -n "$WIN_SIG"     || { echo "empty Windows signature" >&2; exit 1; }
          test -n "$LIN_X64_SIG" || { echo "empty Linux x86_64 signature" >&2; exit 1; }
          test -n "$MAC_SIG"     || { echo "empty macOS signature" >&2; exit 1; }
          if [ "$ARM_LINUX" = 1 ]; then
            LIN_ARM_SIG="$(sign_tauri "$LIN_ARM_APPIMAGE")"
            test -n "$LIN_ARM_SIG" || { echo "empty Linux arm64 signature" >&2; exit 1; }
            # The two Linux signatures are over two different files, so they must
            # differ. Identical ones mean both `sign_tauri` calls were handed the
            # same path — the failure the by-name picks above exist to prevent,
            # caught here as well because this is the last place before the bytes
            # become a published feed.
            if [ "$LIN_X64_SIG" = "$LIN_ARM_SIG" ]; then
              echo "the two Linux AppImages produced the same signature — they are the same file" >&2
              exit 1
            fi
          fi

          jq -n \
            --arg version  "$VERSION" \
            --arg notes    "$NOTES" \
            --arg pub_date "$PUB_DATE_ISO" \
            --arg win_url  "$BASE/$(basename "$WIN_EXE")" \
            --arg win_sig  "$WIN_SIG" \
            --arg lin_url  "$BASE/$(basename "$LIN_X64_APPIMAGE")" \
            --arg lin_sig  "$LIN_X64_SIG" \
            --arg mac_url  "$BASE/$(basename "$MAC_TGZ")" \
            --arg mac_sig  "$MAC_SIG" \
            '{
               version: $version,
               notes: $notes,
               pub_date: $pub_date,
               platforms: {
                 "windows-x86_64": { signature: $win_sig, url: $win_url },
                 "linux-x86_64":   { signature: $lin_sig, url: $lin_url },
                 "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                 "darwin-x86_64":  { signature: $mac_sig, url: $mac_url }
               }
             }' > latest.json
          # The arm64 entry is ADDED rather than written inline, so a release
          # below the floor emits the four-key manifest it always did — byte for
          # byte the shape those clients have been reading.
          if [ "$ARM_LINUX" = 1 ]; then
            jq --arg url "$BASE/$(basename "$LIN_ARM_APPIMAGE")" --arg sig "$LIN_ARM_SIG" \
              '.platforms["linux-aarch64"] = { signature: $sig, url: $url }' \
              latest.json > latest.json.tmp && mv latest.json.tmp latest.json
          fi
          jq . latest.json > /dev/null   # it is valid JSON or the step fails here
          # EVERY PLATFORM THE PRODUCT SHIPS, ASSERTED. A manifest missing a key
          # is not an error to any client — it is a client that quietly never
          # updates again, which is exactly the failure this file exists to
          # prevent and the one nobody reports.
          jq -e '.platforms
                  | has("windows-x86_64") and has("linux-x86_64")
                    and has("darwin-aarch64") and has("darwin-x86_64")' \
            latest.json > /dev/null \
            || { echo "latest.json is missing a platform entry" >&2; exit 1; }
          # The arm64 key is asserted in BOTH directions against the floor, for
          # the reason the floor's own comment gives: present at or above it,
          # absent below it. An old release quietly growing a key nothing built
          # for it is as wrong as a new one missing the key it needs.
          if [ "$ARM_LINUX" = 1 ]; then
            jq -e '.platforms | has("linux-aarch64")' latest.json > /dev/null \
              || { echo "latest.json is missing linux-aarch64 at $VERSION" >&2; exit 1; }
            # The two Linux entries point at two different files. Asserted on the
            # manifest rather than only on the variables above, because this is
            # the object the clients read.
            jq -e '.platforms["linux-x86_64"].url != .platforms["linux-aarch64"].url' \
              latest.json > /dev/null \
              || { echo "both Linux entries name one file — one architecture would be handed the other's payload" >&2; exit 1; }
          else
            jq -e '.platforms | has("linux-aarch64") | not' latest.json > /dev/null \
              || { echo "latest.json carries linux-aarch64 at $VERSION, which is below $ARM_FROM" >&2; exit 1; }
          fi
          echo "--- latest.json ---"; cat latest.json

          # ════════════════════════════════════════════════════════════════════
          # appcast-macos.xml — the HANDOVER feed for installed Swift clients.
          # The enclosure is the same .app.tar.gz latest.json points at (Sparkle
          # swaps the bundle in place, and reads gzipped tars); sign_update
          # produces the EdDSA signature AND the length as ready-made enclosure
          # attributes. sparkle:version is the shipped app's CFBundleVersion,
          # read out of the bundle so the feed cannot claim a version the
          # artifact does not carry — Sparkle validates the two against each
          # other before installing.
          #
          # ── THE COMPARISON THIS WHOLE BLOCK EXISTS TO GET RIGHT ────────────
          #
          # Sparkle decides "is this newer" by comparing sparkle:version against
          # the INSTALLED app's CFBundleVersion. The Swift client stamped that
          # with a monotonic build number — `git rev-list --count HEAD`, 251 at
          # v0.5.0 and 291 at v0.6.1. Tauri writes CFBundleVersion from the
          # config version, so an unpinned bundle announces its own semver, which
          # Sparkle reads as a DOWNGRADE from 291 and refuses. Silently, and for
          # ever: every installed Mac would keep reporting itself up to date.
          #
          # apps/desktop/src-tauri/Info.plist pins CFBundleVersion to a constant
          # far above any published build number. The floor below is what makes
          # that pin load-bearing rather than decorative — a plist that loses the
          # key fails the release instead of stranding the people it protects.
          # ════════════════════════════════════════════════════════════════════
          # The Sparkle release the retired macOS client embedded, so the
          # signature this produces is the one those installs know how to verify.
          SPARKLE_VER=2.9.4
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VER/Sparkle-$SPARKLE_VER.tar.xz" -o sparkle.tar.xz
          mkdir -p sparkle && tar -xJf sparkle.tar.xz -C sparkle
          SIGN_UPDATE="$(find sparkle -type f -name sign_update | head -1)"
          test -x "$SIGN_UPDATE" || { echo "sign_update not found in the Sparkle distribution" >&2; exit 1; }

          rm -rf appdir && mkdir appdir && tar -xzf "$MAC_TGZ" -C appdir
          # The app's OWN Info.plist, not a nested helper's: Sparkle.framework ships Updater.app and
          # XPC services that each carry a `*/Contents/Info.plist`, and a bare `-name` match would pick
          # one of those (reporting Sparkle's version, e.g. 2.9.4). Anchor on the app bundle.
          APP_PLIST="$(find appdir -path '*/ohmail.app/Contents/Info.plist' | head -1)"
          test -f "$APP_PLIST" || { echo "no Contents/Info.plist inside $MAC_ZIP" >&2; exit 1; }
          SHORT_VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")"
          BUNDLE_VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP_PLIST" 2>/dev/null || echo 15.0)"
          echo "app reports shortVersion=$SHORT_VER build=$BUNDLE_VER minOS=$MIN_OS"

          # ── THE FLOOR, AND WHY IT IS A HARD REFUSAL ───────────────────────
          # 291 is the CFBundleVersion of the last SwiftUI release (v0.6.1); 251
          # was v0.5.0. Sparkle offers an update only when sparkle:version is
          # strictly greater than what is installed, so anything at or below 291
          # is an appcast that no existing Mac will ever act on — and it fails
          # the way that is impossible to notice, by the client simply saying it
          # is up to date. Refusing the release is the only signal available.
          LAST_SWIFT_BUILD=291
          case "$BUNDLE_VER" in
            ''|*[!0-9]*)
              echo "CFBundleVersion is \"$BUNDLE_VER\", which is not an integer build number." >&2
              echo "Sparkle compares it against installed builds numbered up to $LAST_SWIFT_BUILD;" >&2
              echo "a non-integer cannot order above them. See apps/desktop/src-tauri/Info.plist." >&2
              exit 1 ;;
          esac
          if [ "$BUNDLE_VER" -le "$LAST_SWIFT_BUILD" ]; then
            echo "CFBundleVersion $BUNDLE_VER is not above the last SwiftUI build ($LAST_SWIFT_BUILD)." >&2
            echo "Every installed macOS client would read this release as a downgrade and refuse it," >&2
            echo "silently and permanently. See apps/desktop/src-tauri/Info.plist." >&2
            exit 1
          fi
          echo "handover floor ok: $BUNDLE_VER > $LAST_SWIFT_BUILD"

          # sign_update --ed-key-file <file> <archive>  → sparkle:edSignature="…" length="…"
          # Sparkle 2.9.4 REMOVED the inline `-s <key>` form ("Specifying private key as an argument
          # is no longer supported" — it exits non-zero). The key is written to a private temp file
          # and read with --ed-key-file, which also keeps it off the process argument list.
          EDKEY_FILE="$(mktemp)"; printf '%s' "$OHMAIL_SPARKLE_ED_PRIVATE_KEY" > "$EDKEY_FILE"
          ENCLOSURE_ATTRS="$("$SIGN_UPDATE" --ed-key-file "$EDKEY_FILE" "$MAC_TGZ")"
          rm -f "$EDKEY_FILE"
          test -n "$ENCLOSURE_ATTRS" || { echo "sign_update produced no signature" >&2; exit 1; }
          case "$ENCLOSURE_ATTRS" in
            *edSignature=*length=*) : ;;
            *) echo "unexpected sign_update output: $ENCLOSURE_ATTRS" >&2; exit 1 ;;
          esac

          PUB_DATE_RFC="$(date -u -jf %Y-%m-%dT%H:%M:%SZ "$PUB_DATE_ISO" +"%a, %d %b %Y %H:%M:%S +0000" 2>/dev/null || date -u +"%a, %d %b %Y %H:%M:%S +0000")"
          MAC_URL="$BASE/$(basename "$MAC_TGZ")"

          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            echo '  <channel>'
            echo '    <title>ohmail</title>'
            echo '    <item>'
            echo "      <title>$SHORT_VER</title>"
            echo "      <pubDate>$PUB_DATE_RFC</pubDate>"
            echo "      <sparkle:version>$BUNDLE_VER</sparkle:version>"
            echo "      <sparkle:shortVersionString>$SHORT_VER</sparkle:shortVersionString>"
            echo "      <sparkle:minimumSystemVersion>$MIN_OS</sparkle:minimumSystemVersion>"
            echo "      <enclosure url=\"$MAC_URL\" $ENCLOSURE_ATTRS type=\"application/octet-stream\" />"
            echo '    </item>'
            echo '  </channel>'
            echo '</rss>'
          } > appcast-macos.xml
          # Well-formedness gate: a malformed appcast is a silent no-update.
          xmllint --noout appcast-macos.xml
          echo "--- appcast-macos.xml ---"; cat appcast-macos.xml

          # ══════════════════════════════════════════════════════════════════
          # VERIFY BOTH FEEDS BEFORE EITHER IS ATTACHED.
          #
          # Everything above SIGNS. Nothing above checks that what it signed
          # with still matches what the shipped clients verify against — and
          # those are two different halves of two different keypairs, one in
          # repository secrets and one committed in this tree. The moment they
          # stop being pairs, every installed client rejects every update, and
          # it fails in the way nobody reports: the client says it is up to
          # date and never asks again.
          #
          # It runs BEFORE the upload because the upload uses --clobber. A feed
          # attached and then found to be bad has already replaced the last
          # good one; a feed that fails here leaves the release exactly as it
          # was, with the binaries untouched.
          #
          # The verifier is offline and reads only this tree and these files —
          # the same command anyone can run against a download.
          # ══════════════════════════════════════════════════════════════════
          node scripts/verify-feeds.mjs . assets latest.json appcast-macos.xml

          # ── Attach both feeds to the release ───────────────────────────────
          gh release upload "$RELEASE_TAG" --repo "$REPO" --clobber \
            latest.json appcast-macos.xml SHA256SUMS
          echo "uploaded latest.json, appcast-macos.xml and SHA256SUMS to $RELEASE_TAG"

          # ── …and what was attached is what was verified ────────────────────
          # Fetched back and compared byte for byte rather than verified again:
          # identical bytes carry the signatures already checked above, and an
          # upload that silently served something else is the failure this
          # catches. A release is served for years; this costs two requests.
          rm -rf uploaded && mkdir uploaded
          gh release download "$RELEASE_TAG" --repo "$REPO" --dir uploaded --clobber \
            --pattern latest.json --pattern appcast-macos.xml --pattern SHA256SUMS
          cmp latest.json uploaded/latest.json
          cmp appcast-macos.xml uploaded/appcast-macos.xml
          cmp SHA256SUMS uploaded/SHA256SUMS
          echo "the attached feeds and checksums are byte-identical to the verified ones"

      - name: Run summary
        if: always()
        run: |
          {
            echo '### update feeds'
            echo
            echo '| feed | for |'
            echo '|---|---|'
            echo '| `latest.json` | Windows, Linux and macOS (Tauri, minisign) |'
            echo '| `appcast-macos.xml` | the handover for installed SwiftUI clients (Sparkle, EdDSA) |'
            echo '| `SHA256SUMS` | the SHA-256 of every binary asset, as attached |'
            echo
            echo "Attached to \`$RELEASE_TAG\`; served from \`/releases/latest/download/\`."
            echo
            echo 'Both were verified against the public keys committed in this repository'
            echo 'before being attached, and the attached bytes were compared back against'
            echo 'the verified ones. To check them yourself, from a clone of this repository:'
            echo
            echo '```'
            echo 'gh release download <tag> --dir assets'
            echo 'cd assets && shasum -a 256 --check SHA256SUMS && cd ..'
            echo 'node scripts/verify-feeds.mjs . assets assets/latest.json assets/appcast-macos.xml'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
