name: build

# Everything the desktop app can honestly prove on a public runner.
#
# ONE APPLICATION, THREE PLATFORMS AND FOUR ARCHITECTURES. macOS used to build a
# separate SwiftUI client here; it now builds the same Tauri app as Windows and
# Linux, carrying the same mail engine. macOS is one universal artifact; Linux is
# two artifacts from two jobs, because there is no Linux equivalent of `lipo` and
# an AppImage holds one architecture. Each job does the same five things in the
# same order:
#
#   1. render check   — build the WINDOW bundle and smoke it, offline audit
#                       included: the page's whole reach is the shell's command
#                       channel (`invoke`, not `fetch`), so "it opens no
#                       connection" is asserted against the artifact that
#                       ships. Fail-fast, in front of the platform toolchains.
#   2. engine         — build the one-file mail engine from this source, with
#                       the pinned esbuild.
#   3. runtime        — download the official Node build for this platform and
#                       verify it against nodejs.org's own SHASUMS256.txt.
#   4. package        — stage engine + runtime, rebuild the UI with the bridge,
#                       RENDER THAT BUNDLE TOO, and bundle. One script sets all
#                       three, because the three have to agree and a workflow
#                       that spells them out by hand is a workflow where a later
#                       edit fixes two of them.
#   5. inspect        — open the artifact and assert the engine and the runtime
#                       are inside it, executable, and that the binary reaches
#                       nothing but its own update feed.
#
# ── KNOWN GAP: NOTHING HERE EVER STARTS THE PACKAGED APP ──────────────────
#
# Every check below is a build or a static read. The renders run against a stub
# channel rather than a real window, and `inspect` opens the artifact without
# launching it. So a fault that only exists once the real binary creates a real
# window — a panic between process start and first paint — is green all the way
# through this file and dead on every install.
#
# This is not hypothetical. 0.9.7 shipped past a fully green matrix and aborted
# seconds after launch on all three platforms, because the window was granted
# two commands the compiled manifest did not declare and the framework resolves
# that mismatch by aborting. Worse, the abort landed before the launch update
# check, so the release could not deliver its own fix and had to be reinstalled
# by hand.
#
# The missing gate is a launch-survival check: start the packaged binary this
# run produced, headless, and assert it is still alive well past the point such
# a fault would kill it, that the engine log shows a completed boot, and that it
# did not exit on a signal. Capture the process status directly — a pipeline
# into `grep` reports the wrong command's exit code. Until that job exists the
# check is run by hand at release time, which is a person remembering rather
# than a guard.
#
# ── THE WINDOW BUNDLE IS RENDERED THREE TIMES, AND EACH RUN ANSWERS FOR ITSELF ──
#
# There used to be a second UI artifact here — a fixtures-only "interface
# preview", retired under the product's no-demo rule — and step 1 smoked THAT,
# which is how the engine-bearing bundle once went unrendered for two releases
# while a red preview smoke stood in front of it. The window bundle is the one
# UI artifact now, and it is smoked in three places, each for its own reason:
#
#   · step 1 of each platform job — FAIL-FAST, in front of the hour of native
#     compile, so a broken UI is a two-minute red rather than an hour-long one;
#   · inside `app:build:engine` (see `apps/desktop/scripts/build-engine-app.mjs`)
#     — the GATE, beside the artifact, over the dist rebuilt from staged
#     resources, where a red smoke STOPS the build;
#   · in the `engine-ui-smoke` job below — the VERDICT, a separate job precisely
#     so that nothing else (a Rust toolchain failure, a runtime download, any
#     earlier step) can decide whether the bundle's own question gets asked.
#
# What makes all three cheap: none needs the engine binary or the vendored Node
# runtime. `smoke.mjs --expect engine` serves the window from a stub Tauri
# channel, so each run is a `vite build` and a jsdom render.
#
# The window bundle went unsmoked for its whole life until the first caller
# existed, and the cost was measured: a released build showed a blank white
# window the moment a mailbox started serving, because its copy of the client's
# HTTP adapter was a throwing stub and that constructor runs inside a React
# render. Nothing this file smoked at the time could have seen it.
#
# Signing is macOS-only and conditional. The macOS job signs with a Developer ID
# and notarizes WHEN this repository holds the Apple secrets, and produces the
# same ad-hoc artifact as before when it does not — one decision, taken once, in
# "Import the Developer ID certificate, if there is one". Windows and Linux are
# not signed at all: no Authenticode certificate, no Linux signing. The README's
# per-platform notes describe the artifacts a release has actually shipped, which
# is the ad-hoc one until the certificate exists.
#
# ── THE ARTIFACT NAMES ARE A CONTRACT ─────────────────────────────────────
#
# The download page links published assets directly, so each artifact is
# RENAMED IN PLACE to its stable name here — never copied, because two files
# matching one glob makes the update feed's payload pick arbitrary:
#
#   ohmail.dmg · ohmail.app.tar.gz · ohmail-windows-setup.exe
#   ohmail-linux-x86_64.AppImage   · ohmail-linux-amd64.deb   · ohmail-linux-x86_64.rpm
#   ohmail-linux-aarch64.AppImage  · ohmail-linux-arm64.deb   · ohmail-linux-aarch64.rpm
#
# THE TWO LINUX ARCHITECTURES SHARE NO NAME, AND THAT IS THE CONTRACT'S POINT.
# Each Linux artifact carries its architecture in its own filename, so nothing
# downstream ever has to pick between two files behind one glob — the exact
# failure this block exists to prevent. `release-feeds.yml` selects both
# AppImages BY NAME for that reason, and refuses a release whose asset set does
# not hold exactly these two.
#
# The spellings differ per format on purpose rather than by oversight: an
# AppImage is named for the machine (`x86_64`, `aarch64`, what `uname -m`
# prints), a Debian package for the Debian architecture (`amd64`, `arm64`, what
# `dpkg --print-architecture` prints), and an RPM for the machine again
# (`x86_64`, `aarch64`, what `rpm --eval %{_arch}` prints and what the bundler
# writes into its own filename). Normalising any of them would make the filename
# disagree with the tool a reader is holding — which is why the `.rpm` shares its
# architecture words with the AppImage beside it and not with the `.deb`.
#
# `latest.json` and `appcast-macos.xml` are the update feeds and belong to the
# release-feeds workflow; nothing here may produce a file by either name.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# WHICH COMMIT PRODUCED THE ARTIFACT, readable from the app that ships.
#
# Workflow-level so it reaches every job on every platform: the window's About pane shows it, and
# a release pass can then assert that the binary it exercised is the binary the tag ships. Before
# this, a candidate, the tag build and any later rebuild reported one version string and were
# indistinguishable from the outside. `apps/desktop/vite.config.ts` folds it into the bundle; a
# build with nothing set reports the version alone.
env:
  OHMAIL_BUILD_SHA: ${{ github.sha }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS · smoke · engine · universal app · dmg
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
          # BOTH SLICES, because the macOS artifact is universal. `tauri build
          # --target universal-apple-darwin` compiles the binary twice and lipos
          # the result, and a missing target is a build that fails late.
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version
          node --version

      # `npm ci` and not `npm install`: apps/desktop carries its own committed
      # package-lock.json, so every builder resolves the tree this app was
      # tested against rather than whatever its ranges resolve to today — and a
      # build with no network can resolve it at all. `npm install` would
      # quietly rewrite a lock that had drifted from the manifest; `npm ci`
      # refuses it.
      - name: Install the desktop tree from its lockfile
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: tsc --noEmit
        working-directory: apps/desktop
        run: npm run ui:typecheck

      # ── 1 · the render check, fail-fast over the WINDOW bundle ─────────────
      # Built and smoked before the platform toolchains, offline audit included
      # (the page reaches nothing but the shell channel, so the audit runs on
      # the artifact that ships). `app:build:engine` (step 4) rebuilds dist/
      # from staged resources and scans+smokes it again beside the artifact.
      - name: Build the window bundle
        working-directory: apps/desktop
        run: npm run ui:build:engine

      - name: Smoke the window bundle
        working-directory: apps/desktop
        run: npm run smoke

      - name: cargo test (both configurations)
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          cargo test --locked
          cargo test --locked --features local-engine

      # ── 2 + 3 · the engine and the runtime it is spawned with ──────────────
      - name: Install the locked dependency tree
        run: npm ci --no-audit --no-fund

      # The bundler is a pinned devDependency of the root manifest, so the
      # `npm ci` above is the whole resolution and this step reaches no network.
      # engine-bundle.mjs asserts the version it got: the bundle is only
      # reproducible for a fixed esbuild, so a different one is refused, not used.
      - name: Build the engine bundle
        run: node scripts/engine-bundle.mjs

      # The engine boots from the layout it ships in, and — the half that makes
      # the first half worth anything — refuses to when the migration journal is
      # moved away. A bundle that resolved its journal from a build-time
      # absolute path would pass the first check while shipping broken.
      - name: The engine boots from the shipped layout, and only from it
        run: node scripts/verify-engine-boot.mjs

      # nodejs.org's own build, checksum-verified against the release manifest,
      # cached because it is a fifth of a gigabyte and never changes for a
      # pinned version. The cache key carries the version, so a bump in
      # scripts/vendor-node.mjs misses the cache rather than serving the old one.
      - uses: actions/cache@v4
        with:
          path: build/vendor
          # The pinned version is in the key, spelled here rather than read out
          # of the script: `scripts/vendor-node.mjs` runs its whole download on
          # import, so there is no way to ask it for its version without doing
          # the thing the cache exists to avoid. The cost of the duplication is
          # that a bump has to be made in both places — and the failure mode of
          # forgetting is a cache MISS, which downloads and verifies afresh. The
          # opposite arrangement, deriving the key from something that could go
          # stale, would serve the old runtime under the new version's name.
          key: vendor-node-darwin-v22.23.2

      - name: Vendor the Node runtime
        run: node scripts/vendor-node.mjs --platform darwin

      # ── 3b · the signing identity, and the ONE rule that keeps this workflow green ──
      #
      # WHEN THE SECRETS ARE UNSET THIS JOB KEEPS PRODUCING THE AD-HOC BUILD, byte
      # for byte what it produces today. Everything notarization-shaped below is
      # guarded on `SIGNED`, which is decided here and nowhere else, from whether
      # the certificate secret has a value. A fork, a pull request from one, and
      # this repository before the certificate exists all take the ad-hoc path and
      # stay green: a workflow is not allowed to go red for want of a secret it was
      # never given, because a red that means "not configured" trains everyone to
      # ignore the red that means "broken".
      #
      # The mode is a plain environment variable written once to $GITHUB_ENV rather
      # than a `secrets.*` expression repeated in eight `if:` conditions. One
      # decision, one place, and the later steps read a variable instead of each
      # re-deciding what "configured" means.
      - name: Import the Developer ID certificate, if there is one
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "no APPLE_CERTIFICATE — this run produces the ad-hoc build, as before"
            exit 0
          fi
          # EVERY TOOL THE SIGNING HALF SPAWNS, ASSERTED HERE — after the ad-hoc
          # return, so a run that signs nothing is never red for a tool it never
          # uses, and before the forty-minute build, so a runner image missing one
          # says so in the first minute rather than the last. These are Xcode's own
          # tools: there is nothing to download and no version to pin, so what a run
          # CAN say is which ones signed it, and it prints them.
          for t in security codesign ditto spctl xcrun; do
            command -v "$t" > /dev/null || { echo "the signing half needs $t and this runner has none" >&2; exit 1; }
          done
          for t in notarytool stapler; do
            xcrun --find "$t" > /dev/null || { echo "this runner's Xcode carries no $t" >&2; exit 1; }
          done
          echo "signing tools: $(xcodebuild -version 2>/dev/null | head -1) · notarytool $(xcrun notarytool --version 2>&1 | head -1)"
          # HALF-CONFIGURED IS A HARD FAILURE, not a silent fall back to ad-hoc. A
          # certificate with no password is somebody midway through setting this up,
          # and quietly shipping the unsigned artifact under a tag they believe is
          # signed is the worse of the two outcomes.
          test -n "${APPLE_CERTIFICATE_PASSWORD:-}" || { echo "APPLE_CERTIFICATE is set but APPLE_CERTIFICATE_PASSWORD is not" >&2; exit 1; }
          test -n "${KEYCHAIN_PASSWORD:-}" || { echo "APPLE_CERTIFICATE is set but KEYCHAIN_PASSWORD is not" >&2; exit 1; }
          # A job-scoped keychain, never the login one: the runner is disposable but
          # the default keychain is shared with whatever else the image does.
          KC="$RUNNER_TEMP/ohmail-signing.keychain-db"
          /usr/bin/security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          /usr/bin/security set-keychain-settings -lut 3600 "$KC"
          /usr/bin/security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          CERT_FILE="$RUNNER_TEMP/certificate.p12"
          # Created empty under a tight umask and removed on the way out however
          # this step ends: the file never exists with a mode wider than 600, and a
          # failed import leaves no certificate behind on the runner's disk.
          ( umask 077 && : > "$CERT_FILE" )
          trap 'rm -f "$CERT_FILE"' EXIT INT TERM
          /usr/bin/base64 -d <<< "$APPLE_CERTIFICATE" > "$CERT_FILE"
          /usr/bin/security import "$CERT_FILE" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERT_FILE"
          /usr/bin/security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC" > /dev/null
          # The job keychain must be ON THE SEARCH LIST or codesign cannot find the
          # identity; the existing list is kept so system roots still resolve.
          /usr/bin/security list-keychains -d user -s "$KC" $(/usr/bin/security list-keychains -d user | tr -d '"')
          # READ the identity out of the keychain rather than take it from a secret.
          # A mistyped APPLE_SIGNING_IDENTITY surfaces as `no identity found` deep
          # inside the bundler, where it reads as a Tauri failure and not as a typo.
          IDS="$(/usr/bin/security find-identity -v -p codesigning "$KC")"
          printf '%s\n' "$IDS"
          # `|| true` because this runs under `set -euo pipefail`: a grep that
          # matches nothing kills the step AT THE ASSIGNMENT, and the named refusal
          # below never prints — a wrong certificate would read as rc 1 and no
          # words at all. Measured on this exact line before it carried the guard.
          IDENTITY="$(printf '%s\n' "$IDS" | /usr/bin/grep -m1 'Developer ID Application' | sed 's/.*"\(.*\)"/\1/' || true)"
          test -n "$IDENTITY" || { echo "the imported certificate is not a Developer ID Application certificate" >&2; exit 1; }
          echo "SIGNED=1" >> "$GITHUB_ENV"
          echo "OHMAIL_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          # Read by the Tauri bundler, and it OVERRIDES bundle.macOS.signingIdentity
          # ("-") in tauri.conf.json — which is why that file needs no change and the
          # ad-hoc default stays the default everywhere else.
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing identity: $IDENTITY"

      # The App Store Connect API key, in the shape Tauri and notarytool both want.
      # Two of the three values are IDENTIFIERS and one is the private key; the key
      # is handed over as a FILE because that is the only form either tool accepts,
      # and it lives in the job-scoped RUNNER_TEMP for the life of the job.
      - name: Stage the notarization key, if there is one
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          if [ "${SIGNED:-0}" != "1" ]; then
            echo "not signing — no notarization key needed"
            exit 0
          fi
          # Signed but not notarizable is the same half-configured failure as above,
          # and worse: a Developer ID signature WITHOUT notarization is refused by
          # Gatekeeper on every Mac since Catalina, so the artifact would be less
          # installable than the ad-hoc one it replaced.
          test -n "${APPLE_API_KEY:-}" || { echo "signing is configured but APPLE_API_KEY is not" >&2; exit 1; }
          test -n "${APPLE_API_ISSUER:-}" || { echo "signing is configured but APPLE_API_ISSUER is not" >&2; exit 1; }
          test -n "${APPLE_API_KEY_P8_B64:-}" || { echo "signing is configured but APPLE_API_KEY_P8_B64 is not" >&2; exit 1; }
          NOTARY_KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          # It outlives this step — notarytool reads it by path further down — so
          # it gets the tight mode at creation rather than a trap.
          ( umask 077 && : > "$NOTARY_KEY_FILE" )
          /usr/bin/base64 -d <<< "$APPLE_API_KEY_P8_B64" > "$NOTARY_KEY_FILE"
          chmod 600 "$NOTARY_KEY_FILE"
          # Shape check, not a use: an empty or newline-mangled secret decodes to
          # something that is not a key, and notarytool's error for that arrives
          # after the build rather than here.
          /usr/bin/grep -q "BEGIN PRIVATE KEY" "$NOTARY_KEY_FILE" || { echo "APPLE_API_KEY_P8_B64 did not decode to a PEM private key" >&2; exit 1; }
          # All three are read by the Tauri bundler AND by the notarytool calls
          # later in this job. The identifiers are not secret; the file is.
          echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$NOTARY_KEY_FILE" >> "$GITHUB_ENV"
          echo "notarization key staged"

      # THE VENDORED NODE IS THE ONE NESTED MACH-O NOTARIZATION WILL JUDGE, AND IT
      # ARRIVES UNSIGNED. `vendor-node.mjs` `lipo -create`s the two official Node
      # builds into one universal binary at `build/vendor/node`, and lipo does not
      # carry a signature across — whatever Node's own release signing had is gone
      # by the time this file exists. Notarization refuses a bundle that contains an
      # unsigned Mach-O, and it refuses at the END of a forty-minute build.
      #
      # SIGNED HERE, before `tauri build` copies it into Contents/Resources, because
      # code signing is inside-out: the bundler's signature over the .app seals this
      # binary's own signature along with everything else. Signing it afterwards
      # would break the seal it is nested inside.
      #
      # PGlite is WebAssembly (`postgres.wasm`), not a native addon, so this is the
      # ONLY extra Mach-O in the bundle. If a `.node` or `.dylib` ever enters the
      # engine payload it needs the same treatment — and notarization is what will
      # say so, which is why the failure is worth understanding before it happens.
      #
      # The entitlements belong to the JavaScript engine, not to us. A hardened-runtime
      # process may not map memory that is both writable and executable without them, so
      # an un-entitled node is signed successfully, notarized successfully, and then dies
      # on its first JIT — which the packaged-engine check further down would catch, on
      # the runner, which is the right place but a slow way to learn it.
      - name: Sign the vendored Node runtime
        if: env.SIGNED == '1'
        run: |
          set -euo pipefail
          ENT="$RUNNER_TEMP/node.entitlements.plist"
          cat > "$ENT" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --timestamp --options runtime \
            --entitlements "$ENT" \
            --keychain "$OHMAIL_KEYCHAIN" \
            --sign "$APPLE_SIGNING_IDENTITY" \
            build/vendor/node
          codesign --verify --strict --verbose=2 build/vendor/node
          # NOT "is it signed" — WHICH key, and with the hardened runtime on. An
          # ad-hoc signature satisfies --verify and fails notarization; a Developer
          # ID signature without the runtime flag does the same.
          INFO="$(codesign --display --verbose=2 build/vendor/node 2>&1 || true)"
          printf '%s\n' "$INFO"
          case "$INFO" in
            *"Authority=Developer ID Application"*) echo "vendored node: Developer ID" ;;
            *) echo "the vendored node is not Developer ID signed" >&2; exit 1 ;;
          esac
          case "$INFO" in
            *"(runtime)"*) echo "vendored node: hardened runtime on" ;;
            *) echo "the vendored node was signed without the hardened runtime" >&2; exit 1 ;;
          esac

      # ── 4 · the app ───────────────────────────────────────────────────────
      # `app:build:engine` stages the engine and its runtime, rebuilds the UI
      # with the bridge, SMOKES that bundle, and only then bundles the app. The
      # render check is inside the script and not a step here on purpose — see
      # the header. A red smoke stops this step.
      - name: Build the engine-bearing app (universal), smoking its bundle
        working-directory: apps/desktop
        run: npm run app:build:engine -- --bundles app,dmg -- --target universal-apple-darwin -- --locked

      - name: Name the artifacts what the download page links
        run: |
          set -euo pipefail
          B=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          ls -la "$B/macos" "$B/dmg"
          # ── THE AD-HOC SIGNATURE, CHECKED AT THE SOURCE ───────────────────
          # On Apple silicon an unsigned Mach-O will not launch at all, so the
          # ad-hoc signature is the floor for a usable artifact — not a claim of
          # provenance. It is NOT applied here: `bundle.macOS.signingIdentity`
          # in tauri.conf.json is "-", so the bundler runs `codesign --force -s -`
          # itself, after it has staged the engine and the Node runtime into
          # Contents/Resources and before it builds the DMG. That ordering is
          # the whole reason it belongs to the bundler and not to a step here:
          # a signature applied afterwards would seal a bundle the DMG had
          # already been cut from, and the two artifacts would disagree.
          #
          # Verified at the .app rather than only at the mounted DMG, because
          # the .app is also what `ohmail.app.tar.gz` below is made of — the
          # updater payload that REPLACES an installed app. An unsigned payload
          # produces an install that cannot be launched, which no check on the
          # DMG can see. The README and the CHANGELOG say "ad-hoc signed"; this
          # is the assertion that keeps that sentence true.
          codesign --verify --verbose=2 "$B/macos/ohmail.app"
          # No pipe: under `set -o pipefail` a reader that closes early SIGPIPEs
          # the producer, and the step fails for a reason that is not the check.
          # `|| true` for the reason the identity read carries one: `--display`
          # exits non-zero on a binary it finds no signature on, `2>&1` has already
          # taken its words into the variable, and set -e would end the step here
          # with nothing printed — where the whole point is to print what it found
          # and then refuse by name.
          SIG_INFO="$(codesign --display --verbose=2 "$B/macos/ohmail.app" 2>&1 || true)"
          printf '%s\n' "$SIG_INFO"
          # WHAT THE SIGNATURE MUST BE, AND IT DEPENDS ON THE MODE.
          #
          # Ad-hoc mode keeps the original assertion unchanged and for the original
          # reason: a real Developer ID appearing on a run that was given no
          # certificate would mean the workflow had acquired signing material it is
          # not supposed to have.
          #
          # Signed mode asserts the opposite, and asserts the hardened runtime with
          # it, because notarization refuses a bundle signed without it and refuses
          # at the end of the build rather than here.
          if [ "${SIGNED:-0}" = "1" ]; then
            case "$SIG_INFO" in
              *"Authority=Developer ID Application"*) echo "Developer ID signed" ;;
              *) echo "the .app is not Developer ID signed — the identity did not reach the bundler" >&2; exit 1 ;;
            esac
            case "$SIG_INFO" in
              *"(runtime)"*) echo "hardened runtime on" ;;
              *) echo "the .app was signed without the hardened runtime; notarization would refuse it" >&2; exit 1 ;;
            esac
          else
            case "$SIG_INFO" in
              *"Signature=adhoc"*) echo "ad-hoc signed, as the README says" ;;
              *) echo "the .app is not ad-hoc signed — see bundle.macOS.signingIdentity" >&2; exit 1 ;;
            esac
          fi
          DMG="$(ls "$B"/dmg/*.dmg | head -1)"
          test -s "$DMG"
          mv "$DMG" build/ohmail.dmg
          # ── NOTARIZATION: VERIFIED, NOT ASSUMED ───────────────────────────
          #
          # With APPLE_API_* in the environment the bundler notarizes and staples on
          # its way past. Whether it staples the .app BEFORE it cuts the DMG is not
          # something this workflow should depend on: if it does, the two checks
          # below are cheap no-ops; if it does not, they do the work. Either way
          # what ships is asserted rather than inferred from who ran first.
          #
          # THE ORDER IS LOAD-BEARING, TWICE.
          #
          # Stapling REWRITES the artifact — that is what a stapled ticket is, a
          # ticket embedded so Gatekeeper can validate with no network. So the .app
          # is stapled BEFORE the tar below is cut, or the updater payload ships
          # without its ticket and the first offline launch after an update is
          # refused.
          #
          # And nothing may be stapled AFTER `release-feeds.yml` has signed it. That
          # job signs the BYTES of ohmail.app.tar.gz — minisign for latest.json,
          # EdDSA for the Sparkle appcast — and a staple afterwards makes every
          # signature it published wrong, which every updater reads as tampering and
          # refuses, silently and for good. A ticket that arrives late is not a
          # late improvement; it is a broken release. Rebuild instead.
          if [ "${SIGNED:-0}" = "1" ]; then
            APP="$B/macos/ohmail.app"
            staple_or_submit() {
              what="$1"; upload="$2"; log="$RUNNER_TEMP/notary-$3.log"
              if xcrun stapler validate "$what" > /dev/null 2>&1; then
                echo "$what already carries a notarization ticket"
                return 0
              fi
              echo "$what has no ticket — submitting"
              set +e
              xcrun notarytool submit "$upload" --wait --timeout 45m \
                --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
                > "$log" 2>&1
              rc=$?
              set -e
              cat "$log"
              # The exit code AND the status word. notarytool exits 0 for a
              # submission that completed and was REJECTED, so the code alone would
              # ship an Invalid build; and a status line with no exit code would
              # miss a transport failure. Both, or neither is enough.
              test "$rc" -eq 0 || { echo "notarytool exited $rc for $what" >&2; return 1; }
              /usr/bin/grep -q "status: Accepted" "$log" || {
                echo "notarization did not end Accepted for $what" >&2
                echo "  xcrun notarytool log <id> --key ... prints Apple's reasons" >&2
                return 1
              }
              xcrun stapler staple "$what"
            }
            # An .app is a directory; notarytool takes an archive. `ditto -c -k
            # --keepParent` is the zip Apple's own documentation names, and the zip
            # is a submission vehicle only — the artifact that ships is the .app the
            # ticket gets stapled to.
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/ohmail-app.zip"
            staple_or_submit "$APP" "$RUNNER_TEMP/ohmail-app.zip" app
            staple_or_submit build/ohmail.dmg build/ohmail.dmg dmg
            xcrun stapler validate "$APP"
            xcrun stapler validate build/ohmail.dmg
            # Proof from the tool that decides at launch, rather than from our own
            # bookkeeping: spctl is what Gatekeeper runs. "source=Notarized
            # Developer ID" is the only answer that means a double-click works.
            SPCTL="$(spctl -a -t exec -vv "$APP" 2>&1)"
            printf '%s\n' "$SPCTL"
            case "$SPCTL" in
              *"source=Notarized Developer ID"*) echo "Gatekeeper accepts the app as notarized" ;;
              *) echo "spctl does not see a notarized Developer ID app" >&2; exit 1 ;;
            esac
          fi
          # The updater payload. A GZIPPED TAR and not a zip: Tauri's macOS
          # updater unpacks with GzDecoder + tar and has no zip path at all, and
          # Sparkle — which the handover feed serves to installed SwiftUI
          # clients — reads gzipped tars too. One archive, two detached
          # signatures, both applied by the release-feeds workflow.
          # `--keepParent` equivalent: the archive must contain `ohmail.app/…`
          # at its root, because the updater strips exactly one leading
          # component when it extracts.
          tar -czf build/ohmail.app.tar.gz -C "$B/macos" ohmail.app
          ls -la build/ohmail.dmg build/ohmail.app.tar.gz

      # ── 5 · open it and look ──────────────────────────────────────────────
      # A DMG that does not mount is not an artifact, and an engine-bearing DMG
      # that carries no engine is worse. Mount it, assert every piece the app
      # resolves at runtime, unmount. If this fails the upload never happens.
      - name: The DMG mounts and carries the engine and its runtime
        run: |
          set -euo pipefail
          MNT="$(mktemp -d)"
          hdiutil attach build/ohmail.dmg -nobrowse -readonly -mountpoint "$MNT"
          APP="$MNT/ohmail.app"
          RES="$APP/Contents/Resources"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/ohmail"
          # The layout `engine.rs` composes from `resource_dir()`. Every path
          # here is one the app resolves at launch; a rename on either side
          # produces an app that packages cleanly and reports "no engine".
          test -f "$RES/engine/bin/ohmail-engine.mjs"
          test -d "$RES/engine/bin/node_modules/@electric-sql/pglite"
          test -d "$RES/engine/drizzle"
          test -x "$RES/runtime/node"
          test -s "$RES/runtime/node.LICENSE"
          # The vendored runtime RUNS, from inside the mounted image.
          "$RES/runtime/node" --version
          lipo -archs "$APP/Contents/MacOS/ohmail"
          lipo -archs "$RES/runtime/node"
          # THE HANDOVER FLOOR. CFBundleVersion has to order above the last
          # SwiftUI build (291) or Sparkle reads this release as a downgrade and
          # every installed Mac stays where it is, silently and permanently.
          BUILD_VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          echo "CFBundleVersion=$BUILD_VER"
          case "$BUILD_VER" in ''|*[!0-9]*) echo "CFBundleVersion is not an integer" >&2; exit 1 ;; esac
          test "$BUILD_VER" -gt 291
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          codesign --verify --verbose=2 "$APP"
          # In signed mode, report the state of the app INSIDE the image. This is
          # NOT a hard failure and the asymmetry is deliberate: the DMG carries its
          # own stapled ticket, which is what Gatekeeper reads when the image is
          # opened, and an app copied out of it that has no ticket of its own gets
          # an online notarization check on first launch — the ordinary outcome for
          # DMG distribution. The .app in `ohmail.app.tar.gz` is the one that MUST
          # carry a ticket, because it replaces an installed app that may never see
          # a network again, and that one is asserted above rather than reported.
          if [ "${SIGNED:-0}" = "1" ]; then
            if xcrun stapler validate "$APP" > /dev/null 2>&1; then
              echo "the app inside the image is stapled too"
            else
              echo "note: the app inside the image has no ticket of its own; the DMG's ticket covers opening it, and first launch after a copy is an online check"
            fi
            spctl -a -t exec -vv "$APP" || true
          fi
          hdiutil detach "$MNT"

      # THE PACKAGED APP'S OWN ENGINE, STARTED FROM THE PACKAGED LAYOUT, with a
      # PATH that has no node on it — which is what a Finder launch actually
      # gets. This is the check that the whole runtime-resolution slice exists
      # for: it fails if the vendored node is missing, not executable, or in the
      # wrong place, none of which the file assertions above can distinguish
      # from a working app.
      - name: The packaged engine starts with no node on PATH
        run: |
          set -euo pipefail
          B=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          RES="$B/macos/ohmail.app/Contents/Resources"
          D="$(mktemp -d)"
          set +e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" \
            OHMAIL_KEK="$(printf 'a%.0s' $(seq 64))" \
            OHMAIL_IMAP_HOST=127.0.0.1 OHMAIL_IMAP_PORT=59999 \
            OHMAIL_IMAP_USER=boot@local OHMAIL_MAILBOX_ADDRESS=boot@local \
            OHMAIL_IMAP_SECURE=0 OHMAIL_DATA_DIR="$D" \
            "$RES/runtime/node" "$RES/engine/bin/ohmail-engine.mjs" > "$D/out" 2> "$D/err" &
          ENGINE_PID=$!
          set -e
          # It serves and then waits on stdin. Read what it said, then stop it.
          for _ in $(seq 60); do grep -q '"event":"serving"' "$D/err" && break; sleep 0.5; done
          SERVED="$(grep -c '"event":"serving"' "$D/err" || true)"
          kill "$ENGINE_PID" 2>/dev/null || true
          wait "$ENGINE_PID" 2>/dev/null || true
          echo "--- engine stderr (last 20) ---"; tail -20 "$D/err"
          if [ "$SERVED" -lt 1 ]; then
            echo "the packaged engine did not reach 'serving' from the bundle layout" >&2
            exit 1
          fi
          echo "the packaged engine served, using only the runtime inside the app"

      # ── THE SHIPPED macOS BINARY IS READ THE WAY THE OTHER THREE ARE ─────
      #
      # Windows and both Linux jobs grep the binary they built for the CSP and
      # enumerate every URL in it; macOS did not, so a first-party address or a
      # missing CSP compiled into the .app shipped unchallenged. Same check,
      # same allow-list, read from the binary INSIDE the bundle — which is what
      # both the DMG and the updater payload are made of.
      #
      # The universal binary carries two architectures, so every string appears
      # twice; `sort -u` below already collapses that.
      - name: Inspect the URLs and the CSP in the shipped binary
        run: |
          set -euo pipefail
          B=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          BIN="$B/macos/ohmail.app/Contents/MacOS/ohmail"
          test -s "$BIN"
          # The shipped ELF is this job's architecture — see the `dpkg` note
          # the machine out of the ELF header, which is the artifact's own answer
          # rather than the runner's.
          grep -aq "connect-src 'none'" "$BIN"
          echo "URLs in the binary:"
          ALL_URLS="$(grep -aoE 'https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+' "$BIN" | sort -u)"
          printf '%s\n' "$ALL_URLS"
          # Identical rule to the Windows job — the update feed by prefix, the
          # Cloud API by equality, the browser link table page by page, and the
          # scheme split that keeps adjacent Rust literals from being judged as
          # one address; see the reasoning there.
          FEED_PREFIX='https://github.com/trafficflowhq/ohmail/releases/latest/download/latest.json'
          CLOUD_URL='https://api.ohmail.app'
          SPLIT_URLS="$(printf '%s\n' "$ALL_URLS" \
            | awk '{ gsub(/https?:\/\//, "\n&"); print }' | grep -E '^https?://' || true)"
          FIRST_PARTY="$(awk '{ h = $0; sub(/^https?:\/\//, "", h); sub(/[\/?#].*$/, "", h)
            if (tolower(h) ~ /ohmail|mailoh|trafficflow/ || $0 ~ /^https:\/\/github\.com\/trafficflowhq\//) print }' \
            <<< "$SPLIT_URLS" | sort -u || true)"
          if [ -z "$FIRST_PARTY" ]; then
            echo "the pinned update feed URL is missing from the binary" >&2
            exit 1
          fi
          BAD=0
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            case "$u" in
              "$FEED_PREFIX"*) : ;;
              # PREFIX, for the reason the comment above gives for the browser link
              # table: these are Rust string literals with no terminator sitting next
              # to each other in read-only data, so what comes back is whatever
              # follows glued on. This was the one entry still matching exactly, and
              # it held only while nothing happened to sit beside it — the first
              # release build of 0.13.3 failed on
              # `https://api.ohmail.appcloud-tokens.sealthe`, which is this URL with
              # two unrelated literals stuck to its end. The re-split on the scheme
              # above is what makes a prefix answer for exactly one address.
              "$CLOUD_URL"*) : ;;
              # The self-hosted door's PLACEHOLDER, not an endpoint. `example.com` is
              # reserved by IANA precisely so it can never resolve to anyone, and this
              # is the greyed-out example in the address field plus the same example
              # in the sentence under it. It is caught here only because it contains
              # the product name, which is what makes it a good placeholder.
              'https://ohmail.example.com'*) : ;;
              'https://ohmail.app/mailbox#/settings'*) : ;;
              # The mailboxes pane hand-off: a hosted install manages mailbox
              # ceremonies on the web, and the Settings pane opens this address
              # through the same fixed link table as the entries around it.
              'https://ohmail.app/mailbox?settings=mailboxes#/settings'*) : ;;
              # The devices pane hand-off, admitted for the same reason. Minting and
              # revoking a device is a step-up ceremony on the hosted door, and the
              # Settings pane reaches that pane by key through the same fixed table.
              'https://ohmail.app/mailbox?settings=devices#/settings'*) : ;;
              'https://ohmail.app/link-desktop'*) : ;;
              'https://ohmail.app/privacy'*) : ;;
              'https://ohmail.app/subprocessors'*) : ;;
              *) echo "  unexpected first-party URL: $u" >&2; BAD=1 ;;
            esac
          done <<< "$FIRST_PARTY"
          if [ "$BAD" -ne 0 ]; then
            echo "first-party URLs other than the named endpoints are present" >&2
            exit 1
          fi
          echo "unique URL strings (reconcile with the README enumeration): $(grep -c . <<< "$ALL_URLS" || true)"

      - name: Upload ohmail.dmg
        uses: actions/upload-artifact@v7
        with:
          name: ohmail-dmg-${{ github.run_number }}
          path: build/ohmail.dmg
          if-no-files-found: error

      - name: Upload the updater payload
        uses: actions/upload-artifact@v7
        with:
          name: ohmail-app-tgz-${{ github.run_number }}
          path: build/ohmail.app.tar.gz
          if-no-files-found: error

      - name: Run summary
        if: always()
        run: |
          # WHAT THIS SUMMARY SAYS ABOUT THE ARTIFACT FOLLOWS THE SAME ONE
          # DECISION AS THE SIGNATURE ITSELF, and defaults to the ad-hoc words:
          # this step is `if: always()`, so it also runs when the import step
          # failed and SIGNED was never written, and the sentence a reader must
          # never see is one claiming a notarized build nobody notarized. The
          # ad-hoc sentence keeps the right-click instructions; the signed one
          # has no instructions to give, which is the point of the change.
          if [ "${SIGNED:-0}" = "1" ]; then
            HEADING='### ohmail for macOS — signed and notarized (engine-bearing, universal)'
            CLOSING='Signed with a Developer ID and notarized by Apple: double-click to open it.'
          else
            HEADING='### ohmail for macOS — unsigned build (engine-bearing, universal)'
            CLOSING='Ad-hoc signed, **not** notarized. First launch: the double-click is blocked, then approve it under System Settings › Privacy & Security › "Open Anyway".'
          fi
          {
            echo "$HEADING"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| toolchain | $(rustc --version) · node $(node --version) |"
            echo "| runner | macOS $(sw_vers -productVersion) $(uname -m) |"
            for f in build/ohmail.dmg build/ohmail.app.tar.gz; do
              [ -f "$f" ] || continue
              echo "| $(basename "$f") | \`$(shasum -a 256 "$f" | cut -d' ' -f1)\` · $(du -h "$f" | cut -f1) |"
            done
            echo
            echo "$CLOSING"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Windows and Linux run the same steps in the same order as macOS; only the
  # packaging toolchain differs.
  # ==========================================================================

  windows:
    name: Windows · smoke · engine · nsis setup
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          node --version

      # `npm ci` and not `npm install`: apps/desktop carries its own committed
      # package-lock.json, so every builder resolves the tree this app was
      # tested against rather than whatever its ranges resolve to today — and a
      # build with no network can resolve it at all. `npm install` would
      # quietly rewrite a lock that had drifted from the manifest; `npm ci`
      # refuses it.
      - name: Install the desktop tree from its lockfile
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: tsc --noEmit
        working-directory: apps/desktop
        run: npm run ui:typecheck

      # Fail-fast render check over the WINDOW bundle — offline audit included;
      # app:build:engine rebuilds, scans and smokes it again beside the artifact.
      - name: Build the window bundle
        working-directory: apps/desktop
        run: npm run ui:build:engine

      - name: Smoke the window bundle
        working-directory: apps/desktop
        run: npm run smoke

      - name: cargo test (both configurations)
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          cargo test --locked
          cargo test --locked --features local-engine

      - name: Install the locked dependency tree
        run: npm ci --no-audit --no-fund

      # The bundler is a pinned devDependency of the root manifest, so the
      # `npm ci` above is the whole resolution and this step reaches no network.
      # engine-bundle.mjs asserts the version it got: the bundle is only
      # reproducible for a fixed esbuild, so a different one is refused, not used.
      - name: Build the engine bundle
        run: node scripts/engine-bundle.mjs

      - name: The engine boots from the shipped layout, and only from it
        run: node scripts/verify-engine-boot.mjs

      - uses: actions/cache@v4
        with:
          path: build/vendor
          key: vendor-node-windows-v22.23.2

      - name: Vendor the Node runtime
        run: node scripts/vendor-node.mjs --platform windows

      # The bundle is smoked inside this script, on this platform, before the app
      # is packaged — see the header.
      - name: Build the engine-bearing app, smoking its bundle
        working-directory: apps/desktop
        run: npm run app:build:engine -- --bundles nsis -- -- --locked

      - name: Name the artifact what the download page links
        run: |
          set -euo pipefail
          B=apps/desktop/src-tauri/target/release/bundle
          ls -la "$B/nsis"
          EXE="$(ls "$B"/nsis/*-setup.exe | head -1)"
          test -s "$EXE"
          mkdir -p build
          # RENAMED IN PLACE. Attaching both a versioned and a stable copy would
          # put two files behind the update feed's `*-setup.exe` glob, which
          # takes the first match — an arbitrary payload.
          mv "$EXE" build/ohmail-windows-setup.exe
          ls -la build/ohmail-windows-setup.exe

      - name: Inspect what was produced
        run: |
          set -euo pipefail
          EXE=build/ohmail-windows-setup.exe

          # ── The installer MUST be able to fetch the WebView2 runtime ───────
          #
          # THIS ASSERTION IS THE REVERSE OF WHAT IT USED TO BE, and the reversal
          # is a product decision rather than a loosened guard. A retired build
          # (the fixtures-only interface preview) set `webviewInstallMode: skip`
          # and this job proved the downloader was absent, because an app that
          # claimed to reach nothing had to not ship an installer that reaches
          # something.
          #
          # The engine-bearing build is a mail client. Its window IS the product,
          # so a missing WebView2 runtime is not a degraded experience, it is an
          # app that installs and then cannot start. `skip` turned that into the
          # user's problem on exactly the machines least able to diagnose it. The
          # engine build therefore uses `downloadBootstrapper`
          # (tauri.engine.conf.json) and the honest claim changed with it — see
          # the README: with WebView2 present the installer opens no connection;
          # without it, it downloads the runtime from Microsoft.
          #
          # (`skip` survives in the base config, which no shipped artifact is
          # built from alone. This check is about the artifact people download.)
          #
          # NSIS packs a plugin DLL only when a call to it is compiled, and
          # `NSISdl::download` lives inside
          # `!if INSTALLWEBVIEW2MODE == "downloadBootstrapper"` — so NSISdl.dll
          # present is exactly the evidence that the bootstrapper is compiled in.
          #
          # A relative path on purpose: 7z is a Windows binary and find/grep are
          # MSYS, and they disagree about D:\-style paths.
          rm -rf nsis-unpacked
          7z x -y -onsis-unpacked "$EXE" > /dev/null
          find nsis-unpacked
          # CAPTURED INTO A VARIABLE AND TESTED, never `producer | grep -q`.
          # `grep -q` exits at its first match and closes the pipe; the producer
          # then dies on SIGPIPE and the pipeline's status is that death, which
          # under `pipefail` is read as the opposite of what happened. Measured
          # on these very checks: 8 KB of output behaved, 168 KB and 840 KB did
          # not. The variable form has no pipe and no threshold.
          NSISDL="$(find nsis-unpacked -iname 'NSISdl.dll')"
          if [ -z "$NSISDL" ]; then
            echo "the WebView2 bootstrapper is NOT in the installer." >&2
            echo "The engine build needs it: without WebView2 the app cannot render at all." >&2
            echo "Check bundle.windows.webviewInstallMode in tauri.engine.conf.json." >&2
            exit 1
          fi
          echo "WebView2 bootstrapper present: $NSISDL"
          rm -rf nsis-unpacked

          BIN=apps/desktop/src-tauri/target/release/ohmail.exe
          test -s "$BIN"
          # The UI is embedded uncompressed on purpose (see src-tauri/Cargo.toml),
          # so the shipped binary can be audited without being run. `grep -a`
          # rather than `strings`, which Git Bash does not ship.
          grep -aq "connect-src 'none'" "$BIN"
          echo "URLs in the binary:"
          ALL_URLS="$(grep -aoE 'https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+' "$BIN" | sort -u)"
          printf '%s\n' "$ALL_URLS"
          # ── First-party endpoints: allow EXACTLY two, named one by one ─────
          # Every URL naming ohmail or trafficflow must be one of the two
          # endpoints below. A phone-home, a beacon or an analytics host still
          # fails, because the list is spelled out rather than pattern-matched.
          #
          # 1 · THE UPDATE FEED. Prefix match, not equality: the endpoint is a
          #   Rust string literal with no terminator in read-only data, so grep
          #   can return it with adjacent rodata glued on. Host and path are
          #   pinned by the prefix.
          #
          # 2 · THE CLOUD API. Added deliberately when the Cloud door shipped:
          #   `src/doors.ts` holds `CLOUD_URL = "https://api.ohmail.app"`, and
          #   the UI bundle is embedded uncompressed in the binary, so the host
          #   is legitimately present in every engine-bearing build. It is an
          #   endpoint the user opts into by signing in to the hosted service —
          #   the app contacts it only after that, never on its own.
          #
          #   EQUALITY, not a prefix, and that is the point: this one comes out
          #   of a JavaScript string literal, so the quote terminates it and the
          #   extracted URL is exactly the host with nothing glued on. Matching
          #   it exactly keeps `api.ohmail.app.example.com` a failure. If a real
          #   path is ever appended in the bundle this check goes red and the new
          #   endpoint gets named here too — which is the intended behaviour.
          #
          # 3 · THE BROWSER LINK TABLE. `engine.rs` holds the only addresses the
          #   app may hand to the user's own browser, as a fixed table the window
          #   selects from BY KEY — it can never name an address itself. Those
          #   addresses are therefore compiled in, and each is listed here one by
          #   one: a page added to that table without being named here fails the
          #   build, which is the point of spelling them out.
          #
          #   Prefix match, for the same reason as the feed: they are Rust string
          #   literals with no terminator, sitting next to each other in read-only
          #   data, so grep returns whatever follows glued on.
          #
          # THE LIST IS RE-SPLIT ON THE SCHEME FIRST. Adjacent literals come back
          # from grep as ONE match — `…/privacy` immediately followed by
          # `https://…/subprocessors` — and a single glued string would be judged
          # against the allow-list as though it were one address, so a page that
          # is not on the list could ride in behind one that is. Splitting on
          # `http` puts every address back on its own line before anything is
          # judged, which makes the prefix match answer for exactly one URL.
          FEED_PREFIX='https://github.com/trafficflowhq/ohmail/releases/latest/download/latest.json'
          CLOUD_URL='https://api.ohmail.app'
          SPLIT_URLS="$(printf '%s\n' "$ALL_URLS" \
            | awk '{ gsub(/https?:\/\//, "\n&"); print }' | grep -E '^https?://' || true)"
          # FIRST-PARTY IS DECIDED BY THE HOST, not by the whole glued string: a
          # third-party address with one of our own literals stuck to its end
          # (`https://tailscale.com/download` followed by `OHMAIL_BUILD_COMMIT…`)
          # is not an endpoint of ours. The feed lives under our GitHub owner.
          FIRST_PARTY="$(awk '{ h = $0; sub(/^https?:\/\//, "", h); sub(/[\/?#].*$/, "", h)
            if (tolower(h) ~ /ohmail|mailoh|trafficflow/ || $0 ~ /^https:\/\/github\.com\/trafficflowhq\//) print }' \
            <<< "$SPLIT_URLS" | sort -u || true)"
          if [ -z "$FIRST_PARTY" ]; then
            echo "the pinned update feed URL is missing from the binary" >&2
            exit 1
          fi
          BAD=0
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            case "$u" in
              "$FEED_PREFIX"*) : ;;
              # PREFIX, for the reason the comment above gives for the browser link
              # table: these are Rust string literals with no terminator sitting next
              # to each other in read-only data, so what comes back is whatever
              # follows glued on. This was the one entry still matching exactly, and
              # it held only while nothing happened to sit beside it — the first
              # release build of 0.13.3 failed on
              # `https://api.ohmail.appcloud-tokens.sealthe`, which is this URL with
              # two unrelated literals stuck to its end. The re-split on the scheme
              # above is what makes a prefix answer for exactly one address.
              "$CLOUD_URL"*) : ;;
              # The self-hosted door's PLACEHOLDER, not an endpoint. `example.com` is
              # reserved by IANA precisely so it can never resolve to anyone, and this
              # is the greyed-out example in the address field plus the same example
              # in the sentence under it. It is caught here only because it contains
              # the product name, which is what makes it a good placeholder.
              'https://ohmail.example.com'*) : ;;
              'https://ohmail.app/mailbox#/settings'*) : ;;
              # The mailboxes pane hand-off: a hosted install manages mailbox
              # ceremonies on the web, and the Settings pane opens this address
              # through the same fixed link table as the entries around it.
              'https://ohmail.app/mailbox?settings=mailboxes#/settings'*) : ;;
              # The devices pane hand-off, admitted for the same reason. Minting and
              # revoking a device is a step-up ceremony on the hosted door, and the
              # Settings pane reaches that pane by key through the same fixed table.
              'https://ohmail.app/mailbox?settings=devices#/settings'*) : ;;
              'https://ohmail.app/link-desktop'*) : ;;
              'https://ohmail.app/privacy'*) : ;;
              'https://ohmail.app/subprocessors'*) : ;;
              *) echo "  unexpected first-party URL: $u" >&2; BAD=1 ;;
            esac
          done <<< "$FIRST_PARTY"
          if [ "$BAD" -ne 0 ]; then
            echo "first-party URLs other than the named endpoints are present" >&2
            exit 1
          fi
          echo "unique URL strings (reconcile with the README enumeration): $(grep -c . <<< "$ALL_URLS" || true)"

      - name: Upload the setup .exe
        uses: actions/upload-artifact@v7
        with:
          name: ohmail-windows-${{ github.run_number }}
          path: build/ohmail-windows-setup.exe
          if-no-files-found: error

      # The lockfile the runner actually resolved. When a dependency changes,
      # this artifact is what gets committed back — `cargo build --locked`
      # from a fresh clone must reproduce the exact build CI made, and a
      # hand-assembled lockfile would carry unverified checksums.
      - name: Upload the resolved Cargo.lock
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock-${{ github.run_number }}
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: error

      - name: Run summary
        if: always()
        run: |
          {
            echo '### ohmail for Windows — unsigned build (engine-bearing)'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| toolchain | $(rustc --version) · node $(node --version) |"
            [ -f build/ohmail-windows-setup.exe ] && \
              echo "| ohmail-windows-setup.exe | \`$(sha256sum build/ohmail-windows-setup.exe | cut -d' ' -f1)\` · $(du -h build/ohmail-windows-setup.exe | cut -f1) |"
            echo
            echo 'Not signed with an Authenticode certificate: SmartScreen will warn on first run.'
            echo 'Choose **More info → Run anyway**.'
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux · smoke · engine · appimage + deb + rpm
    runs-on: ubuntu-latest
    # Seventy-five and not sixty since the perf smoke joined this job: importing ten thousand
    # messages and letting the process group settle is minutes on top of three packaged artifacts.
    timeout-minutes: 75
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Tauri's Linux prerequisites: the WebKitGTK webview it renders in, the
      # GTK/soup stack under it, and the tools its bundlers shell out to.
      #
      # `xdg-utils` is here because of what it is NOT on: the x86_64 runner image
      # ships `xdg-mime` and the arm64 one does not, so the AppImage bundler —
      # which shells out to it — worked on one architecture and failed on the
      # other with `xdg-mime binary not found`. Installed on BOTH rather than
      # only where it is missing, for the reason the arm64 job states about its
      # own list: a prerequisite that differs between two jobs meant to be
      # identical is how they stop being identical. A package already present is
      # a no-op.
      #
      # `rpm` and `cpio` are here for the INSPECTION, not for the build: Tauri
      # assembles the RPM with a Rust library and never shells out to
      # `rpmbuild`, so the packaging step needs nothing installed — but the step
      # that opens the finished package and reads its file list, its metadata and
      # its `Requires` is `rpm -qp`, and the one that reads the desktop entry out
      # of it is `rpm2cpio | cpio`. `rpm2cpio` comes with `rpm`; `cpio` DOES NOT,
      # and is not in every base image — measured on a stock Fedora 42, where
      # `rpm` and `rpm2cpio` are both present and `cpio` is absent. Naming both
      # here means a runner image that drops either is an apt failure rather than
      # a silently skipped set of assertions.
      - name: Install the Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            build-essential curl wget file patchelf desktop-file-utils \
            xdg-utils rpm cpio \
            xvfb x11-utils x11-apps

      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          node --version

      # `npm ci` and not `npm install`: apps/desktop carries its own committed
      # package-lock.json, so every builder resolves the tree this app was
      # tested against rather than whatever its ranges resolve to today — and a
      # build with no network can resolve it at all. `npm install` would
      # quietly rewrite a lock that had drifted from the manifest; `npm ci`
      # refuses it.
      - name: Install the desktop tree from its lockfile
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: tsc --noEmit
        working-directory: apps/desktop
        run: npm run ui:typecheck

      # Fail-fast render check over the WINDOW bundle — offline audit included;
      # app:build:engine rebuilds, scans and smokes it again beside the artifact.
      - name: Build the window bundle
        working-directory: apps/desktop
        run: npm run ui:build:engine

      - name: Smoke the window bundle
        working-directory: apps/desktop
        run: npm run smoke

      - name: cargo test (both configurations)
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          cargo test --locked
          cargo test --locked --features local-engine

      - name: Install the locked dependency tree
        run: npm ci --no-audit --no-fund

      # The bundler is a pinned devDependency of the root manifest, so the
      # `npm ci` above is the whole resolution and this step reaches no network.
      # engine-bundle.mjs asserts the version it got: the bundle is only
      # reproducible for a fixed esbuild, so a different one is refused, not used.
      - name: Build the engine bundle
        run: node scripts/engine-bundle.mjs

      - name: The engine boots from the shipped layout, and only from it
        run: node scripts/verify-engine-boot.mjs

      - uses: actions/cache@v4
        with:
          path: build/vendor
          key: vendor-node-linux-v22.23.2

      - name: Vendor the Node runtime
        run: node scripts/vendor-node.mjs --platform linux

      # ── THE APPIMAGE RECIPE BELONGS TO THIS REPOSITORY ────────────────────
      #
      # The Tauri bundler does not carry linuxdeploy's GTK plugin. It DOWNLOADS
      # it, at bundle time, from a third-party `master` branch into its tools
      # directory, and runs whatever it got — so the Linux artifacts' launcher
      # was tracking a branch nobody here watches. It downloads only when the
      # file is not already there, so writing ours first both pins the recipe
      # and is how the fixes in `src-tauri/linux/linuxdeploy-plugin-gtk.sh`
      # reach the artifact: the host-provided library that must not be shadowed,
      # the backend the caller gets to choose, the architecture-correct module
      # path, and the escape hatch. `Inspect what was produced` asserts all four
      # out of the finished AppImage, so a bundler that stopped reading this
      # path fails the build instead of quietly shipping the old recipe.
      - name: Pin the AppImage's GTK plugin to this repository's copy
        run: |
          set -euo pipefail
          TOOLS="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TOOLS"
          install -m 0755 apps/desktop/src-tauri/linux/linuxdeploy-plugin-gtk.sh \
            "$TOOLS/linuxdeploy-plugin-gtk.sh"
          ls -la "$TOOLS/linuxdeploy-plugin-gtk.sh"

      # The bundle is smoked inside this script, on this platform, before the app
      # is packaged — see the header.
      - name: Build the engine-bearing app, smoking its bundle
        # NO_STRIP: linuxdeploy strips the binary again while assembling the
        # AppImage, and on recent glibc that step is a known failure. The Rust
        # release profile already strips (src-tauri/Cargo.toml), so nothing is
        # lost — and the embedded UI stays readable either way, which is the
        # property the audit below depends on.
        env:
          NO_STRIP: "true"
        working-directory: apps/desktop
        run: npm run app:build:engine -- --bundles appimage,deb,rpm -- -- --locked

      - name: Name the artifacts what the download page links
        run: |
          set -euo pipefail
          B=apps/desktop/src-tauri/target/release/bundle
          ls -la "$B/appimage" "$B/deb" "$B/rpm"
          APPIMAGE="$(ls "$B"/appimage/*.AppImage | head -1)"
          DEB="$(ls "$B"/deb/*.deb | head -1)"
          # The bundler writes `ohmail-<version>-1.x86_64.rpm`, so this glob has
          # one match — the same arrangement as the two above it, and asserted
          # the same way: exactly one file, non-empty, before anything is moved.
          RPM="$(ls "$B"/rpm/*.rpm | head -1)"
          test -s "$APPIMAGE"
          test -s "$DEB"
          test -s "$RPM"
          mkdir -p build
          # Renamed in place, never copied — see the Windows job.
          mv "$APPIMAGE" build/ohmail-linux-x86_64.AppImage
          mv "$DEB" build/ohmail-linux-amd64.deb
          mv "$RPM" build/ohmail-linux-x86_64.rpm
          chmod +x build/ohmail-linux-x86_64.AppImage
          ls -la build/ohmail-linux-x86_64.AppImage build/ohmail-linux-amd64.deb \
            build/ohmail-linux-x86_64.rpm

      - name: Inspect what was produced
        run: |
          set -euo pipefail
          DEB=build/ohmail-linux-amd64.deb
          APPIMAGE=build/ohmail-linux-x86_64.AppImage
          RPM=build/ohmail-linux-x86_64.rpm

          echo "--- .deb control ---"
          dpkg-deb -I "$DEB"
          # Read the listing ONCE, into a variable, and match against that.
          #
          # Not several `dpkg-deb -c "$DEB" | grep -q …` pipelines, which is what
          # this was: `grep -q` exits at its first match and closes the pipe, and
          # the tar subprocess behind dpkg-deb then dies writing to it —
          # `tar: stdout: write error`. `pipefail` turns that into a failed step,
          # so a passing assertion reported a broken build, and whether it
          # happened depended on where the match sat relative to what tar had
          # already flushed.
          CONTENTS="$(dpkg-deb -c "$DEB")"
          echo "--- .deb contents ---"
          printf '%s\n' "$CONTENTS"
          # dpkg-deb lists paths with no leading slash, so anchor on the space
          # that ends the tar columns instead.
          grep -qE ' usr/bin/ohmail$' <<< "$CONTENTS"
          grep -qiE ' usr/share/applications/.+\.desktop$' <<< "$CONTENTS"
          grep -qiE ' usr/share/icons/hicolor/128x128/apps/.+\.png$' <<< "$CONTENTS"
          # THE ENGINE AND ITS RUNTIME ARE INSIDE THE PACKAGE. Tauri puts
          # resources under /usr/lib/<product>/ on Linux, which is what
          # `resource_dir()` resolves to and what `engine.rs` composes its two
          # paths from.
          grep -qE ' usr/lib/ohmail/engine/bin/ohmail-engine\.mjs$' <<< "$CONTENTS"
          grep -qE ' usr/lib/ohmail/engine/drizzle/' <<< "$CONTENTS"
          grep -qE ' usr/lib/ohmail/runtime/node$' <<< "$CONTENTS"
          # AND THE RUNTIME KEPT ITS EXECUTE BIT through the repackaging. The
          # shell holds it to "runnable, not merely present", so a lost mode is
          # reported to the user as a build with no Node in it — which reads as a
          # broken install rather than as a broken package. dpkg-deb prints the
          # mode in the first column.
          NODE_ROW="$(grep -E ' usr/lib/ohmail/runtime/node$' <<< "$CONTENTS")"
          echo "node row: $NODE_ROW"
          case "$NODE_ROW" in
            -rwxr-xr-x*) : ;;
            *) echo "the vendored runtime is not executable inside the .deb" >&2; exit 1 ;;
          esac
          # The bundler kebab-cases productName to get the package name. Since
          # productName is `ohmail`, so is the package — `apt remove ohmail`
          # works, and it matches /usr/bin/ohmail and the AppImage.
          test "$(dpkg-deb -f "$DEB" Package)" = "ohmail"
          # ── THE ARCHITECTURE THE FILENAME CLAIMS ──────────────────────────
          # There are two Linux jobs now and they differ in exactly one thing:
          # the machine they run on. Everything else — the checkout, the scripts,
          # the bundler invocation — is identical, so a misconfigured `runs-on`
          # produces a COMPLETE, WORKING artifact under the other architecture's
          # name, and every check above it passes. `dpkg` names the architecture
          # itself, which makes this the one assertion that can tell the two jobs
          # apart. The AppImage half is asserted from the ELF below.
          test "$(dpkg-deb -f "$DEB" Architecture)" = "amd64"

          # THE .deb INSTALLS THE SAME DESKTOP ENTRY, and it is asserted here as well as inside the
          # AppImage further down. One template feeds both — the AppImage's AppDir is built from
          # this package's data directory — but that is a fact about the bundler, not a check, and
          # it is exactly the kind of shared assumption that stops being true without anything
          # going red. The entry claims to handle mailto:, so the field code that carries the
          # address has to be on the Exec line or the claim is false for everyone who installs the
          # .deb. Captured into a variable before it is matched: a producer killed by a closed pipe
          # is indistinguishable from one that found nothing.
          # The member is named EXACTLY, and there must be exactly one of it. A wildcard like
          # `*/applications/ohmail.desktop` matches any member with that ending, so a resource or
          # fixture at some other path would answer for the installed entry — and tar concatenates
          # every match, which would let the Exec line and the MimeType line come from two
          # different files. The leading `./` is matched optionally rather than assumed: this
          # bundler writes the members WITHOUT it, and pinning the spelling to one form is how a
          # check like this quietly stops matching anything.
          DEB_MEMBERS="$(dpkg-deb --fsys-tarfile "$DEB" | tar -t)"
          ENTRY_MEMBER="$(printf '%s\n' "$DEB_MEMBERS" | grep -E '^(\./)?usr/share/applications/ohmail\.desktop$' || true)"
          ENTRY_COUNT="$(printf '%s\n' "$ENTRY_MEMBER" | grep -c . || true)"
          if [ "$ENTRY_COUNT" != 1 ]; then
            echo "the .deb holds $ENTRY_COUNT desktop entries at usr/share/applications/ohmail.desktop" >&2
            exit 1
          fi
          DEB_ENTRY="$(dpkg-deb --fsys-tarfile "$DEB" | tar -xO "$ENTRY_MEMBER")"
          printf '%s\n' "$DEB_ENTRY"
          printf '%s\n' "$DEB_ENTRY" | grep -qx 'Exec=ohmail %U' || {
            echo "the .deb's desktop entry does not hand the URL to the app" >&2; exit 1; }
          printf '%s\n' "$DEB_ENTRY" | grep -q '^MimeType=.*x-scheme-handler/mailto' || {
            echo "the .deb's desktop entry no longer claims mailto" >&2; exit 1; }

          # ══ THE .rpm CARRIES THE SAME TREE, ASSERTED SEPARATELY ═══════════
          #
          # Not "the bundler builds all three from one staging directory, so if
          # the .deb is right the .rpm is". That is true of this Tauri and is
          # exactly the shared assumption that stops being true without anything
          # going red — the same argument the .deb's desktop-entry check above
          # makes about the AppImage. The three artifacts are what a stranger
          # installs, and each is opened here on its own.
          #
          # Read with `rpm -qp` (query an uninstalled package file). Every
          # listing goes into a VARIABLE before it is matched, for the reason
          # this file gives at length about `dpkg-deb -c | grep -q`: `grep -q`
          # exits at its first match, closes the pipe, and the producer behind it
          # dies — which under `pipefail` turns a passing assertion into a failed
          # step, and without it turns a dead producer into "found nothing".
          echo "--- .rpm metadata ---"
          rpm -qpi "$RPM"
          # WHAT THE PACKAGE MANAGER WILL DEMAND OF THE MACHINE, PRINTED. The
          # config declares no dependencies — the mail engine and its Node
          # runtime are inside the artifact and the webview stack is the
          # machine's, the same posture as the .deb — so this is a record of what
          # the bundler adds on its own, and the one place a reader can see it
          # change between releases.
          echo "--- .rpm requires ---"
          rpm -qp --requires "$RPM"
          RPM_FILES="$(rpm -qpl "$RPM")"
          echo "--- .rpm contents ---"
          printf '%s\n' "$RPM_FILES"
          # rpm lists absolute paths, so these anchor on the leading slash where
          # the .deb's anchor on the space that ends dpkg's columns.
          grep -qx '/usr/bin/ohmail' <<< "$RPM_FILES"
          grep -qx '/usr/share/applications/ohmail.desktop' <<< "$RPM_FILES"
          grep -qE '^/usr/share/icons/hicolor/128x128/apps/.+\.png$' <<< "$RPM_FILES"
          grep -qx '/usr/lib/ohmail/engine/bin/ohmail-engine.mjs' <<< "$RPM_FILES"
          grep -qE '^/usr/lib/ohmail/engine/drizzle/' <<< "$RPM_FILES"
          grep -qx '/usr/lib/ohmail/runtime/node' <<< "$RPM_FILES"
          # AND THE RUNTIME KEPT ITS EXECUTE BIT. The same property as the
          # .deb's, matched the same way — against the permission string, not a
          # numeric mode: `:perms` is rpm's own renderer for it, and it prints
          # what `ls -l` prints, which is what the .deb check above compares.
          # Same shape, same words, so the two are read together. A runtime that
          # lost its mode is reported to the person as a build with no Node in
          # it, which reads as a broken install rather than as a broken package.
          NODE_ROW="$(rpm -qp --qf '[%{FILEMODES:perms} %{FILENAMES}\n]' "$RPM" \
            | awk '$2 == "/usr/lib/ohmail/runtime/node"')"
          echo "node row: $NODE_ROW"
          # An EMPTY row is its own arm, and it has to be: the two states are
          # "rpm answered and the mode is wrong" and "the query returned
          # nothing", and one message for both would report a mistyped format
          # string as a lost execute bit. The file list above already asserted
          # the member is in the package, so nothing here can be empty for an
          # innocent reason.
          if [ -z "$NODE_ROW" ]; then
            echo "the .rpm mode query named no file — read the format string, not the package" >&2
            exit 1
          fi
          case "$NODE_ROW" in
            -rwxr-xr-x*) : ;;
            *) echo "the vendored runtime is not executable inside the .rpm: $NODE_ROW" >&2; exit 1 ;;
          esac
          # The package name is the one word this project spells everywhere —
          # `dnf remove ohmail` works, and it matches /usr/bin/ohmail, the .deb
          # and the AppImage.
          # Each reading is PRINTED and refused BY NAME. The 0.16.0 build died here silently: a bare `test`
          # and an unread pipeline exit both leave a step with "exit code 1" and nothing before it.
          NAME_READ="$(rpm -qp --qf '%{NAME}' "$RPM")"; echo "rpm name: $NAME_READ"
          [ "$NAME_READ" = "ohmail" ] || { echo "the .rpm is named '$NAME_READ', not ohmail" >&2; exit 1; }
          # ── THE ARCHITECTURE THE FILENAME CLAIMS ──────────────────────────
          # The same assertion the .deb makes, and it is the reason the .rpm is
          # worth querying at all: a misconfigured `runs-on` produces a complete,
          # working package under the other architecture's name and every check
          # above this line passes. rpm names the architecture itself. Note the
          # spelling is the MACHINE's (`x86_64`), not Debian's — see the
          # artifact-name contract in the header.
          ARCH_READ="$(rpm -qp --qf '%{ARCH}' "$RPM")"; echo "rpm arch: $ARCH_READ"
          [ "$ARCH_READ" = "x86_64" ] || { echo "the .rpm architecture is '$ARCH_READ', not x86_64" >&2; exit 1; }
          # THE .rpm INSTALLS THE SAME DESKTOP ENTRY. It is configured from the
          # same template as the .deb's (bundle.linux.rpm.desktopTemplate), and
          # that identity is asserted in the tree by `desktop-linux-recipe.test.ts`
          # — but a template both sections name is a fact about the config, not a
          # check on the artifact, and the entry's `mailto:` claim is false for
          # everyone who installs this package if the field code is missing.
          # Extracted with rpm2cpio into a variable; `--to-stdout` writes the one
          # member named.
          # The payload's member names may or may not carry a leading `./` — that depends on the writer, not
          # on the package — so the entry is found by SUFFIX in the listing, and an empty listing or a
          # failed extraction prints cpio's own words instead of exiting in silence.
          # The rpm2cpio | cpio pipeline exits NON-ZERO on this runner while printing a complete listing and
          # no error (measured on the 0.16.0 rebuild: 355 members, the entry among them, exit 1). The
          # assertion is about the ARTIFACT's content, so the content decides and the two exit statuses are
          # printed for the record rather than allowed to end the step in silence.
          LISTING="$(mktemp)"
          set +e +o pipefail
          rpm2cpio "$RPM" | cpio -it --quiet > "$LISTING" 2>&1; LIST_STATUS="${PIPESTATUS[*]}"
          set -e -o pipefail
          MEMBERS="$(cat "$LISTING")"
          echo "payload listing: $(grep -c . "$LISTING") line(s); rpm2cpio/cpio exit statuses: $LIST_STATUS"
          ENTRY_MEMBER="$(grep -E '(^|/)usr/share/applications/ohmail\.desktop$' <<< "$MEMBERS" | head -n 1 || true)"
          echo "desktop entry member: ${ENTRY_MEMBER:-<none>}"
          [ -n "$ENTRY_MEMBER" ] || { echo "the .rpm payload lists no usr/share/applications/ohmail.desktop member" >&2; exit 1; }
          ENTRY_OUT="$(mktemp)"
          set +e +o pipefail
          rpm2cpio "$RPM" | cpio -i --quiet --to-stdout "$ENTRY_MEMBER" > "$ENTRY_OUT" 2>&1; EXTRACT_STATUS="${PIPESTATUS[*]}"
          set -e -o pipefail
          RPM_ENTRY="$(cat "$ENTRY_OUT")"
          echo "desktop entry extracted: $(grep -c . "$ENTRY_OUT") line(s); rpm2cpio/cpio exit statuses: $EXTRACT_STATUS"
          [ -n "$RPM_ENTRY" ] || { echo "the .rpm desktop entry extracted EMPTY (statuses $EXTRACT_STATUS)" >&2; exit 1; }
          printf '%s\n' "$RPM_ENTRY"
          printf '%s\n' "$RPM_ENTRY" | grep -qx 'Exec=ohmail %U' || {
            echo "the .rpm's desktop entry does not hand the URL to the app" >&2; exit 1; }
          printf '%s\n' "$RPM_ENTRY" | grep -q '^MimeType=.*x-scheme-handler/mailto' || {
            echo "the .rpm's desktop entry no longer claims mailto" >&2; exit 1; }
          printf '%s\n' "$RPM_ENTRY" | grep -qx 'StartupWMClass=ohmail' || {
            echo "the .rpm's desktop entry cannot be matched to the window" >&2; exit 1; }

          # ── The AppImage carries the same tree ────────────────────────────
          # Extracted rather than mounted: a runner has no FUSE.
          rm -rf squashfs-root
          ./"$APPIMAGE" --appimage-extract > /dev/null
          test -f squashfs-root/usr/lib/ohmail/engine/bin/ohmail-engine.mjs
          test -d squashfs-root/usr/lib/ohmail/engine/drizzle
          test -x squashfs-root/usr/lib/ohmail/runtime/node
          # It RUNS, which no file assertion can stand in for.
          squashfs-root/usr/lib/ohmail/runtime/node --version

          # ── THE LAUNCHER, READ OUT OF THE ARTIFACT ────────────────────────
          #
          # The AppImage's launcher is written by a plugin the bundler would
          # otherwise fetch from a branch outside this repository, so what it
          # actually did is asserted here rather than inferred from the file
          # installed for it. Each of these four was a fault on a real machine
          # before it was a check.
          TRIPLE=x86_64-linux-gnu
          EXPECT_MACHINE="Advanced Micro Devices X86-64"
          HOOK=squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
          test -f "$HOOK"
          cat "$HOOK"

          # 1. The GL driver is the HOST's, and Mesa's libEGL links
          #    libwayland-client. An AppImage puts its own usr/lib ahead of the
          #    system path for every process it starts, so a copy in here is
          #    loaded instead of the one the host's driver was built against;
          #    where the host's Mesa is newer, the driver fails to load and the
          #    web process aborts with "Could not create default EGL display:
          #    EGL_BAD_PARAMETER" — a window that maps and never draws.
          #    Captured into a variable rather than piped into `grep -q`: a
          #    producer killed by a closed pipe looks exactly like one that found
          #    nothing, and this assertion must not be able to pass that way.
          SHADOWED="$(find squashfs-root -name 'libwayland-client.so*' -print)"
          if [ -n "$SHADOWED" ]; then
            echo "the AppImage bundles a library the host must provide:" >&2
            printf '%s\n' "$SHADOWED" >&2
            exit 1
          fi

          # 2. GDK_BACKEND belongs to whoever launches the app. Forcing x11 put
          #    every Wayland session on XWayland at 1x — blurry on a HiDPI
          #    screen — and overrode a caller who had asked for something else.
          # Asserted by RUNNING the launcher's environment, not by matching text in it. A grep for
          # `^export GDK_BACKEND=` is blind to the same assignment indented, wrapped in a
          # conditional, or spelled as a bare assignment exported later — all valid shell, all
          # still forcing the backend.
          #
          # The probe reports the sourcing STATUS as well as the value, because they are different
          # questions and only one of them was being asked: with the status discarded, a hook with
          # a syntax error sources to nothing, the `printf` after it still runs, and "could not
          # execute the hook" arrives looking exactly like "the hook left the variable alone".
          #
          # `set +eu` inside the subshell, and APPDIR exported as its own statement rather than as
          # an assignment prefix on `.`. Both are load-bearing: the hook reads `$XDG_DATA_DIRS`,
          # which `-u` turns into a fatal error where it happens to be unset, and the prefix form
          # left the subshell dying before it could print — which under `set -e` outside took the
          # whole step down with an empty message. Found by running it.
          probe_backend() {
            (
              set +eu
              unset GDK_BACKEND OHMAIL_SYSTEM_WEBKIT
              if [ -n "$1" ]; then export GDK_BACKEND="$1"; fi
              export APPDIR="$PWD/squashfs-root"
              . "$HOOK" >/dev/null 2>&1
              rc=$?
              printf '%s|%s' "$rc" "${GDK_BACKEND-<unset>}"
            )
          }
          # BOTH DIRECTIONS. Probing only the unset case passes a hook that forces x11 exactly
          # when the caller HAS chosen — which is the case the whole fix is about, and which the
          # comment above this check used to claim was covered when it was not.
          for want in "<unset>" wayland; do
            case "$want" in
              "<unset>") got="$(probe_backend "")"      ; how="with no backend chosen" ;;
              *)         got="$(probe_backend "$want")" ; how="with GDK_BACKEND=$want chosen" ;;
            esac
            rc="${got%%|*}"; val="${got#*|}"
            echo "launcher hook $how: status $rc, GDK_BACKEND=$val"
            if [ "$rc" != 0 ]; then
              echo "the launcher hook could not be sourced (status '$rc') — this check proved nothing" >&2
              exit 1
            fi
            if [ "$val" != "$want" ]; then
              echo "the launcher decides the display backend $how: expected $want, got $val" >&2
              exit 1
            fi
          done

          # 3. Every library directory the launcher names is THIS
          #    architecture's. The upstream plugin spells the x86_64 triple
          #    literally, which put a directory no arm64 machine has into the
          #    arm64 build's GTK_PATH.
          TRIPLES="$(grep -aoE '[a-z0-9_]+-linux-gnu' "$HOOK" | sort -u || true)"
          echo "library triples named by the launcher: $TRIPLES"
          FOREIGN="$(printf '%s\n' "$TRIPLES" | grep -v "^$TRIPLE$" | grep -v '^$' || true)"
          if [ -n "$FOREIGN" ]; then
            echo "the launcher names another architecture's directories: $FOREIGN" >&2
            exit 1
          fi
          # AND the system fallback is read out of GTK_PATH's own VALUE. Two earlier drafts of this
          # correlated independent greps — "a GTK_PATH line exists" and "the right triple appears
          # somewhere in the hook" — and both pass a GTK_PATH that has lost everything except its
          # AppDir component, because the AppDir component contains the triple too and four other
          # exports spell one as well. The value is what the launcher gives GTK, so the value is
          # what gets asserted: at least one entry that is NOT under the AppDir and IS this
          # architecture's module directory.
          # GTK_PATH is unset before sourcing for the same reason GDK_BACKEND is: a runner that
          # happens to export one would satisfy every test below without the artifact setting it
          # at all — the value would be the RUNNER's, and a hook that had lost the line entirely
          # would pass.
          GTKPATH="$(
            set +eu
            unset OHMAIL_SYSTEM_WEBKIT GTK_PATH
            export APPDIR="$PWD/squashfs-root"
            . "$HOOK" >/dev/null 2>&1
            rc=$?
            printf '%s|%s' "$rc" "${GTK_PATH-<unset>}"
          )"
          gtk_rc="${GTKPATH%%|*}"; gtk_val="${GTKPATH#*|}"
          echo "GTK_PATH the launcher produces: $gtk_val"
          if [ "$gtk_rc" != 0 ]; then
            echo "the launcher hook could not be sourced (status '$gtk_rc') — this check proved nothing" >&2
            exit 1
          fi
          if [ "$gtk_val" = "<unset>" ]; then
            echo "the launcher sets no GTK_PATH" >&2
            exit 1
          fi
          SYS_ENTRY=""
          while IFS= read -r part; do
            [ -n "$part" ] || continue
            case "$part" in "$PWD/squashfs-root"*) continue ;; esac
            case "$part" in *"$TRIPLE"/gtk-3.0) SYS_ENTRY="$part" ;; esac
          done <<< "$(printf '%s' "$gtk_val" | tr ':' '\n')"
          if [ -z "$SYS_ENTRY" ]; then
            echo "GTK_PATH names no $TRIPLE system fallback outside the AppDir: $gtk_val" >&2
            exit 1
          fi
          echo "GTK_PATH's system fallback: $SYS_ENTRY"

          # 4. The escape hatch: one variable to run against the host's GTK and
          #    WebKitGTK, for a machine where the bundled stack cannot start.
          # The BRANCH, not the token. The hook explains itself in comments that also spell
          # OHMAIL_SYSTEM_WEBKIT, so a check for the name alone stays green after the `if`/`exec`
          # is deleted and only the prose survives. Both halves are asserted, because the exec
          # without LD_LIBRARY_PATH escapes nothing: the binary carries
          # DT_RUNPATH=$ORIGIN/../lib and would resolve the bundled stack anyway.
          grep -aqE '^if \[ -n "\$OHMAIL_SYSTEM_WEBKIT" \]; then$' "$HOOK" || {
            echo "the launcher has no OHMAIL_SYSTEM_WEBKIT branch" >&2; exit 1; }
          grep -aqE '^ *LD_LIBRARY_PATH="\$_ohmail_sys" exec "\$APPDIR/usr/bin/ohmail" "\$@"$' "$HOOK" || {
            echo "the escape branch does not override the binary's RUNPATH" >&2; exit 1; }
          # And it has to come FIRST: anything exported above it is already in the environment of
          # the process it execs, which is the whole thing the escape is trying not to inherit.
          ESCAPE_LINE="$(grep -an '^if \[ -n "\$OHMAIL_SYSTEM_WEBKIT" \]; then$' "$HOOK" | cut -d: -f1)"
          FIRST_EXPORT="$(grep -an '^export GTK_DATA_PREFIX=' "$HOOK" | cut -d: -f1)"
          if [ -z "$FIRST_EXPORT" ] || [ "$ESCAPE_LINE" -ge "$FIRST_EXPORT" ]; then
            echo "the escape branch is not ahead of the AppDir exports (escape $ESCAPE_LINE, exports $FIRST_EXPORT)" >&2
            exit 1
          fi

          # ── THE DESKTOP ENTRY ─────────────────────────────────────────────
          #
          # The entry claims x-scheme-handler/mailto, which is what makes ohmail
          # selectable as the system mail app. Without a field code on Exec the
          # desktop environment launches it with no argument at all and the
          # address the person clicked is dropped — the claim would be false.
          ENTRY=squashfs-root/usr/share/applications/ohmail.desktop
          test -f "$ENTRY"
          cat "$ENTRY"
          grep -aqx 'Exec=ohmail %U' "$ENTRY" || {
            echo "the desktop entry does not hand the URL to the app" >&2; exit 1; }
          grep -aq '^MimeType=.*x-scheme-handler/mailto' "$ENTRY" || {
            echo "the desktop entry no longer claims mailto" >&2; exit 1; }
          # The window maps under this name — the Wayland app_id, and the X11
          # WM_CLASS instance name — which is what attributes a running window to
          # this entry instead of drawing a second, unlabelled taskbar icon.
          grep -aqx 'StartupWMClass=ohmail' "$ENTRY" || {
            echo "the desktop entry cannot be matched to the window" >&2; exit 1; }

          # ── EVERY BUNDLED LIBRARY IS THIS ARCHITECTURE'S ──────────────────
          #
          # The shipped binary's own ELF is asserted below; the ~150 libraries
          # beside it were not, and nothing else here would notice one copied
          # from the wrong place.
          # EVERY regular file under usr/ is a candidate, not only the ones named *.so*. Scanning by
          # name misses the four that matter most: usr/bin/ohmail, the vendored runtime/node, and
          # WebKitNetworkProcess and WebKitWebProcess — the last being the very process whose
          # architecture this release is about.
          #
          # The file list is captured by a command whose status is checked. Inside a process
          # substitution `find` reports to nobody: a traversal that dies part-way leaves the loop
          # exiting zero over however many files it happened to get, and `set -euo pipefail` never
          # sees it.
          FILES="$(find squashfs-root/usr -type f)"
          # ELF-ness is decided by the file's own magic, not by whether readelf succeeded. Reading
          # it from readelf's exit status makes a CORRUPT shared object indistinguishable from a
          # PNG — both produce no machine, and the loop would skip the one it exists to catch.
          WRONG=""
          CHECKED=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            magic="$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')"
            if [ "$magic" != "7f454c46" ]; then continue; fi
            CHECKED=$((CHECKED + 1))
            m="$(readelf -h "$f" 2>/dev/null | sed -n 's/^ *Machine: *//p' || true)"
            if [ -z "$m" ]; then
              WRONG="$WRONG  $f (an ELF file readelf cannot parse)"$'\n'
            elif [ "$m" != "$EXPECT_MACHINE" ]; then
              WRONG="$WRONG  $f ($m)"$'\n'
            fi
          done <<< "$FILES"
          if [ -n "$WRONG" ]; then
            echo "files that are not this job's architecture:" >&2
            printf '%s' "$WRONG" >&2
            exit 1
          fi
          # A floor, because "nothing was wrong" and "nothing was looked at" print the same way.
          # The released artifacts carry about 170; 100 is well under that and well over zero.
          if [ "$CHECKED" -lt 100 ]; then
            echo "only $CHECKED ELF files found under usr/ — the scan found almost nothing" >&2
            exit 1
          fi
          echo "all $CHECKED ELF files under usr/ are $EXPECT_MACHINE"

          rm -rf squashfs-root

          BIN=apps/desktop/src-tauri/target/release/ohmail
          test -s "$BIN"
          # The shipped ELF is this job's architecture — see the `dpkg` note
          # above for why an architecture is asserted at all. `readelf -h` prints
          # the machine out of the ELF header, which is the artifact's own answer
          # rather than the runner's.
          ELF_MACHINE="$(readelf -h "$BIN" | sed -n 's/^ *Machine: *//p')"
          echo "ELF machine: $ELF_MACHINE"
          test "$ELF_MACHINE" = "Advanced Micro Devices X86-64"
          grep -aq "connect-src 'none'" "$BIN"
          echo "URLs in the binary:"
          ALL_URLS="$(grep -aoE 'https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+' "$BIN" | sort -u)"
          printf '%s\n' "$ALL_URLS"
          # Identical rule to the Windows job — the update feed by prefix, the
          # Cloud API by equality, the browser link table page by page, and the
          # scheme split that keeps adjacent Rust literals from being judged as
          # one address; see the reasoning there.
          FEED_PREFIX='https://github.com/trafficflowhq/ohmail/releases/latest/download/latest.json'
          CLOUD_URL='https://api.ohmail.app'
          SPLIT_URLS="$(printf '%s\n' "$ALL_URLS" \
            | awk '{ gsub(/https?:\/\//, "\n&"); print }' | grep -E '^https?://' || true)"
          FIRST_PARTY="$(awk '{ h = $0; sub(/^https?:\/\//, "", h); sub(/[\/?#].*$/, "", h)
            if (tolower(h) ~ /ohmail|mailoh|trafficflow/ || $0 ~ /^https:\/\/github\.com\/trafficflowhq\//) print }' \
            <<< "$SPLIT_URLS" | sort -u || true)"
          if [ -z "$FIRST_PARTY" ]; then
            echo "the pinned update feed URL is missing from the binary" >&2
            exit 1
          fi
          BAD=0
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            case "$u" in
              "$FEED_PREFIX"*) : ;;
              # PREFIX, for the reason the comment above gives for the browser link
              # table: these are Rust string literals with no terminator sitting next
              # to each other in read-only data, so what comes back is whatever
              # follows glued on. This was the one entry still matching exactly, and
              # it held only while nothing happened to sit beside it — the first
              # release build of 0.13.3 failed on
              # `https://api.ohmail.appcloud-tokens.sealthe`, which is this URL with
              # two unrelated literals stuck to its end. The re-split on the scheme
              # above is what makes a prefix answer for exactly one address.
              "$CLOUD_URL"*) : ;;
              # The self-hosted door's PLACEHOLDER, not an endpoint. `example.com` is
              # reserved by IANA precisely so it can never resolve to anyone, and this
              # is the greyed-out example in the address field plus the same example
              # in the sentence under it. It is caught here only because it contains
              # the product name, which is what makes it a good placeholder.
              'https://ohmail.example.com'*) : ;;
              'https://ohmail.app/mailbox#/settings'*) : ;;
              # The mailboxes pane hand-off: a hosted install manages mailbox
              # ceremonies on the web, and the Settings pane opens this address
              # through the same fixed link table as the entries around it.
              'https://ohmail.app/mailbox?settings=mailboxes#/settings'*) : ;;
              # The devices pane hand-off, admitted for the same reason. Minting and
              # revoking a device is a step-up ceremony on the hosted door, and the
              # Settings pane reaches that pane by key through the same fixed table.
              'https://ohmail.app/mailbox?settings=devices#/settings'*) : ;;
              'https://ohmail.app/link-desktop'*) : ;;
              'https://ohmail.app/privacy'*) : ;;
              'https://ohmail.app/subprocessors'*) : ;;
              *) echo "  unexpected first-party URL: $u" >&2; BAD=1 ;;
            esac
          done <<< "$FIRST_PARTY"
          if [ "$BAD" -ne 0 ]; then
            echo "first-party URLs other than the named endpoints are present" >&2
            exit 1
          fi
          echo "unique URL strings (reconcile with the README enumeration): $(grep -c . <<< "$ALL_URLS" || true)"

      # ── THE PACKAGED APP IS LAUNCHED, AND ITS WINDOW HAS TO RENDER ───────
      #
      # Every other job here is a build or a static read, so a panic that only
      # exists at runtime ships. 0.9.7 aborted on every platform on every launch
      # and passed a green five-job matrix; 0.13.7 opened its window and threw
      # on the FIRST render, which no liveness check can tell from a working
      # app. The verdict is therefore a captured frame with content in it — a
      # window with real geometry AND a band across it carrying distinct
      # colours and ink. `xwd -root`, because an app-window capture is black
      # here: the compositor draws elsewhere.
      - name: The packaged app opens a window that renders
        run: |
          set -euo pipefail
          # THE TOOLS FIRST, BY NAME. `xwd` captures the frame and `xwininfo` says the display is
          # up; `xwd` ships in x11-apps, not x11-utils, and without it every capture failed
          # `spawnSync xwd ENOENT` and the check reported the APP as not rendering. A missing tool
          # refuses here, with its name, before anything is started.
          for t in xwd xwininfo; do
            command -v "$t" > /dev/null || { echo "launch check: $t is not installed"; exit 1; }
          done
          # THE BUNDLE MAY NOT SHIP THE MACHINE'S OPENER. `engine.rs` looks for `xdg-open` at
          # /usr/bin and /usr/local/bin and then on PATH, and the AppImage launcher puts the
          # AppDir FIRST on PATH for everything it starts — so an `xdg-open` inside the bundle
          # would answer instead of the machine's. The bundle already ships `xdg-mime` for its
          # own use, which is how this hazard is known to be reachable rather than imagined.
          ./build/ohmail-linux-x86_64.AppImage --appimage-extract > /dev/null
          if [ -e squashfs-root/usr/bin/xdg-open ]; then
            echo "launch check: the bundle ships an xdg-open, which would answer for the machine's" >&2
            exit 1
          fi
          rm -rf squashfs-root
          Xvfb :99 -screen 0 1400x900x24 &
          XVFB=$!
          # Waited for, not slept on: a capture against a server that is not up
          # yet fails for a reason that is not the app.
          for _ in $(seq 30); do xwininfo -display :99 -root > /dev/null 2>&1 && break; sleep 1; done
          # `set +e` around it on purpose: under `set -e` a red check would exit
          # the step here and the two lines below — the status this step reports
          # — would never run at all.
          # AN AppImage SELF-MOUNTS THROUGH FUSE, and a runner image without
          # libfuse2 fails to start it at all — which would be a check that
          # refuses every correct release. The runtime's own extract-and-run
          # path needs no FUSE; measured identical here, same window, same
          # frame verdict.
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 DISPLAY=:99 \
            node scripts/verify-desktop-launch.mjs build/ohmail-linux-x86_64.AppImage \
            --out launch-check --timeout 120
          RC=$?
          set -e
          kill "$XVFB" 2>/dev/null || true
          exit "$RC"

      # ── WHAT THE APP COSTS, ON A MAILBOX BIG ENOUGH TO SHOW IT ──────────
      #
      # The check above proves the packaged app opens a window. It says
      # nothing about what the app COSTS, and a release that starts slowly or
      # holds a gigabyte of a laptop's memory is green all the way through
      # this file and slow on every machine it installs onto. A released build
      # did exactly that: an 8 GB machine, a large mailbox, 4.1 GB resident
      # and a core held at 93.7 % for 29 minutes, with nothing watching.
      #
      # So: ten thousand messages on a mail server in a container, the app
      # signed in against it, and its own numbers read back against budgets.
      # Every budget and the derivation behind it is in the header of
      # `scripts/perf-smoke-check.mjs`, which is also the verdict.
      #
      # Nothing here is a real account. The mailbox is generated in this step,
      # the server is thrown away with the runner, and the password is the one
      # the container's own configuration sets a few lines down.
      - name: Serve a ten-thousand-message mailbox
        env:
          PERF_FIXTURE_MESSAGES: "10000"
        run: |
          set -euo pipefail
          # THE TOOLS FIRST, BY NAME, before anything is started — the rule the
          # launch check above learned: a tool that is missing otherwise
          # arrives later wearing a product verdict's clothes.
          for t in docker node; do
            command -v "$t" > /dev/null || { echo "perf smoke: $t is not installed"; exit 1; }
          done
          mkdir -p perf-smoke/vmail/perf/Maildir/cur
          mkdir -p perf-smoke/vmail/perf/Maildir/new
          mkdir -p perf-smoke/vmail/perf/Maildir/tmp
          # Written as files rather than appended over IMAP: ten thousand
          # appends is a protocol conversation measured in minutes, and the
          # subject of this step is the app, not the seeding.
          node -e '
            const { writeFileSync } = require("node:fs");
            const dir = "perf-smoke/vmail/perf/Maildir/cur";
            const N = Number(process.env.PERF_FIXTURE_MESSAGES);
            for (let i = 0; i < N; i++) {
              const when = new Date(Date.UTC(2026, 0, 1 + (i % 300), i % 24, i % 60)).toUTCString();
              const body = ("Message " + i + " of the generated fixture. ").repeat(12);
              writeFileSync(dir + "/" + (1700000000 + i) + "." + i + ".fixture:2,S",
                "From: sender" + (i % 400) + "@example.invalid\r\n" +
                "To: perf@example.invalid\r\n" +
                "Subject: Generated fixture message " + i + "\r\n" +
                "Date: " + when + "\r\n" +
                "Message-Id: <" + i + ".fixture@example.invalid>\r\n" +
                "\r\n" + body + "\r\n");
            }
            console.log("wrote " + N + " messages");
          '
          # The container runs its mail process as uid 1000 and the runner is
          # not that user, so the fixture is opened to it. A throwaway tree on
          # a throwaway machine.
          chmod -R 0777 perf-smoke/vmail
          # Piped through `sed` because this block scalar's own indentation
          # would otherwise be part of every line of the file.
          sed 's/^          //' > perf-smoke/dovecot.conf <<'CONF'
          protocols = imap
          listen = *
          ssl = no
          disable_plaintext_auth = no
          auth_mechanisms = plain login
          log_path = /dev/stderr
          info_log_path = /dev/stderr
          # This server refuses uid 0 for a mail process regardless of
          # first_valid_uid, and it refuses AFTER a successful login — so the
          # symptom is a session that closes mid-read, not an auth error.
          first_valid_uid = 1000
          mail_uid = 1000
          mail_gid = 1000
          mail_location = maildir:/tmp/vmail/%u/Maildir
          passdb {
            driver = static
            args = password=fixture-password
          }
          userdb {
            driver = static
            args = uid=1000 gid=1000 home=/tmp/vmail/%u
          }
          namespace inbox {
            inbox = yes
            separator = /
          }
          CONF
          docker run -d --name ohmail-perf-imap \
            -p 127.0.0.1:11143:143 \
            -v "$PWD/perf-smoke/dovecot.conf:/etc/dovecot/dovecot.conf:ro" \
            -v "$PWD/perf-smoke/vmail:/tmp/vmail" \
            dovecot/dovecot:2.3.21
          # Waited for, not slept on: a login against a server that is not up
          # yet fails for a reason that is not the app.
          UP=0
          for _ in $(seq 60); do
            if node -e 'require("node:net").connect(11143,"127.0.0.1").on("connect",()=>process.exit(0)).on("error",()=>process.exit(1))'; then UP=1; break; fi
            sleep 1
          done
          [ "$UP" = "1" ] || { echo "perf smoke: the mail server never answered on 127.0.0.1:11143"; docker logs ohmail-perf-imap; exit 1; }

      - name: The packaged app's start and memory on that mailbox
        env:
          PERF_FIXTURE_MESSAGES: "10000"
          # Long enough for the import to finish and for the group to settle,
          # and long enough that the verdict's own floors — twelve samples over
          # a hundred seconds — cannot be met by a window too short to read.
          PERF_SMOKE_WINDOW_S: "420"
          # The fixture's own password, set by the container configuration in
          # the step above. The app takes a file for everything that is not a
          # secret and the password from here, which is also the path somebody
          # reproducing this run by hand takes.
          OHMAIL_IMAP_PASS: fixture-password
          # ── THIS IS OFF UNTIL A RUN HAS PRODUCED A VERDICT ───────────────
          # A verdict of RED — the app measurably over a budget — fails this
          # step whatever this is set to. A REFUSAL is a different answer: it
          # means the rig above produced no measurement at all, and until one
          # run on a real runner has shown that it does, a refusal here would
          # be this file failing every build for a reason that is not the app.
          # The first run that prints a verdict is the one that turns this to
          # "1", in a commit of its own. Still "0" on 2026-09-12: the rc3 build
          # ran this job WITHOUT these steps — unpublished at that commit — so no
          # runner has read the rig yet and there is nothing to move the pin on.
          PERF_SMOKE_REQUIRED: "0"
        run: |
          set -euo pipefail
          for t in Xvfb xwininfo docker node; do
            command -v "$t" > /dev/null || { echo "perf smoke: $t is not installed"; exit 1; }
          done
          # AND THE ARTIFACT, BY NAME, for the reason the tools are named: a
          # bundle that is not there starts nothing, and the check below then
          # refuses with "the app wrote no log" — the rig's failure wearing the
          # app's clothes, which is the one shape this step exists to avoid.
          [ -f build/ohmail-linux-x86_64.AppImage ] || { echo "perf smoke: no artifact at build/ohmail-linux-x86_64.AppImage"; exit 1; }
          HOME_DIR="$PWD/perf-smoke/home"
          APP_DATA="$HOME_DIR/.local/share/io.ohmail.desktop"
          mkdir -p "$APP_DATA"
          mkdir -p "$PWD/perf-smoke/run"
          chmod 700 "$PWD/perf-smoke/run"
          # WHICH DOOR, AND THE KEY THAT SEALS WHAT THE ENGINE STORES. The app
          # writes both itself when a person signs in; written here, the run
          # starts on a mailbox instead of on the first-run screen, and no
          # keychain is involved on a machine that has none. 127.0.0.1 is why
          # the server needs no certificate: the app's transport floor exempts
          # the loopback range and nothing else.
          printf '%s\n' '{"mode":"local","imap":{"host":"127.0.0.1","user":"perf","port":11143,"secure":false},"address":"perf@example.invalid"}' > "$APP_DATA/config.json"
          node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))' > "$APP_DATA/install-key"
          chmod 600 "$APP_DATA/install-key"

          # A DISPLAY OF ITS OWN, AND ASSERTED. :99 belongs to the launch check
          # above, which kills its server as its last line — a step boundary does
          # not wait for that, so a second server there either refuses to start or
          # hands this step a dying one. And the wait is asserted rather than
          # fallen through: with no display the app opens nothing and the verdict
          # would read "no log", naming the app for a rig cause.
          Xvfb :98 -screen 0 1400x900x24 &
          XVFB=$!
          X_UP=0
          for _ in $(seq 30); do xwininfo -display :98 -root > /dev/null 2>&1 && { X_UP=1; break; }; sleep 1; done
          [ "$X_UP" = "1" ] || { echo "perf smoke: no X display on :98 after 30s"; kill "$XVFB" 2>/dev/null || true; exit 1; }

          # `set +e` around the whole measurement on purpose: under `set -e` a
          # red would exit the step here and the verdict below — the thing this
          # step reports — would never be read at all.
          set +e
          # XDG_DATA_HOME PINNED rather than left to HOME's default: the app
          # resolves BOTH `config.json` and the log through it, so a runner that
          # sets it would put them where this step neither wrote nor reads — and
          # the verdict would once more be "no log" for a rig cause.
          APPIMAGE_EXTRACT_AND_RUN=1 DISPLAY=:98 HOME="$HOME_DIR" \
            XDG_DATA_HOME="$HOME_DIR/.local/share" \
            XDG_RUNTIME_DIR="$PWD/perf-smoke/run" \
            build/ohmail-linux-x86_64.AppImage &
          APP=$!
          # The sampler reads the app's own process tree from /proc and
          # classifies by ARGUMENTS: the kernel truncates a process name at
          # fifteen characters, so a list of the full WebKit spellings matches
          # none of them and reads a busy renderer as no renderer at all.
          node scripts/perf-smoke-check.mjs --sample --pid "$APP" \
            --out perf-smoke/samples.tsv --seconds "$PERF_SMOKE_WINDOW_S" --interval 5 &
          SAMPLER=$!
          LOG="$APP_DATA/logs/engine.log"
          # Waited for by the app's OWN report that the import finished, so the
          # figures below are a full mailbox's and not a half-imported one's.
          for _ in $(seq "$PERF_SMOKE_WINDOW_S"); do
            grep -a -q '"event":"first_sync_finished"' "$LOG" 2>/dev/null && break
            sleep 1
          done
          wait "$SAMPLER"
          node scripts/perf-smoke-check.mjs \
            --samples perf-smoke/samples.tsv \
            --engine-log "$LOG" \
            --bundle build/ohmail-linux-x86_64.AppImage \
            --expect-messages "$PERF_FIXTURE_MESSAGES" \
            --fixture-messages "$PERF_FIXTURE_MESSAGES" | tee perf-smoke/verdict.txt
          RC="${PIPESTATUS[0]}"
          set -e
          kill "$APP" 2>/dev/null || true
          kill "$XVFB" 2>/dev/null || true
          docker rm -f ohmail-perf-imap > /dev/null 2>&1 || true
          # THE SUMMARY SAYS WHAT THE CHECKER SAID, not what the step concluded.
          # A refusal forgiven by PERF_SMOKE_REQUIRED=0 gave the step a green tick
          # and a summary block nobody opens, so rc 3 — the 10k import not
          # finishing in 420 s on the runner — read as a pass for a whole
          # candidate. Forgiven is not the same as measured, and the heading is
          # where a reader looks first.
          case "$RC" in
            0) PERF_HEAD='the app on a ten-thousand-message mailbox — MEASURED, inside every budget' ;;
            1) PERF_HEAD='the app on a ten-thousand-message mailbox — OVER A BUDGET' ;;
            3) PERF_HEAD='the app on a ten-thousand-message mailbox — REFUSED: NO MEASUREMENT WAS TAKEN' ;;
            *) PERF_HEAD="the app on a ten-thousand-message mailbox — the checker exited $RC, which is not a verdict" ;;
          esac
          {
            echo "### $PERF_HEAD"
            echo
            if [ "$RC" = "3" ] && [ "$PERF_SMOKE_REQUIRED" != "1" ]; then
              echo '**This job is green and nothing was measured.** The refusal is forgiven by'
              echo '`PERF_SMOKE_REQUIRED=0` until one runner has shown the rig produces a verdict at all.'
              echo 'Read the lines below before treating this candidate as measured.'
              echo
            fi
            echo '```'
            cat perf-smoke/verdict.txt 2>/dev/null || echo 'the check produced no verdict'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # EVERY CODE THIS STEP ADMITS, NAMED — and everything else fails the job.
          # The three the checker means are 0, 1 and 3; the step used to `exit 0`
          # on all the rest, so a checker that died for a reason nobody had
          # thought about (a usage error, a missing file, a crash) finished the
          # job green and the build shipped with no measurement behind it.
          case "$RC" in
            0) ;;                       # a verdict, inside every budget
            1) exit 1 ;;                # a verdict, over a budget: always red
            3)                          # a refusal: the rig produced no measurement
              if [ "$PERF_SMOKE_REQUIRED" = "1" ]; then exit 1; fi
              echo "::warning title=perf smoke REFUSED::no measurement was taken; this step is green only because PERF_SMOKE_REQUIRED=0"
              echo "perf smoke: refused, and this file does not yet require a verdict — see PERF_SMOKE_REQUIRED"
              ;;
            *)
              echo "perf smoke: the checker exited $RC, which is not a code this step admits (0, 1, 3)."
              echo "  That is the checker failing to run, not the app passing — failing the job."
              exit 1
              ;;
          esac
          exit 0

      - name: Keep the perf smoke's own files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-smoke-linux-x86_64-${{ github.run_number }}
          path: |
            perf-smoke/samples.tsv
            perf-smoke/verdict.txt
          if-no-files-found: ignore

      - name: Keep the launch captures when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: launch-check-linux-x86_64-${{ github.run_number }}
          path: launch-check
          if-no-files-found: ignore

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: ohmail-appimage-${{ github.run_number }}
          path: build/ohmail-linux-x86_64.AppImage
          if-no-files-found: error

      - name: Upload the .deb
        uses: actions/upload-artifact@v7
        with:
          name: ohmail-deb-${{ github.run_number }}
          path: build/ohmail-linux-amd64.deb
          if-no-files-found: error

      # Uploaded as its own artifact rather than beside the .deb, because the
      # install drill below downloads THIS ONE and nothing else — a two-file
      # artifact would put a Debian package inside a Fedora container.
      - name: Upload the .rpm
        uses: actions/upload-artifact@v7
        with:
          name: ohmail-rpm-${{ github.run_number }}
          path: build/ohmail-linux-x86_64.rpm
          if-no-files-found: error

      - name: Run summary
        if: always()
        run: |
          {
            echo '### ohmail for Linux — unsigned build (engine-bearing)'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| toolchain | $(rustc --version) · node $(node --version) |"
            echo "| runner | $(. /etc/os-release; echo "$PRETTY_NAME") $(uname -m) |"
            for f in build/ohmail-linux-x86_64.AppImage build/ohmail-linux-amd64.deb \
                     build/ohmail-linux-x86_64.rpm; do
              [ -f "$f" ] || continue
              echo "| $(basename "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` · $(du -h "$f" | cut -f1) |"
            done
            echo
            echo 'Unsigned and without a repository: `chmod +x` the AppImage before running it.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # LINUX ON arm64 — the same job as the one above, on a different machine.
  #
  # ── WHY THIS IS A SECOND JOB AND NOT A MATRIX ─────────────────────────────
  #
  # A `strategy.matrix` over `runs-on` would express this in half the lines, and
  # it was refused. There is a check that reads THIS FILE as text and asserts,
  # per job, that the window bundle is built and smoked BEFORE the hour of native
  # compile — the arrangement whose absence once left that bundle unrendered for
  # two releases. It finds jobs by their `id:` and reads their steps literally,
  # so a job that reached the smoke through a matrix variable would be a job it
  # could no longer see. Two spelled-out jobs keep it able to see what it checks.
  # The duplication is the price, and it is smaller than the guard.
  #
  # ── WHY arm64 LINUX AT ALL ────────────────────────────────────────────────
  #
  # Not for Omarchy, which is x86_64-only. This is for the rest of arm64 Linux:
  # Raspberry Pi desktops, Apple silicon Macs running Linux under Asahi, arm64
  # workstations, and the arm64 servers people run a desktop session on. Until
  # this job existed those machines had no ohmail build at all — the x86_64
  # AppImage does not run on them, and there is no emulation layer in the way
  # macOS has one.
  #
  # ── WHAT IS NEW HERE, AND SO WHAT IS ACTUALLY BEING PROVEN ────────────────
  #
  # This job is the FIRST place the Rust half is compiled for aarch64. Nothing in
  # this project had ever built the shell for anything but x86_64 and Apple
  # silicon, so `cargo test` and `cargo test --features local-engine` below are
  # not a formality repeated from the job above: they are the first answer to
  # "does this program compile and pass its own tests on this architecture".
  # Read a red there as a finding, not as flake.
  #
  # The same is true of the vendored runtime. `vendor-node.mjs --platform
  # linux-arm64` fetches nodejs.org's own linux-arm64 build, and the checks that
  # RUN it — inside the script, again from the extracted AppImage, and again as
  # the engine's own interpreter below — execute an aarch64 binary on aarch64
  # hardware. That is the whole of the runtime claim, and it is only available
  # here: this project has no arm64 hardware anywhere else, no arm64 VM, and no
  # arm64 development machine. See the engine-start step near the end.
  # ==========================================================================

  linux-arm64:
    name: Linux arm64 · smoke · engine · appimage + deb + rpm
    # GitHub's hosted arm64 Linux runner, free for public repositories. It is a
    # NATIVE machine, not emulation: everything below compiles and runs as
    # aarch64, which is what makes the checks worth running here rather than
    # cross-building on the x86_64 runner and proving nothing about either.
    #
    # Pinned to the version rather than a floating label. There is no
    # `ubuntu-latest-arm`, and pinning is the right shape anyway — the two Linux
    # jobs should move between Ubuntu releases together and deliberately, not
    # because one of their labels was re-pointed.
    runs-on: ubuntu-24.04-arm
    # 90 rather than the 60 the other jobs use, and it is not padding. Every other
    # job in this file has a measured history — the whole workflow has been
    # finishing in about fifteen minutes — and this one has none: it is the first
    # aarch64 compile of the Rust half, from a cold cargo cache, on a machine class
    # nothing here has run on. A timeout would kill it at the point where the
    # measurement was about to exist, and the cost of guessing high is nothing.
    # Once a few runs have been seen, bring it down to whatever they actually take.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The same list as the x86_64 job. Every one of these has an arm64 build in
      # Ubuntu's own archive, so nothing here is architecture-conditional — which
      # is worth stating, because a `[ "$(uname -m)" = … ]` in a prerequisite
      # list is how two jobs that should be identical stop being identical.
      - name: Install the Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            build-essential curl wget file patchelf desktop-file-utils \
            xdg-utils rpm cpio \
            xvfb x11-utils x11-apps

      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
          # No `rustup target add`: the host triple IS aarch64-unknown-linux-gnu
          # here, and a native build wants nothing else. (macOS adds two targets
          # because its artifact is universal; this one is not.)
          rustc --version
          # The host triple, printed so a run's own log says which architecture
          # the cargo gate below actually compiled for. `-vV` has carried `host:`
          # since long before any rustc this runner will serve.
          rustc -vV
          node --version
          uname -m

      # `npm ci` and not `npm install`: apps/desktop carries its own committed
      # package-lock.json, so every builder resolves the tree this app was
      # tested against rather than whatever its ranges resolve to today — and a
      # build with no network can resolve it at all. `npm install` would
      # quietly rewrite a lock that had drifted from the manifest; `npm ci`
      # refuses it.
      - name: Install the desktop tree from its lockfile
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: tsc --noEmit
        working-directory: apps/desktop
        run: npm run ui:typecheck

      # Fail-fast render check over the WINDOW bundle — offline audit included;
      # app:build:engine rebuilds, scans and smokes it again beside the artifact.
      - name: Build the window bundle
        working-directory: apps/desktop
        run: npm run ui:build:engine

      - name: Smoke the window bundle
        working-directory: apps/desktop
        run: npm run smoke

      # THE GATE THIS JOB EXISTS FOR — see the banner. First aarch64 compile of
      # the shell, both feature configurations, and the tests that come with it.
      - name: cargo test (both configurations)
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          cargo test --locked
          cargo test --locked --features local-engine

      - name: Install the locked dependency tree
        run: npm ci --no-audit --no-fund

      # The bundler is a pinned devDependency of the root manifest, so the
      # `npm ci` above is the whole resolution and this step reaches no network.
      # engine-bundle.mjs asserts the version it got: the bundle is only
      # reproducible for a fixed esbuild, so a different one is refused, not used.
      - name: Build the engine bundle
        run: node scripts/engine-bundle.mjs

      - name: The engine boots from the shipped layout, and only from it
        run: node scripts/verify-engine-boot.mjs

      - uses: actions/cache@v4
        with:
          path: build/vendor
          # A DIFFERENT KEY FROM THE x86_64 JOB, and this is the one line in this
          # file where getting it wrong is silent. Both jobs write the runtime to
          # `build/vendor/node`, so a shared key would let whichever job ran first
          # serve its runtime to the other — an x86_64 Node inside the arm64 app,
          # or the reverse. The download and its checksum would never run, so the
          # only thing standing between that and a shipped artifact is the
          # `--version` execution further down, which would fail as "the vendored
          # runtime would not run on this machine" and name nothing about caches.
          key: vendor-node-linux-arm64-v22.23.2

      - name: Vendor the Node runtime
        run: node scripts/vendor-node.mjs --platform linux-arm64

      # The same pin as the x86_64 job, and it matters more here: the plugin the
      # bundler would otherwise download writes the x86_64 library triple into
      # the launcher literally, so the arm64 build shipped a GTK module path no
      # arm64 machine has. See the x86_64 job for the whole argument.
      - name: Pin the AppImage's GTK plugin to this repository's copy
        run: |
          set -euo pipefail
          TOOLS="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TOOLS"
          install -m 0755 apps/desktop/src-tauri/linux/linuxdeploy-plugin-gtk.sh \
            "$TOOLS/linuxdeploy-plugin-gtk.sh"
          ls -la "$TOOLS/linuxdeploy-plugin-gtk.sh"

      # The bundle is smoked inside this script, on this platform, before the app
      # is packaged — see the header.
      - name: Build the engine-bearing app, smoking its bundle
        # NO_STRIP for the same reason as the x86_64 job: linuxdeploy strips the
        # binary again while assembling the AppImage and that step is a known
        # failure on recent glibc. The Rust release profile already strips.
        env:
          NO_STRIP: "true"
        working-directory: apps/desktop
        run: npm run app:build:engine -- --bundles appimage,deb,rpm -- -- --locked

      - name: Name the artifacts what the download page links
        run: |
          set -euo pipefail
          B=apps/desktop/src-tauri/target/release/bundle
          ls -la "$B/appimage" "$B/deb" "$B/rpm"
          APPIMAGE="$(ls "$B"/appimage/*.AppImage | head -1)"
          DEB="$(ls "$B"/deb/*.deb | head -1)"
          RPM="$(ls "$B"/rpm/*.rpm | head -1)"
          test -s "$APPIMAGE"
          test -s "$DEB"
          test -s "$RPM"
          mkdir -p build
          # Renamed in place, never copied — see the Windows job. The bundler's
          # own names already carry the architecture (`…_arm64.deb`,
          # `…_aarch64.AppImage`, `…-1.aarch64.rpm`), so the globs above match one
          # file each; the stable names below are what the release attaches and
          # what the update feed points at.
          mv "$APPIMAGE" build/ohmail-linux-aarch64.AppImage
          mv "$DEB" build/ohmail-linux-arm64.deb
          mv "$RPM" build/ohmail-linux-aarch64.rpm
          chmod +x build/ohmail-linux-aarch64.AppImage
          ls -la build/ohmail-linux-aarch64.AppImage build/ohmail-linux-arm64.deb \
            build/ohmail-linux-aarch64.rpm

      - name: Inspect what was produced
        run: |
          set -euo pipefail
          DEB=build/ohmail-linux-arm64.deb
          APPIMAGE=build/ohmail-linux-aarch64.AppImage
          RPM=build/ohmail-linux-aarch64.rpm

          echo "--- .deb control ---"
          dpkg-deb -I "$DEB"
          # Read the listing ONCE, into a variable, and match against that — never
          # `dpkg-deb -c "$DEB" | grep -q …`, which SIGPIPEs the tar behind
          # dpkg-deb and turns a passing assertion into a failed step. The x86_64
          # job's comment argues it in full.
          CONTENTS="$(dpkg-deb -c "$DEB")"
          echo "--- .deb contents ---"
          printf '%s\n' "$CONTENTS"
          grep -qE ' usr/bin/ohmail$' <<< "$CONTENTS"
          grep -qiE ' usr/share/applications/.+\.desktop$' <<< "$CONTENTS"
          grep -qiE ' usr/share/icons/hicolor/128x128/apps/.+\.png$' <<< "$CONTENTS"
          # The engine and its runtime are inside the package, at the paths
          # `engine.rs` composes from `resource_dir()`.
          grep -qE ' usr/lib/ohmail/engine/bin/ohmail-engine\.mjs$' <<< "$CONTENTS"
          grep -qE ' usr/lib/ohmail/engine/drizzle/' <<< "$CONTENTS"
          grep -qE ' usr/lib/ohmail/runtime/node$' <<< "$CONTENTS"
          # …and the runtime kept its execute bit through the repackaging.
          NODE_ROW="$(grep -E ' usr/lib/ohmail/runtime/node$' <<< "$CONTENTS")"
          echo "node row: $NODE_ROW"
          case "$NODE_ROW" in
            -rwxr-xr-x*) : ;;
            *) echo "the vendored runtime is not executable inside the .deb" >&2; exit 1 ;;
          esac
          test "$(dpkg-deb -f "$DEB" Package)" = "ohmail"
          # THE ARCHITECTURE, asserted because the two Linux jobs are otherwise
          # identical and a misconfigured `runs-on` would produce a complete,
          # working x86_64 artifact under an arm64 name with every other check in
          # this step green. See the same assertion in the x86_64 job.
          test "$(dpkg-deb -f "$DEB" Architecture)" = "arm64"

          # The same desktop-entry assertion as the x86_64 job, which argues it. Repeated rather
          # than shared because it is an audit of a different artifact.
          # The member is named EXACTLY, and there must be exactly one of it. A wildcard like
          # `*/applications/ohmail.desktop` matches any member with that ending, so a resource or
          # fixture at some other path would answer for the installed entry — and tar concatenates
          # every match, which would let the Exec line and the MimeType line come from two
          # different files. The leading `./` is matched optionally rather than assumed: this
          # bundler writes the members WITHOUT it, and pinning the spelling to one form is how a
          # check like this quietly stops matching anything.
          DEB_MEMBERS="$(dpkg-deb --fsys-tarfile "$DEB" | tar -t)"
          ENTRY_MEMBER="$(printf '%s\n' "$DEB_MEMBERS" | grep -E '^(\./)?usr/share/applications/ohmail\.desktop$' || true)"
          ENTRY_COUNT="$(printf '%s\n' "$ENTRY_MEMBER" | grep -c . || true)"
          if [ "$ENTRY_COUNT" != 1 ]; then
            echo "the .deb holds $ENTRY_COUNT desktop entries at usr/share/applications/ohmail.desktop" >&2
            exit 1
          fi
          DEB_ENTRY="$(dpkg-deb --fsys-tarfile "$DEB" | tar -xO "$ENTRY_MEMBER")"
          printf '%s\n' "$DEB_ENTRY"
          printf '%s\n' "$DEB_ENTRY" | grep -qx 'Exec=ohmail %U' || {
            echo "the .deb's desktop entry does not hand the URL to the app" >&2; exit 1; }
          printf '%s\n' "$DEB_ENTRY" | grep -q '^MimeType=.*x-scheme-handler/mailto' || {
            echo "the .deb's desktop entry no longer claims mailto" >&2; exit 1; }

          # ══ THE .rpm CARRIES THE SAME TREE ════════════════════════════════
          # The x86_64 job's block carries the argument for why the .rpm is
          # opened on its own rather than inferred from the .deb beside it, and
          # for why every listing is read into a variable first.
          echo "--- .rpm metadata ---"
          rpm -qpi "$RPM"
          # WHAT THE PACKAGE MANAGER WILL DEMAND OF THE MACHINE, PRINTED. The
          # config declares no dependencies — the mail engine and its Node
          # runtime are inside the artifact and the webview stack is the
          # machine's, the same posture as the .deb — so this is a record of what
          # the bundler adds on its own, and the one place a reader can see it
          # change between releases.
          echo "--- .rpm requires ---"
          rpm -qp --requires "$RPM"
          RPM_FILES="$(rpm -qpl "$RPM")"
          echo "--- .rpm contents ---"
          printf '%s\n' "$RPM_FILES"
          # rpm lists absolute paths, so these anchor on the leading slash where
          # the .deb's anchor on the space that ends dpkg's columns.
          grep -qx '/usr/bin/ohmail' <<< "$RPM_FILES"
          grep -qx '/usr/share/applications/ohmail.desktop' <<< "$RPM_FILES"
          grep -qE '^/usr/share/icons/hicolor/128x128/apps/.+\.png$' <<< "$RPM_FILES"
          grep -qx '/usr/lib/ohmail/engine/bin/ohmail-engine.mjs' <<< "$RPM_FILES"
          grep -qE '^/usr/lib/ohmail/engine/drizzle/' <<< "$RPM_FILES"
          grep -qx '/usr/lib/ohmail/runtime/node' <<< "$RPM_FILES"
          # AND THE RUNTIME KEPT ITS EXECUTE BIT. The same property as the
          # .deb's, matched the same way — against the permission string, not a
          # numeric mode: `:perms` is rpm's own renderer for it, and it prints
          # what `ls -l` prints, which is what the .deb check above compares.
          # Same shape, same words, so the two are read together. A runtime that
          # lost its mode is reported to the person as a build with no Node in
          # it, which reads as a broken install rather than as a broken package.
          NODE_ROW="$(rpm -qp --qf '[%{FILEMODES:perms} %{FILENAMES}\n]' "$RPM" \
            | awk '$2 == "/usr/lib/ohmail/runtime/node"')"
          echo "node row: $NODE_ROW"
          # An EMPTY row is its own arm, and it has to be: the two states are
          # "rpm answered and the mode is wrong" and "the query returned
          # nothing", and one message for both would report a mistyped format
          # string as a lost execute bit. The file list above already asserted
          # the member is in the package, so nothing here can be empty for an
          # innocent reason.
          if [ -z "$NODE_ROW" ]; then
            echo "the .rpm mode query named no file — read the format string, not the package" >&2
            exit 1
          fi
          case "$NODE_ROW" in
            -rwxr-xr-x*) : ;;
            *) echo "the vendored runtime is not executable inside the .rpm: $NODE_ROW" >&2; exit 1 ;;
          esac
          # The package name is the one word this project spells everywhere —
          # `dnf remove ohmail` works, and it matches /usr/bin/ohmail, the .deb
          # and the AppImage.
          # Each reading is PRINTED and refused BY NAME. The 0.16.0 build died here silently: a bare `test`
          # and an unread pipeline exit both leave a step with "exit code 1" and nothing before it.
          NAME_READ="$(rpm -qp --qf '%{NAME}' "$RPM")"; echo "rpm name: $NAME_READ"
          [ "$NAME_READ" = "ohmail" ] || { echo "the .rpm is named '$NAME_READ', not ohmail" >&2; exit 1; }
          # ── THE ARCHITECTURE THE FILENAME CLAIMS ──────────────────────────
          # The same assertion the .deb makes, and it is the reason the .rpm is
          # worth querying at all: a misconfigured `runs-on` produces a complete,
          # working package under the other architecture's name and every check
          # above this line passes. rpm names the architecture itself. Note the
          # spelling is the MACHINE's (`aarch64`), not Debian's — see the
          # artifact-name contract in the header.
          ARCH_READ="$(rpm -qp --qf '%{ARCH}' "$RPM")"; echo "rpm arch: $ARCH_READ"
          [ "$ARCH_READ" = "aarch64" ] || { echo "the .rpm architecture is '$ARCH_READ', not aarch64" >&2; exit 1; }
          # THE .rpm INSTALLS THE SAME DESKTOP ENTRY. It is configured from the
          # same template as the .deb's (bundle.linux.rpm.desktopTemplate), and
          # that identity is asserted in the tree by `desktop-linux-recipe.test.ts`
          # — but a template both sections name is a fact about the config, not a
          # check on the artifact, and the entry's `mailto:` claim is false for
          # everyone who installs this package if the field code is missing.
          # Extracted with rpm2cpio into a variable; `--to-stdout` writes the one
          # member named.
          # The payload's member names may or may not carry a leading `./` — that depends on the writer, not
          # on the package — so the entry is found by SUFFIX in the listing, and an empty listing or a
          # failed extraction prints cpio's own words instead of exiting in silence.
          # The rpm2cpio | cpio pipeline exits NON-ZERO on this runner while printing a complete listing and
          # no error (measured on the 0.16.0 rebuild: 355 members, the entry among them, exit 1). The
          # assertion is about the ARTIFACT's content, so the content decides and the two exit statuses are
          # printed for the record rather than allowed to end the step in silence.
          LISTING="$(mktemp)"
          set +e +o pipefail
          rpm2cpio "$RPM" | cpio -it --quiet > "$LISTING" 2>&1; LIST_STATUS="${PIPESTATUS[*]}"
          set -e -o pipefail
          MEMBERS="$(cat "$LISTING")"
          echo "payload listing: $(grep -c . "$LISTING") line(s); rpm2cpio/cpio exit statuses: $LIST_STATUS"
          ENTRY_MEMBER="$(grep -E '(^|/)usr/share/applications/ohmail\.desktop$' <<< "$MEMBERS" | head -n 1 || true)"
          echo "desktop entry member: ${ENTRY_MEMBER:-<none>}"
          [ -n "$ENTRY_MEMBER" ] || { echo "the .rpm payload lists no usr/share/applications/ohmail.desktop member" >&2; exit 1; }
          ENTRY_OUT="$(mktemp)"
          set +e +o pipefail
          rpm2cpio "$RPM" | cpio -i --quiet --to-stdout "$ENTRY_MEMBER" > "$ENTRY_OUT" 2>&1; EXTRACT_STATUS="${PIPESTATUS[*]}"
          set -e -o pipefail
          RPM_ENTRY="$(cat "$ENTRY_OUT")"
          echo "desktop entry extracted: $(grep -c . "$ENTRY_OUT") line(s); rpm2cpio/cpio exit statuses: $EXTRACT_STATUS"
          [ -n "$RPM_ENTRY" ] || { echo "the .rpm desktop entry extracted EMPTY (statuses $EXTRACT_STATUS)" >&2; exit 1; }
          printf '%s\n' "$RPM_ENTRY"
          printf '%s\n' "$RPM_ENTRY" | grep -qx 'Exec=ohmail %U' || {
            echo "the .rpm's desktop entry does not hand the URL to the app" >&2; exit 1; }
          printf '%s\n' "$RPM_ENTRY" | grep -q '^MimeType=.*x-scheme-handler/mailto' || {
            echo "the .rpm's desktop entry no longer claims mailto" >&2; exit 1; }
          printf '%s\n' "$RPM_ENTRY" | grep -qx 'StartupWMClass=ohmail' || {
            echo "the .rpm's desktop entry cannot be matched to the window" >&2; exit 1; }

          # ── The AppImage carries the same tree ────────────────────────────
          rm -rf squashfs-root
          ./"$APPIMAGE" --appimage-extract > /dev/null
          test -f squashfs-root/usr/lib/ohmail/engine/bin/ohmail-engine.mjs
          test -d squashfs-root/usr/lib/ohmail/engine/drizzle
          test -x squashfs-root/usr/lib/ohmail/runtime/node
          # IT RUNS — an aarch64 Node executed on aarch64 hardware. On the x86_64
          # job this line reads as routine; here it is the first execution of an
          # arm64 runtime this project has ever performed.
          squashfs-root/usr/lib/ohmail/runtime/node --version

          # ── THE LAUNCHER, READ OUT OF THE ARTIFACT ────────────────────────
          #
          # The same four assertions as the x86_64 job, which argues each of
          # them. Repeated rather than shared because they are an audit of a
          # DIFFERENT artifact — assertion 3 in particular exists because this
          # build, and only this build, was carrying the other architecture's
          # library directory.
          TRIPLE=aarch64-linux-gnu
          EXPECT_MACHINE="AArch64"
          HOOK=squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
          test -f "$HOOK"
          cat "$HOOK"

          SHADOWED="$(find squashfs-root -name 'libwayland-client.so*' -print)"
          if [ -n "$SHADOWED" ]; then
            echo "the AppImage bundles a library the host must provide:" >&2
            printf '%s\n' "$SHADOWED" >&2
            exit 1
          fi

          # Asserted by RUNNING the launcher's environment, not by matching text in it. A grep for
          # `^export GDK_BACKEND=` is blind to the same assignment indented, wrapped in a
          # conditional, or spelled as a bare assignment exported later — all valid shell, all
          # still forcing the backend.
          #
          # The probe reports the sourcing STATUS as well as the value, because they are different
          # questions and only one of them was being asked: with the status discarded, a hook with
          # a syntax error sources to nothing, the `printf` after it still runs, and "could not
          # execute the hook" arrives looking exactly like "the hook left the variable alone".
          #
          # `set +eu` inside the subshell, and APPDIR exported as its own statement rather than as
          # an assignment prefix on `.`. Both are load-bearing: the hook reads `$XDG_DATA_DIRS`,
          # which `-u` turns into a fatal error where it happens to be unset, and the prefix form
          # left the subshell dying before it could print — which under `set -e` outside took the
          # whole step down with an empty message. Found by running it.
          probe_backend() {
            (
              set +eu
              unset GDK_BACKEND OHMAIL_SYSTEM_WEBKIT
              if [ -n "$1" ]; then export GDK_BACKEND="$1"; fi
              export APPDIR="$PWD/squashfs-root"
              . "$HOOK" >/dev/null 2>&1
              rc=$?
              printf '%s|%s' "$rc" "${GDK_BACKEND-<unset>}"
            )
          }
          # BOTH DIRECTIONS. Probing only the unset case passes a hook that forces x11 exactly
          # when the caller HAS chosen — which is the case the whole fix is about, and which the
          # comment above this check used to claim was covered when it was not.
          for want in "<unset>" wayland; do
            case "$want" in
              "<unset>") got="$(probe_backend "")"      ; how="with no backend chosen" ;;
              *)         got="$(probe_backend "$want")" ; how="with GDK_BACKEND=$want chosen" ;;
            esac
            rc="${got%%|*}"; val="${got#*|}"
            echo "launcher hook $how: status $rc, GDK_BACKEND=$val"
            if [ "$rc" != 0 ]; then
              echo "the launcher hook could not be sourced (status '$rc') — this check proved nothing" >&2
              exit 1
            fi
            if [ "$val" != "$want" ]; then
              echo "the launcher decides the display backend $how: expected $want, got $val" >&2
              exit 1
            fi
          done

          TRIPLES="$(grep -aoE '[a-z0-9_]+-linux-gnu' "$HOOK" | sort -u || true)"
          echo "library triples named by the launcher: $TRIPLES"
          FOREIGN="$(printf '%s\n' "$TRIPLES" | grep -v "^$TRIPLE$" | grep -v '^$' || true)"
          if [ -n "$FOREIGN" ]; then
            echo "the launcher names another architecture's directories: $FOREIGN" >&2
            exit 1
          fi
          # AND the system fallback is read out of GTK_PATH's own VALUE. Two earlier drafts of this
          # correlated independent greps — "a GTK_PATH line exists" and "the right triple appears
          # somewhere in the hook" — and both pass a GTK_PATH that has lost everything except its
          # AppDir component, because the AppDir component contains the triple too and four other
          # exports spell one as well. The value is what the launcher gives GTK, so the value is
          # what gets asserted: at least one entry that is NOT under the AppDir and IS this
          # architecture's module directory.
          # GTK_PATH is unset before sourcing for the same reason GDK_BACKEND is: a runner that
          # happens to export one would satisfy every test below without the artifact setting it
          # at all — the value would be the RUNNER's, and a hook that had lost the line entirely
          # would pass.
          GTKPATH="$(
            set +eu
            unset OHMAIL_SYSTEM_WEBKIT GTK_PATH
            export APPDIR="$PWD/squashfs-root"
            . "$HOOK" >/dev/null 2>&1
            rc=$?
            printf '%s|%s' "$rc" "${GTK_PATH-<unset>}"
          )"
          gtk_rc="${GTKPATH%%|*}"; gtk_val="${GTKPATH#*|}"
          echo "GTK_PATH the launcher produces: $gtk_val"
          if [ "$gtk_rc" != 0 ]; then
            echo "the launcher hook could not be sourced (status '$gtk_rc') — this check proved nothing" >&2
            exit 1
          fi
          if [ "$gtk_val" = "<unset>" ]; then
            echo "the launcher sets no GTK_PATH" >&2
            exit 1
          fi
          SYS_ENTRY=""
          while IFS= read -r part; do
            [ -n "$part" ] || continue
            case "$part" in "$PWD/squashfs-root"*) continue ;; esac
            case "$part" in *"$TRIPLE"/gtk-3.0) SYS_ENTRY="$part" ;; esac
          done <<< "$(printf '%s' "$gtk_val" | tr ':' '\n')"
          if [ -z "$SYS_ENTRY" ]; then
            echo "GTK_PATH names no $TRIPLE system fallback outside the AppDir: $gtk_val" >&2
            exit 1
          fi
          echo "GTK_PATH's system fallback: $SYS_ENTRY"

          # The BRANCH, not the token. The hook explains itself in comments that also spell
          # OHMAIL_SYSTEM_WEBKIT, so a check for the name alone stays green after the `if`/`exec`
          # is deleted and only the prose survives. Both halves are asserted, because the exec
          # without LD_LIBRARY_PATH escapes nothing: the binary carries
          # DT_RUNPATH=$ORIGIN/../lib and would resolve the bundled stack anyway.
          grep -aqE '^if \[ -n "\$OHMAIL_SYSTEM_WEBKIT" \]; then$' "$HOOK" || {
            echo "the launcher has no OHMAIL_SYSTEM_WEBKIT branch" >&2; exit 1; }
          grep -aqE '^ *LD_LIBRARY_PATH="\$_ohmail_sys" exec "\$APPDIR/usr/bin/ohmail" "\$@"$' "$HOOK" || {
            echo "the escape branch does not override the binary's RUNPATH" >&2; exit 1; }
          # And it has to come FIRST: anything exported above it is already in the environment of
          # the process it execs, which is the whole thing the escape is trying not to inherit.
          ESCAPE_LINE="$(grep -an '^if \[ -n "\$OHMAIL_SYSTEM_WEBKIT" \]; then$' "$HOOK" | cut -d: -f1)"
          FIRST_EXPORT="$(grep -an '^export GTK_DATA_PREFIX=' "$HOOK" | cut -d: -f1)"
          if [ -z "$FIRST_EXPORT" ] || [ "$ESCAPE_LINE" -ge "$FIRST_EXPORT" ]; then
            echo "the escape branch is not ahead of the AppDir exports (escape $ESCAPE_LINE, exports $FIRST_EXPORT)" >&2
            exit 1
          fi

          ENTRY=squashfs-root/usr/share/applications/ohmail.desktop
          test -f "$ENTRY"
          cat "$ENTRY"
          grep -aqx 'Exec=ohmail %U' "$ENTRY" || {
            echo "the desktop entry does not hand the URL to the app" >&2; exit 1; }
          grep -aq '^MimeType=.*x-scheme-handler/mailto' "$ENTRY" || {
            echo "the desktop entry no longer claims mailto" >&2; exit 1; }
          grep -aqx 'StartupWMClass=ohmail' "$ENTRY" || {
            echo "the desktop entry cannot be matched to the window" >&2; exit 1; }

          # EVERY regular file under usr/ is a candidate, not only the ones named *.so*. Scanning by
          # name misses the four that matter most: usr/bin/ohmail, the vendored runtime/node, and
          # WebKitNetworkProcess and WebKitWebProcess — the last being the very process whose
          # architecture this release is about.
          #
          # The file list is captured by a command whose status is checked. Inside a process
          # substitution `find` reports to nobody: a traversal that dies part-way leaves the loop
          # exiting zero over however many files it happened to get, and `set -euo pipefail` never
          # sees it.
          FILES="$(find squashfs-root/usr -type f)"
          # ELF-ness is decided by the file's own magic, not by whether readelf succeeded. Reading
          # it from readelf's exit status makes a CORRUPT shared object indistinguishable from a
          # PNG — both produce no machine, and the loop would skip the one it exists to catch.
          WRONG=""
          CHECKED=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            magic="$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')"
            if [ "$magic" != "7f454c46" ]; then continue; fi
            CHECKED=$((CHECKED + 1))
            m="$(readelf -h "$f" 2>/dev/null | sed -n 's/^ *Machine: *//p' || true)"
            if [ -z "$m" ]; then
              WRONG="$WRONG  $f (an ELF file readelf cannot parse)"$'\n'
            elif [ "$m" != "$EXPECT_MACHINE" ]; then
              WRONG="$WRONG  $f ($m)"$'\n'
            fi
          done <<< "$FILES"
          if [ -n "$WRONG" ]; then
            echo "files that are not this job's architecture:" >&2
            printf '%s' "$WRONG" >&2
            exit 1
          fi
          # A floor, because "nothing was wrong" and "nothing was looked at" print the same way.
          # The released artifacts carry about 170; 100 is well under that and well over zero.
          if [ "$CHECKED" -lt 100 ]; then
            echo "only $CHECKED ELF files found under usr/ — the scan found almost nothing" >&2
            exit 1
          fi
          echo "all $CHECKED ELF files under usr/ are $EXPECT_MACHINE"

          rm -rf squashfs-root

          BIN=apps/desktop/src-tauri/target/release/ohmail
          test -s "$BIN"
          ELF_MACHINE="$(readelf -h "$BIN" | sed -n 's/^ *Machine: *//p')"
          echo "ELF machine: $ELF_MACHINE"
          test "$ELF_MACHINE" = "AArch64"
          grep -aq "connect-src 'none'" "$BIN"
          echo "URLs in the binary:"
          ALL_URLS="$(grep -aoE 'https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+' "$BIN" | sort -u)"
          printf '%s\n' "$ALL_URLS"
          # Identical rule to the other two jobs — the update feed by prefix, the
          # Cloud API by equality, the browser link table page by page, and the
          # scheme split that keeps adjacent Rust literals from being judged as
          # one address; the Windows job argues every clause of it.
          #
          # It is repeated rather than shared BECAUSE it is an audit of a
          # different binary. The compiler is free to lay out read-only data
          # differently for a different architecture, so an arm64 build that
          # reached an address the x86_64 build does not is a thing this list has
          # to be able to catch on its own.
          FEED_PREFIX='https://github.com/trafficflowhq/ohmail/releases/latest/download/latest.json'
          CLOUD_URL='https://api.ohmail.app'
          SPLIT_URLS="$(printf '%s\n' "$ALL_URLS" \
            | awk '{ gsub(/https?:\/\//, "\n&"); print }' | grep -E '^https?://' || true)"
          FIRST_PARTY="$(awk '{ h = $0; sub(/^https?:\/\//, "", h); sub(/[\/?#].*$/, "", h)
            if (tolower(h) ~ /ohmail|mailoh|trafficflow/ || $0 ~ /^https:\/\/github\.com\/trafficflowhq\//) print }' \
            <<< "$SPLIT_URLS" | sort -u || true)"
          if [ -z "$FIRST_PARTY" ]; then
            echo "the pinned update feed URL is missing from the binary" >&2
            exit 1
          fi
          BAD=0
          while IFS= read -r u; do
            [ -z "$u" ] && continue
            case "$u" in
              "$FEED_PREFIX"*) : ;;
              # PREFIX, for the reason the comment above gives for the browser link
              # table: these are Rust string literals with no terminator sitting next
              # to each other in read-only data, so what comes back is whatever
              # follows glued on. This was the one entry still matching exactly, and
              # it held only while nothing happened to sit beside it — the first
              # release build of 0.13.3 failed on
              # `https://api.ohmail.appcloud-tokens.sealthe`, which is this URL with
              # two unrelated literals stuck to its end. The re-split on the scheme
              # above is what makes a prefix answer for exactly one address.
              "$CLOUD_URL"*) : ;;
              # The self-hosted door's PLACEHOLDER, not an endpoint. `example.com` is
              # reserved by IANA precisely so it can never resolve to anyone, and this
              # is the greyed-out example in the address field plus the same example
              # in the sentence under it. It is caught here only because it contains
              # the product name, which is what makes it a good placeholder.
              'https://ohmail.example.com'*) : ;;
              'https://ohmail.app/mailbox#/settings'*) : ;;
              'https://ohmail.app/mailbox?settings=mailboxes#/settings'*) : ;;
              'https://ohmail.app/mailbox?settings=devices#/settings'*) : ;;
              'https://ohmail.app/link-desktop'*) : ;;
              'https://ohmail.app/privacy'*) : ;;
              'https://ohmail.app/subprocessors'*) : ;;
              *) echo "  unexpected first-party URL: $u" >&2; BAD=1 ;;
            esac
          done <<< "$FIRST_PARTY"
          if [ "$BAD" -ne 0 ]; then
            echo "first-party URLs other than the named endpoints are present" >&2
            exit 1
          fi
          echo "unique URL strings (reconcile with the README enumeration): $(grep -c . <<< "$ALL_URLS" || true)"

      # ── THE PACKAGED ENGINE, STARTED, ON THIS ARCHITECTURE ────────────────
      #
      # This step is on the arm64 job and NOT on the x86_64 one, which is a
      # deliberate asymmetry and needs its reason written down or it will be
      # "tidied" into symmetry by someone who is right to ask.
      #
      # The reason is that CI is the ONLY place an arm64 ohmail ever runs. Every
      # other platform this project ships gets started by a person somewhere
      # before a release goes out — someone installs the .exe, the .deb, the
      # .dmg, and opens the window. There is no arm64 machine in this project at
      # all: no hardware, no emulator. So for arm64, and only for arm64,
      # "nothing here ever starts the packaged app" — the KNOWN GAP this file's
      # header names — has no compensating human step behind it.
      #
      # What it proves and what it does not: the vendored aarch64 runtime can
      # execute the aarch64-independent engine bundle from the layout the package
      # ships, with a PATH that has no node on it, and reach `serving`. It does
      # NOT open a window, so a fault that only exists once WebKitGTK creates a
      # real surface is as invisible here as everywhere else in this file.
      #
      # It is modelled on the macOS job's step of the same name, including
      # capturing the process status directly rather than through a pipe.
      #
      # The x86_64 job should gain this too. It is not being added there in the
      # same change because that job is on the critical path of every release and
      # a step nobody has watched succeed does not belong in front of one.
      - name: The packaged engine starts on aarch64, with no node on PATH
        run: |
          set -euo pipefail
          rm -rf squashfs-root
          ./build/ohmail-linux-aarch64.AppImage --appimage-extract > /dev/null
          RES=squashfs-root/usr/lib/ohmail
          D="$(mktemp -d)"
          set +e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" \
            OHMAIL_KEK="$(printf 'a%.0s' $(seq 64))" \
            OHMAIL_IMAP_HOST=127.0.0.1 OHMAIL_IMAP_PORT=59999 \
            OHMAIL_IMAP_USER=boot@local OHMAIL_MAILBOX_ADDRESS=boot@local \
            OHMAIL_IMAP_SECURE=0 OHMAIL_DATA_DIR="$D" \
            "$RES/runtime/node" "$RES/engine/bin/ohmail-engine.mjs" > "$D/out" 2> "$D/err" &
          ENGINE_PID=$!
          set -e
          # It serves and then waits on stdin. Read what it said, then stop it.
          for _ in $(seq 60); do grep -q '"event":"serving"' "$D/err" && break; sleep 0.5; done
          SERVED="$(grep -c '"event":"serving"' "$D/err" || true)"
          kill "$ENGINE_PID" 2>/dev/null || true
          wait "$ENGINE_PID" 2>/dev/null || true
          echo "--- engine stderr (last 20) ---"; tail -20 "$D/err"
          rm -rf squashfs-root
          if [ "$SERVED" -lt 1 ]; then
            echo "the packaged engine did not reach 'serving' from the AppImage layout on aarch64" >&2
            exit 1
          fi
          echo "the packaged engine served on aarch64, using only the runtime inside the AppImage"

      # ── THE PACKAGED APP IS LAUNCHED, AND ITS WINDOW HAS TO RENDER ───────
      #
      # Every other job here is a build or a static read, so a panic that only
      # exists at runtime ships. 0.9.7 aborted on every platform on every launch
      # and passed a green five-job matrix; 0.13.7 opened its window and threw
      # on the FIRST render, which no liveness check can tell from a working
      # app. The verdict is therefore a captured frame with content in it — a
      # window with real geometry AND a band across it carrying distinct
      # colours and ink. `xwd -root`, because an app-window capture is black
      # here: the compositor draws elsewhere.
      - name: The packaged app opens a window that renders
        run: |
          set -euo pipefail
          # THE TOOLS FIRST, BY NAME. `xwd` captures the frame and `xwininfo` says the display is
          # up; `xwd` ships in x11-apps, not x11-utils, and without it every capture failed
          # `spawnSync xwd ENOENT` and the check reported the APP as not rendering. A missing tool
          # refuses here, with its name, before anything is started.
          for t in xwd xwininfo; do
            command -v "$t" > /dev/null || { echo "launch check: $t is not installed"; exit 1; }
          done
          # THE BUNDLE MAY NOT SHIP THE MACHINE'S OPENER. `engine.rs` looks for `xdg-open` at
          # /usr/bin and /usr/local/bin and then on PATH, and the AppImage launcher puts the
          # AppDir FIRST on PATH for everything it starts — so an `xdg-open` inside the bundle
          # would answer instead of the machine's. The bundle already ships `xdg-mime` for its
          # own use, which is how this hazard is known to be reachable rather than imagined.
          ./build/ohmail-linux-aarch64.AppImage --appimage-extract > /dev/null
          if [ -e squashfs-root/usr/bin/xdg-open ]; then
            echo "launch check: the bundle ships an xdg-open, which would answer for the machine's" >&2
            exit 1
          fi
          rm -rf squashfs-root
          Xvfb :99 -screen 0 1400x900x24 &
          XVFB=$!
          # Waited for, not slept on: a capture against a server that is not up
          # yet fails for a reason that is not the app.
          for _ in $(seq 30); do xwininfo -display :99 -root > /dev/null 2>&1 && break; sleep 1; done
          # `set +e` around it on purpose: under `set -e` a red check would exit
          # the step here and the two lines below — the status this step reports
          # — would never run at all.
          # AN AppImage SELF-MOUNTS THROUGH FUSE, and a runner image without
          # libfuse2 fails to start it at all — which would be a check that
          # refuses every correct release. The runtime's own extract-and-run
          # path needs no FUSE; measured identical here, same window, same
          # frame verdict.
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 DISPLAY=:99 \
            node scripts/verify-desktop-launch.mjs build/ohmail-linux-aarch64.AppImage \
            --out launch-check --timeout 120
          RC=$?
          set -e
          kill "$XVFB" 2>/dev/null || true
          exit "$RC"

      - name: Keep the launch captures when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: launch-check-linux-aarch64-${{ github.run_number }}
          path: launch-check
          if-no-files-found: ignore

      - name: Upload the arm64 AppImage
        uses: actions/upload-artifact@v7
        with:
          name: ohmail-appimage-aarch64-${{ github.run_number }}
          path: build/ohmail-linux-aarch64.AppImage
          if-no-files-found: error

      - name: Upload the arm64 .deb
        uses: actions/upload-artifact@v7
        with:
          name: ohmail-deb-arm64-${{ github.run_number }}
          path: build/ohmail-linux-arm64.deb
          if-no-files-found: error

      - name: Upload the arm64 .rpm
        uses: actions/upload-artifact@v7
        with:
          name: ohmail-rpm-aarch64-${{ github.run_number }}
          path: build/ohmail-linux-aarch64.rpm
          if-no-files-found: error

      - name: Run summary
        if: always()
        run: |
          {
            echo '### ohmail for Linux on arm64 — unsigned build (engine-bearing)'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| toolchain | $(rustc --version) · node $(node --version) |"
            echo "| runner | $(. /etc/os-release; echo "$PRETTY_NAME") $(uname -m) |"
            for f in build/ohmail-linux-aarch64.AppImage build/ohmail-linux-arm64.deb \
                     build/ohmail-linux-aarch64.rpm; do
              [ -f "$f" ] || continue
              echo "| $(basename "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` · $(du -h "$f" | cut -f1) |"
            done
            echo
            echo 'For arm64 Linux — a Raspberry Pi desktop, Asahi on Apple silicon, an arm64'
            echo 'workstation or server. Not for Omarchy, which is x86_64 only.'
            echo 'Unsigned and without a repository: `chmod +x` the AppImage before running it.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # THE .rpm IS INSTALLED BY A PACKAGE MANAGER, ON THE DISTRIBUTION FAMILY IT
  # IS FOR.
  #
  # Every other Linux check in this file reads the artifact from OUTSIDE — the
  # file list, the metadata, the desktop entry pulled out with rpm2cpio. All of
  # that can be right about a package that `dnf` then refuses, or that installs
  # its files somewhere other than where its own manifest says. The .deb has a
  # human behind it (someone installs it before a release goes out); the .rpm
  # arrives with none, so this is where "it installs" stops being an inference.
  #
  # WHAT IT PROVES: dnf accepts the package; the binary, the desktop entry, the
  # icon, the mail engine and the vendored Node runtime land at the paths the
  # shell resolves at runtime; the entry validates against the freedesktop
  # specification and still carries the field code its mailto: claim depends on;
  # the packaged engine STARTS from the installed layout using only the runtime
  # inside the package, with no node on PATH; and `dnf remove ohmail` takes it
  # all away again.
  #
  # WHAT IT DOES NOT PROVE, stated so nobody reads it as proof: that the window
  # opens. There is no `ohmail --version` to call — the shell is a GUI program
  # with no command line — and a bare container has no display and none of the
  # webview stack. So the engine start is the deepest honest check available
  # here, and it is the same one the arm64 job runs out of its AppImage. The
  # libraries a bare Fedora is missing are PRINTED rather than asserted: this
  # package declares no dependencies, exactly as the .deb declares none, and
  # turning that print into a failure would be asking Fedora for a promise
  # Debian was never asked for.
  #
  # A pinned base image, deliberately: an install drill whose distribution moves
  # under it reports a Fedora change as an ohmail regression. Bump it with a
  # release, as a decision.
  # ==========================================================================
  linux-rpm-install:
    name: Linux · the .rpm installs on Fedora
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # The artifact the x86_64 Linux job renamed and uploaded — the exact bytes
      # a release attaches, not a rebuild.
      - name: Take the .rpm the Linux job produced
        uses: actions/download-artifact@v7
        with:
          name: ohmail-rpm-${{ github.run_number }}
          path: build

      - name: It is the file this job means to install
        run: |
          set -euo pipefail
          ls -la build
          test -s build/ohmail-linux-x86_64.rpm

      # THE DRILL IS A FILE, NOT AN INLINE STRING, and that is not tidiness.
      # A `docker run … bash -c '<prose and shell>'` body is executable context:
      # one apostrophe inside a comment closes the quote and the rest of the
      # script runs as commands of the outer shell. Written to a file with a
      # quoted heredoc, nothing in it is expanded or re-parsed by this shell.
      - name: Write the drill
        run: |
          set -euo pipefail
          mkdir -p build
          cat > build/rpm-install-drill.sh <<'DRILL'
          set -euo pipefail

          echo "=== the distribution this is running on ==="
          cat /etc/fedora-release
          rpm --eval '%{_arch}'

          echo
          echo "=== dnf installs the package ==="
          # `dnf install` of a local path resolves it as a package rather than a
          # repository name. Output is not piped anywhere: a reader that closes
          # the pipe early kills the producer, and this file's own header says
          # what that costs.
          dnf -y install /work/ohmail-linux-x86_64.rpm

          echo
          echo "=== and the package database now holds it ==="
          # Read back from the DATABASE (`-q`, no `p`), which is the difference
          # between "the file said so" and "the machine did it".
          rpm -q ohmail
          rpm -ql ohmail
          test "$(rpm -q --qf '%{NAME}' ohmail)" = "ohmail"
          test "$(rpm -q --qf '%{ARCH}' ohmail)" = "x86_64"

          echo
          echo "=== the installed paths the shell resolves at runtime ==="
          test -x /usr/bin/ohmail
          file /usr/bin/ohmail
          test -f /usr/share/applications/ohmail.desktop
          test -f /usr/lib/ohmail/engine/bin/ohmail-engine.mjs
          test -d /usr/lib/ohmail/engine/drizzle
          test -x /usr/lib/ohmail/runtime/node
          ICONS="$(find /usr/share/icons/hicolor -name 'ohmail.png' -type f)"
          printf '%s\n' "$ICONS"
          test -n "$ICONS"

          echo
          echo "=== the desktop entry, as installed ==="
          cat /usr/share/applications/ohmail.desktop
          # freedesktop's own validator, from desktop-file-utils. It is what a
          # distribution's packaging review would run.
          desktop-file-validate /usr/share/applications/ohmail.desktop
          ENTRY="$(cat /usr/share/applications/ohmail.desktop)"
          printf '%s\n' "$ENTRY" | grep -qx 'Exec=ohmail %U' || {
            echo "the installed entry does not hand the URL to the app" >&2; exit 1; }
          printf '%s\n' "$ENTRY" | grep -q '^MimeType=.*x-scheme-handler/mailto' || {
            echo "the installed entry no longer claims mailto" >&2; exit 1; }
          printf '%s\n' "$ENTRY" | grep -qx 'StartupWMClass=ohmail' || {
            echo "the installed entry cannot be matched to the window" >&2; exit 1; }

          echo
          echo "=== what a bare Fedora does not supply (printed, not asserted) ==="
          # See the job header: this package declares no dependencies and neither
          # does the .deb. This is the record of what a desktop has to already
          # have — every distribution that ships a GTK browser engine does.
          ldd /usr/bin/ohmail || true

          echo
          echo "=== the packaged engine starts from the installed layout ==="
          # No node on PATH, no display, nothing from the container's own
          # packages: the runtime inside the package runs the engine bundle
          # inside the package, and it has to reach `serving`. The process status
          # is captured directly rather than through a pipe.
          D="$(mktemp -d)"
          set +e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/root \
            OHMAIL_KEK="$(printf 'a%.0s' $(seq 64))" \
            OHMAIL_IMAP_HOST=127.0.0.1 OHMAIL_IMAP_PORT=59999 \
            OHMAIL_IMAP_USER=boot@local OHMAIL_MAILBOX_ADDRESS=boot@local \
            OHMAIL_IMAP_SECURE=0 OHMAIL_DATA_DIR="$D" \
            /usr/lib/ohmail/runtime/node /usr/lib/ohmail/engine/bin/ohmail-engine.mjs \
            > "$D/out" 2> "$D/err" &
          ENGINE_PID=$!
          set -e
          for _ in $(seq 60); do grep -q '"event":"serving"' "$D/err" && break; sleep 0.5; done
          SERVED="$(grep -c '"event":"serving"' "$D/err" || true)"
          kill "$ENGINE_PID" 2>/dev/null || true
          wait "$ENGINE_PID" 2>/dev/null || true
          echo "--- engine stderr (last 20) ---"; tail -20 "$D/err"
          if [ "$SERVED" -lt 1 ]; then
            echo "the packaged engine did not reach 'serving' from the installed layout" >&2
            exit 1
          fi
          echo "the packaged engine served from /usr/lib/ohmail, using only the runtime inside the package"

          echo
          echo "=== dnf remove takes it away again ==="
          # The README tells people `sudo dnf remove ohmail`. That is a claim, so
          # it is checked: the package name is one word and the files go.
          dnf -y remove ohmail
          test ! -e /usr/bin/ohmail
          test ! -e /usr/share/applications/ohmail.desktop
          test ! -e /usr/lib/ohmail/engine/bin/ohmail-engine.mjs
          echo "the install drill passed end to end"
          DRILL
          chmod +x build/rpm-install-drill.sh
          head -5 build/rpm-install-drill.sh

      - name: Install it on Fedora and start what it installed
        run: |
          set -euo pipefail
          # MEASURED against a stock `fedora:42`, not assumed: `rpm`, `rpm2cpio`,
          # `awk`, `find` and `ldd` are in the base image, and
          # `desktop-file-validate` is NOT — it comes from desktop-file-utils,
          # which is why that package and no other is installed here.
          # findutils is named beside it so the drill's `find` does not depend on
          # a base image continuing to carry it.
          docker run --rm \
            -v "$PWD/build:/work:ro" \
            registry.fedoraproject.org/fedora:42 \
            bash -c 'dnf -y install desktop-file-utils findutils file >/dev/null && bash /work/rpm-install-drill.sh'

      - name: Run summary
        if: always()
        run: |
          {
            echo '### ohmail on Fedora — the .rpm, installed by dnf'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| package | \`ohmail-linux-x86_64.rpm\` from the x86_64 Linux job |"
            echo "| container | \`registry.fedoraproject.org/fedora:42\` |"
            echo
            echo 'Installs, lands its files where the shell resolves them, starts its own mail'
            echo 'engine from the installed layout, and uninstalls. The window is not opened here.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # The Flatpak — the distribution-agnostic Linux build, x86_64.
  #
  # It is NOT a release asset: Flathub builds and signs its own copy from the
  # same manifest, and a second, unsigned single-file bundle would be an install
  # path with no update story. What this job is for is that the manifest in this
  # repository still BUILDS, with no network, from the two generated source
  # files beside it — the failure it catches is a dependency bump that lands
  # without regenerating them, which would otherwise be found by a Flathub
  # builder days later.
  #
  # aarch64 is deliberately not claimed here. Flathub builds that arch itself;
  # asserting it on a runner this repository does not have would be a claim
  # nothing measured.
  # ==========================================================================
  linux-flatpak:
    name: Linux · flatpak builds offline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The builder and the runtimes the manifest names, read OUT OF the
      # manifest rather than repeated here: a runtime bump in the manifest that
      # this step did not hear about would install the old one and build against
      # it, which is the drift the job exists to catch.
      - name: Install flatpak and the runtimes the manifest names
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder

          # A RUNTIME DIRECTORY, WHICH A CI STEP DOES NOT HAVE EITHER. flatpak allocates an
          # instance directory under XDG_RUNTIME_DIR for each sandbox it starts, and the nested
          # `flatpak build` the module build spawns dies `Unable to allocate instance id` without
          # one — measured in the same container, which went on to build the first module once it
          # had one. This creates a directory only when the runner has none.
          if [ -z "${XDG_RUNTIME_DIR:-}" ] || [ ! -d "${XDG_RUNTIME_DIR:-}" ]; then
            D="/run/user/$(id -u)"
            sudo install -d -o "$(id -un)" -g "$(id -gn)" -m 700 "$D"
            echo "XDG_RUNTIME_DIR=$D" >> "$GITHUB_ENV"
            echo "no runtime directory on this runner; flatpak gets $D"
          fi

          # THE BUILDER COMES FROM apt; THE FLATHUB APP KEEPS THE REVIEW TOOLS. flatpak-builder
          # inside the org.flatpak.Builder sandbox asks the HOST's flatpak over the
          # org.freedesktop.Flatpak portal, which a CI step has no session bus to reach: every run
          # here died `Failed to init: Unable to find sdk` while this step reported success, and
          # moving the runtimes (per-user with FLATPAK_USER_DIR, then system-wide) changed nothing.
          # A session bus gets it past that, and it then refuses its own finished tree — `Command
          # 'ohmail' not found` with the binary in files/bin — while the host builder builds the
          # same manifest from the same tree to a repository. Measured both ways in one container
          # on this runner's flatpak. The runtimes stay system-wide, as the README shows a reader.
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak remote-add --system --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

          M=apps/desktop/flatpak/app.ohmail.Desktop.yml
          RUNTIME_VERSION="$(node -e '
            const t = require("fs").readFileSync(process.argv[1], "utf8");
            console.log(/^runtime-version: *.(\d+).\s*$/m.exec(t)[1]);
          ' "$M")"
          echo "the manifest asks for GNOME $RUNTIME_VERSION"

          flatpak install -y --user flathub org.flatpak.Builder
          sudo flatpak install -y --system flathub \
            "org.gnome.Platform//$RUNTIME_VERSION" "org.gnome.Sdk//$RUNTIME_VERSION" \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.freedesktop.Sdk.Extension.node22//25.08
          # The extension BRANCH is the freedesktop base the GNOME runtime sits on — 25.08 for
          # GNOME 49 and 50, read from the Platform's own GL extension versions. It is spelled
          # here rather than derived because a wrong branch is a loud failure: flatpak-builder
          # resolves the extension from the SDK and refuses a build when it is not installed.

      # Every tool this job SPAWNS, asserted by name before the subject starts —
      # a missing one otherwise reads as the app failing rather than the runner.
      - name: The tools this job spawns
        run: |
          for t in flatpak flatpak-builder node dbus-run-session; do
            command -v "$t" >/dev/null || { echo "$t is not installed" >&2; exit 1; }
          done
          flatpak-builder --version >/dev/null || { echo "flatpak-builder does not run" >&2; exit 1; }
          for c in appstreamcli desktop-file-validate flatpak-builder-lint; do
            dbus-run-session -- flatpak run --command="$c" org.flatpak.Builder --version >/dev/null 2>&1 \
              || dbus-run-session -- flatpak run --command="$c" org.flatpak.Builder --help >/dev/null \
              || { echo "$c is not in org.flatpak.Builder" >&2; exit 1; }
          done

      # The release notes in the metainfo are DERIVED from the changelog. This is
      # the check half of the generator: a version that landed in CHANGELOG.md
      # without the metainfo being regenerated is red here, not in a software
      # centre showing a release behind.
      - name: The metainfo's releases are the changelog's
        run: node scripts/appstream-releases.mjs

      # THE GENERATED SOURCES, ASKED OF THE TREE THEY WERE DERIVED FROM. `node-sources.json` is
      # generated from the ROOT package-lock.json, which only a published checkout has — and this
      # job runs in one, so it can ask. Without it a file left behind arrives ten minutes later as
      # an `ENOTCACHED` inside npm, in the middle of a module build, reading like the app failing
      # to build rather than like a generated file nobody regenerated.
      - name: The generated sources still cover the lockfiles
        run: node scripts/flathub-manifest.mjs --check --mirror .

      - name: The desktop entry is valid
        run: |
          dbus-run-session -- flatpak run --command=desktop-file-validate org.flatpak.Builder \
            apps/desktop/flatpak/app.ohmail.Desktop.desktop

      - name: The metainfo is valid
        run: |
          dbus-run-session -- flatpak run --command=appstreamcli org.flatpak.Builder validate --no-net \
            apps/desktop/flatpak/app.ohmail.Desktop.metainfo.xml

      # TWO PASSES, and the second one is the proof. The first resolves every declared
      # source and verifies it against the checksum in the two generated files. The
      # second may not download at all, so anything the build needs beyond what was
      # just declared is a failure here rather than on Flathub's builders.
      #
      # `--sandbox` is not used and cannot be: it refuses a `type: dir` source outside
      # the manifest's own directory, and this manifest deliberately builds the
      # checkout. What --sandbox would have enforced — that no module carries
      # `build-args` to open a network — is asserted offline in
      # test/flatpak-manifest.test.ts instead.
      - name: Resolve every declared source
        run: |
          flatpak-builder --force-clean --download-only \
            flatpak-build apps/desktop/flatpak/app.ohmail.Desktop.yml

      # WHAT THE BUILDER CAN SEE, ASKED BEFORE THE BUILD DEPENDS ON IT. Stopping at the first
      # module initialises the build directory — the step that needs the runtime, the sdk and
      # every sdk-extension — and builds nothing. A ref the builder cannot reach refuses here,
      # naming the installation it was looked for in, rather than arriving as a bare
      # `Failed to init` out of a step whose subject is supposed to be the app. `flatpak info`
      # is not the question to ask: the flatpak inside that sandbox and the builder beside it
      # disagree about what is installed, and the builder is the one that decides.
      - name: The runtime the manifest names is visible to the builder
        run: |
          M=apps/desktop/flatpak/app.ohmail.Desktop.yml
          FIRST=$(sed -n 's/^  - name: //p' "$M" | head -1)
          [ -n "$FIRST" ] || { echo "no module name could be read out of $M" >&2; exit 1; }
          flatpak-builder --force-clean --disable-download --stop-at="$FIRST" \
            flatpak-init "$M" \
            || { echo "the runtime, the sdk or an sdk-extension $M names is not installed where flatpak-builder looks" >&2; exit 1; }

      - name: Build the Flatpak, with nothing left to fetch
        run: |
          flatpak-builder --force-clean --disable-download \
            --repo=flatpak-repo \
            flatpak-build apps/desktop/flatpak/app.ohmail.Desktop.yml

      # What the app needs at runtime, read out of the finished tree. Each of
      # these is a path engine.rs composes from Tauri's resource_dir(), and each
      # absence is an app that installs cleanly and cannot start its engine.
      - name: The shipped layout is the one engine.rs resolves
        run: |
          F=flatpak-build/files
          for p in bin/ohmail \
                   lib/ohmail/engine/bin/ohmail-engine.mjs \
                   lib/ohmail/engine/bin/node_modules/@electric-sql/pglite \
                   lib/ohmail/engine/drizzle \
                   lib/ohmail/runtime/node \
                   lib/ohmail/runtime/node.LICENSE \
                   lib/ohmail/host-client/index.html \
                   share/applications/app.ohmail.Desktop.desktop \
                   share/metainfo/app.ohmail.Desktop.metainfo.xml \
                   share/icons/hicolor/512x512/apps/app.ohmail.Desktop.png; do
            [ -e "$F/$p" ] || { echo "the built tree has no $p" >&2; exit 1; }
          done
          [ -x "$F/lib/ohmail/runtime/node" ] || {
            echo "the vendored runtime is not executable" >&2; exit 1; }

          # IN the runtime, not on the runner: this binary links the Platform's libraries
          # (it fails on a stock ubuntu-latest with `libicui18n.so.77: cannot open shared
          # object file`), so running it here would be a false red about the app.
          flatpak build flatpak-build /app/lib/ohmail/runtime/node --version

          # AND THE RUNTIME CARRIES THE OPENER THE APP RESOLVES. Inside the sandbox `xdg-open`
          # is the Platform's portal shim — the app execs it and never talks to the portal
          # itself — and `engine.rs` looks for it at /usr/bin first. A runtime that stopped
          # shipping xdg-utils would install cleanly and open no link at all, which is a defect
          # a person finds and no build step here would. The runtime is read out of the manifest
          # rather than written down twice.
          R=$(sed -n 's/^runtime: *//p' apps/desktop/flatpak/app.ohmail.Desktop.yml | head -1)
          V=$(sed -n "s/^runtime-version: *//p" apps/desktop/flatpak/app.ohmail.Desktop.yml \
                | head -1 | tr -d "'\"")
          [ -n "$R" ] && [ -n "$V" ] || { echo "the manifest names no runtime" >&2; exit 1; }
          flatpak info "$R//$V" > /dev/null 2>&1 || {
            echo "the $R//$V runtime is not installed, so nothing was asked about it" >&2; exit 1; }
          flatpak run --command=sh "$R//$V" -c 'command -v xdg-open' || {
            echo "the $R//$V runtime has no xdg-open — every link in the app would do nothing" >&2
            exit 1; }

      # Flathub's own linter, over the manifest and then the built repository.
      # It is the closest thing to the review the submission gets.
      - name: flatpak-builder-lint
        run: |
          dbus-run-session -- flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest apps/desktop/flatpak/app.ohmail.Desktop.yml
          dbus-run-session -- flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            repo flatpak-repo

      # The permission set, asserted against the built metadata rather than
      # against the manifest it was written from — the finished app is what a
      # person installs. A --filesystem grant of any kind is a refusal here:
      # this build reaches the host's files only through the portal.
      - name: The app ships the permissions it says it does
        run: |
          META=flatpak-build/metadata
          cat "$META"
          ! grep -q 'filesystems=' "$META" || {
            echo "the built app carries a --filesystem grant" >&2; exit 1; }
          for want in 'shared=network;ipc' 'sockets=wayland;fallback-x11' \
                      'org.freedesktop.secrets=talk' 'org.freedesktop.Notifications=talk'; do
            grep -q "$want" "$META" || { echo "the built app is missing $want" >&2; exit 1; }
          done

      # A SUMMARY THAT CANNOT SAY "IT DID NOT BUILD" IS A CLAIM, NOT A READING. This step runs
      # on a failed job too, and the sentence below stated a build on every one of them while
      # the job had never once concluded success.
      - name: Run summary
        if: always()
        run: |
          {
            echo '### Linux · Flatpak'
            echo
            if [ "${{ job.status }}" = success ]; then
              echo 'Built `app.ohmail.Desktop` from the committed manifest with no network access,'
              echo 'asserted the shipped layout, and ran the Flathub linter. Not a release asset:'
              echo 'Flathub builds and signs its own copy.'
            else
              echo 'FLATPAK: FAILED — the manifest was not built. The step that refused says why in'
              echo 'the log; nothing was asserted here about the shipped layout or the linter.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # The engine — packages/{core,api,db,services,db-mail} and apps/{sidecar,worker}.
  # Every job above PACKAGES the app; none of them reads the engine source the
  # app now carries. This one does. It installs the locked dependency tree,
  # TYPECHECKS the engine against a generated tsconfig, then BUILDS the one-file
  # bundle from the published source. A green here is evidence the published
  # engine compiles and bundles on a clean machine — not merely that a packager
  # ran over source no job ever read.
  # ==========================================================================
  engine:
    name: engine · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # From the committed package-lock.json, so the dependency tree is the same
      # on every machine — the reproducibility the exact-pinned manifests promise.
      - name: Install the locked dependency tree
        run: npm ci --no-audit --no-fund

      # typescript AND every @types package in ONE install: a second `npm install
      # --no-save` prunes what an earlier one added, after which `npx tsc` fetches
      # the unrelated `tsc` package. The @types back the engine's `node:` and
      # untyped-dependency imports; the runtime deps ship their own declarations.
      - name: Typecheck the engine source
        run: |
          npm install --no-save \
            typescript@5.6 \
            @types/node@^22.10.0 \
            @types/nodemailer@^6.4.16 \
            @types/mailparser@^3.4.0 \
            @types/sanitize-html@^2.16.1
          ./node_modules/.bin/tsc --noEmit -p tsconfig.engine.json

      # Build the one-file engine from the published source. esbuild is pinned —
      # the bundler asserts its own version. It is a pinned devDependency of the
      # root manifest, so the `npm ci` above resolves it and nothing has to be
      # installed off to one side or carried into the following steps.
      - name: Build the engine bundle
        run: node scripts/engine-bundle.mjs

      - name: Confirm the bundle and its runtime layout
        run: |
          set -euo pipefail
          test -f build/engine/bin/ohmail-engine.mjs
          test -f build/engine.meta.json
          test -d build/engine/drizzle
          test -d build/engine/bin/node_modules/@electric-sql/pglite
          echo "engine bundle sha256: $(sha256sum build/engine/bin/ohmail-engine.mjs | cut -d' ' -f1)"

      # ======================================================================
      # THE REPRODUCIBILITY GATE.
      #
      # This repository offers a claim anyone is invited to check: the engine
      # inside the download was built from the source in front of them. That
      # invitation is only worth taking up if building the same source twice
      # gives the same bytes — otherwise a rebuild that does not match says
      # nothing, because it never would have.
      #
      # So the engine is built twice more, into two scratch directories, and
      # the whole shipped layout is compared file by file. The manifest hash it
      # prints goes into the run summary: two runs of this job on one commit
      # printing one hash is reproducibility across MACHINES, which is stronger
      # than anything a single job can assert on its own.
      #
      # The check runs in the environment this repository's own install
      # produces — `npm ci` against the committed lock — which is the
      # environment someone rebuilding a download rebuilds in.
      # ======================================================================
      - name: The engine builds byte-identically twice
        run: |
          set -euo pipefail
          mkdir -p build
          # The status of the CHECK, captured directly. Piping it into something
          # that prints it would report the printer's exit code instead, and a
          # failed gate would read as a clean run.
          node scripts/verify-engine-repro.mjs > build/engine-repro.log 2>&1 && rc=0 || rc=$?
          cat build/engine-repro.log
          exit "$rc"

      - name: Run summary
        if: always()
        run: |
          {
            echo '### ohmail engine — typecheck + build'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| node | $(node --version) |"
            [ -f build/engine/bin/ohmail-engine.mjs ] \
              && echo "| engine bundle sha256 | \`$(sha256sum build/engine/bin/ohmail-engine.mjs | cut -d' ' -f1)\` |"
            if [ -f build/engine-repro.log ]; then
              # The layout manifest — every file in the shipped tree, its hash
              # and its mode — reduced to one line. Compare it against another
              # run of this job on the same commit.
              m="$(grep -m1 '^engine layout manifest sha256: ' build/engine-repro.log | cut -d' ' -f5 || true)"
              [ -n "$m" ] && echo "| engine layout manifest sha256 | \`$m\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # THE WINDOW BUNDLE'S OWN VERDICT.
  #
  # The three platform jobs already build this bundle and smoke it — fail-fast
  # at step 1, and again inside `app:build:engine` beside the artifact it is
  # packaged into. Those are the right places for a GATE and the wrong place
  # for an ANSWER: a platform job that dies earlier (a toolchain update, a
  # runtime download, a Rust regression) is a run where the bundle's own
  # question was never put — which is exactly how it once went unrendered for
  # two releases, behind a red smoke of a since-retired second artifact.
  #
  # This job puts it, and can be stopped by nothing else. No `needs:`, no
  # Rust, no engine binary, no vendored Node runtime: the smoke serves the
  # window from a stub Tauri channel, so building the bundle and rendering it
  # is a `vite build` and a jsdom render. It is the cheapest job in the file
  # and it finishes before any platform job has finished installing its
  # toolchain.
  #
  # It runs the SAME two checks over the SAME bundle as the platform jobs do,
  # spelled identically on purpose — `scan:engine` reads the bundle's bytes
  # (the gate-only surfaces present, the sample world absent), and `smoke.mjs
  # --expect engine` executes it, offline audit included. Two callers of one
  # check can drift; what stops that here is that all call the same script
  # with the same argument, and that the answer this one gives is the answer
  # the release is read against.
  # ==========================================================================
  engine-ui-smoke:
    name: engine-bearing UI · scan · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # `apps/desktop` only, and no workspace: the Vite config aliases every
      # `@ohmail/*` specifier straight at a source path, which is why the three
      # platform jobs install exactly this and nothing else.
      - name: Install the desktop tree from its lockfile
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Build the engine-bearing UI bundle
        working-directory: apps/desktop
        run: npm run ui:build:engine

      # Reading the bundle and rendering it answer different questions, and the
      # scan is masked in exactly the same way the smoke was — it also lives
      # only inside `app:build:engine`. Both come out here together.
      - name: Read what came out
        working-directory: apps/desktop
        run: npm run scan:engine

      - name: Render it
        working-directory: apps/desktop
        run: node scripts/smoke.mjs --expect engine

      - name: Run summary
        if: always()
        run: |
          {
            echo '### ohmail — the engine-bearing UI bundle'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| node | $(node --version) |"
            echo
            echo 'Built with the bridge and rendered against a stub shell.'
            echo 'This job produces no artifact. It is red or green on its own,'
            echo 'so that no earlier failure can ever again mean this bundle'
            echo 'went unrendered — and a red here fails the run like any other.'
          } >> "$GITHUB_STEP_SUMMARY"
