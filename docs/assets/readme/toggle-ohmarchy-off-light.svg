  <defs>
  <filter id="lift" x="-40%" y="-60%" width="180%" height="260%">
    <feDropShadow in="SourceGraphic" dx="0" dy="1" stdDeviation="1" flood-color="#5d402d" flood-opacity="0.05" result="s1"/>
