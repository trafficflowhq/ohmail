# THIS WORKSPACE'S OWN TEST SERVICES — never a deployment. The deployable stack is
# deploy/selfhost/docker-compose.yml; this file is the Postgres, mail and object-store
# doubles the suites need.
#
# EVERY PUBLISHED PORT BINDS LOOPBACK. A publish with no address binds 0.0.0.0 AND [::] —
# every interface the machine has — and what is behind these ports is a database whose
# password is in this file, a mail server with authentication switched off, and an object
# store with a known key. That is fine on a desk and not fine on a laptop in a cafe, and
# the file said nothing about which one it assumed.
#
# OHMAIL_DEV_BIND is the one place that is decided. It defaults to 127.0.0.1; a rig that has
# to reach these services from another machine or from an emulator sets it explicitly
# (an Android emulator reaches the host at 10.0.2.2, which is NOT loopback — `adb reverse`
# is the other way, and the one that does not open a socket to the room).

services:
  db:
    # Every image here is named by its digest, and .github/workflows/ci.yml runs the same ones
    # (test/ci-shards.test.ts ties the two). Postgres is our mirrored copy (deploy/selfhost/images.lock).
    image: ghcr.io/trafficflowhq/mirror-postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    shm_size: "1g"
    environment:
      POSTGRES_USER: tf
      POSTGRES_PASSWORD: tf
      POSTGRES_DB: trafficflow_test
    ports:
      - "${OHMAIL_DEV_BIND:-127.0.0.1}:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tf -d trafficflow_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  greenmail:
    image: greenmail/standalone:2.1.3@sha256:d6db42a4fc258fec0948b1ae7b579fd06947cc92087c162ec0597972a6c36850
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.users.login=email"
    ports:
      - "${OHMAIL_DEV_BIND:-127.0.0.1}:3143:3143"   # IMAP
      - "${OHMAIL_DEV_BIND:-127.0.0.1}:3025:3025"   # SMTP

  rustfs:
    # MinIO is dead (both its Docker Hub repositories were deleted on 2026-09-12), so the
    # object store is RustFS. Like the shipped stacks (deploy/selfhost/images.lock) this
    # boots our own mirrored copy.
    image: ghcr.io/trafficflowhq/mirror-rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: tf-staging
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:-tf-staging-password}
      # No call home and no console, as in the shipped stacks (test/rustfs-stays-quiet.test.ts).
      RUSTFS_CHECK_UPDATE: "false"
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "${OHMAIL_DEV_BIND:-127.0.0.1}:3902:9000"   # object-store API — attachment-staging-s3.rustfs.test.ts round-trips against it
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  dovecot:
    image: dovecot/dovecot:2.3.21@sha256:1c18c756f20d03867077a1b509a6e2e3008ab1eafa56377b6f2eca12dc1ba581
    volumes:
      - ./test/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
    ports:
      - "${OHMAIL_DEV_BIND:-127.0.0.1}:3144:143"   # IMAP (plaintext)
    profiles: ["condstore"]   # only started with: docker compose --profile condstore up -d dovecot
