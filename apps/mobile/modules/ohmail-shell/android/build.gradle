apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'app.ohmail.shell'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle",
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "app.ohmail.shell"
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  // androidx.webkit: the asset loader that serves the shell's files under an https origin, the web
  // message listener that names a message's origin and frame, and the web view package's version.
  // Apache-2.0. Pinned to 1.14.0, the version react-native-webview already puts in this graph.
  implementation "androidx.webkit:webkit:1.14.0"
}
