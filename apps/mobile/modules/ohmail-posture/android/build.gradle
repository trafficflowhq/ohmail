apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'app.ohmail.posture'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle",
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "app.ohmail.posture"
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  // Jetpack WindowManager — the fold API itself (FoldingFeature, WindowInfoTracker). Its
  // coroutines come transitively at the version it was built against; naming our own here
  // would be the two-OkHttps trap from host-pinning's gradle, one artifact over.
  implementation "androidx.window:window:1.3.0"
}
