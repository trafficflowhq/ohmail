# The Flatpak build of the ohmail desktop app.
#
# The app id is also the Tauri identifier this build compiles with, set by the one-key config
# ../src-tauri/tauri.flatpak.conf.json — which the CLI merges LAST, and which is deliberately not
# named tauri.linux.conf.json, because that name is merged into every Linux build and would move
# the AppImage, .deb and .rpm identifier too. A Flatpak may own D-Bus names only under its own id
# and single-instance owns `<id>.SingleInstance`, so the two must be equal or a mailto: activation
# starts a second copy. The other Linux builds keep the identifier they shipped with: their data
# directories are not migrated by this release, and a sandbox never shares them anyway.
#
# Nothing here is fetched at build time. Every input is a declared, checksummed source: the
# crates from cargo-sources.json, the npm tree from node-sources.json, and the Node runtime the
# mail engine is spawned with from the node22 SDK extension, which freedesktop-sdk builds from
# source. `scripts/vendor-node.mjs` is not called in this build.
id: app.ohmail.Desktop
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: ohmail

# THIS LIST AND NO MORE. Each line is a capability the app is measured to need; the app is
# expected to fail honestly without one, never to pretend.
#   network  — IMAP and SMTP to the mailbox you configure, and host mode's own listener.
#   ipc/wayland/fallback-x11/dri — the WebKitGTK window.
#   secrets  — the key that encrypts the local mirror lives in the login keyring.
#   Notifications — the one notice the engine posts when new mail is filed.
# There is deliberately no --filesystem grant of any kind: the engine's database, its log and
# any attachment it writes live under the app's own data directory, and a file it opens goes
# out through the OpenURI portal.
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man

modules:
  - name: ohmail
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      env:
        CARGO_HOME: /run/build/ohmail/cargo
        # The two caches flatpak-node-generator laid down. npm resolves only what is in them:
        # a package the lockfiles do not name is a build failure, not a fetch.
        XDG_CACHE_HOME: /run/build/ohmail/flatpak-node/cache
        npm_config_cache: /run/build/ohmail/flatpak-node/npm-cache
    build-commands:
      # 1 · the dependency trees, from the sources flatpak-node-generator wrote.
      - npm ci --offline --no-audit --no-fund
      - npm ci --offline --no-audit --no-fund --prefix apps/desktop

      # 2 · the mail engine: one bundled file, its storage package and its migration journal.
      - node scripts/engine-bundle.mjs
      - node scripts/verify-engine-boot.mjs

      # 3 · the Node runtime the engine is spawned with. The SDK extension builds it from source
      #     and ships its licence beside it; `stage-desktop-resources.mjs` refuses to stage a
      #     runtime with no licence, which is why the second copy is not optional.
      - install -Dm755 /usr/lib/sdk/node22/bin/node build/vendor/node
      - install -Dm644 /usr/lib/sdk/node22/share/licenses/org.freedesktop.Sdk.Extension.node22/node/LICENSE
        build/vendor/node.LICENSE

      # 4 · the app. The three configs are merged in order: base, the engine overlay that names
      #     the staged resources, then this build's identity. --no-bundle because the Flatpak IS
      #     the packaging; the install lines below place what a bundler would have placed.
      - cd apps/desktop && node scripts/build-engine-app.mjs -- --no-bundle
        --config src-tauri/tauri.flatpak.conf.json

      # 5 · the shipped layout, which is a contract with engine.rs: it composes the engine and the
      #     runtime from Tauri's resource_dir(), and on Linux that is <exe dir>/../lib/ohmail.
      - install -Dm755 apps/desktop/src-tauri/target/release/ohmail /app/bin/ohmail
      - mkdir -p /app/lib/ohmail
      - cp -r build/desktop-resources/engine /app/lib/ohmail/engine
      - cp -r build/desktop-resources/runtime /app/lib/ohmail/runtime
      - cp -r apps/desktop/dist-host /app/lib/ohmail/host-client
      - chmod 755 /app/lib/ohmail/runtime/node

      # 6 · what the desktop sees. The icon is installed under the app id, which is the name the
      #     desktop entry's Icon= key resolves.
      - install -Dm644 apps/desktop/flatpak/app.ohmail.Desktop.desktop
        /app/share/applications/app.ohmail.Desktop.desktop
      - install -Dm644 apps/desktop/flatpak/app.ohmail.Desktop.metainfo.xml
        /app/share/metainfo/app.ohmail.Desktop.metainfo.xml
      - install -Dm644 apps/desktop/src-tauri/icons/icon.png
        /app/share/icons/hicolor/512x512/apps/app.ohmail.Desktop.png
      - install -Dm644 apps/desktop/src-tauri/icons/128x128@2x.png
        /app/share/icons/hicolor/256x256/apps/app.ohmail.Desktop.png
      - install -Dm644 apps/desktop/src-tauri/icons/128x128.png
        /app/share/icons/hicolor/128x128/apps/app.ohmail.Desktop.png
    sources:
      - type: dir
        path: ../../..
        skip:
          - .git
          - node_modules
          - apps/desktop/node_modules
          - apps/desktop/dist
          - apps/desktop/dist-host
          - apps/desktop/src-tauri/target
          - build
      - cargo-sources.json
      - node-sources.json
