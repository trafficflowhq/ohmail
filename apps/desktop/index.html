<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Belt to the Tauri CSP's braces: the real policy is the header the Tauri
         webview serves (src-tauri/tauri.conf.json → app.security.csp), and this
         is the same policy minus `frame-ancestors`, which a <meta> element is
         specified to ignore — declaring it here would only print an error in
         every console. The header carries it.

         `blob:` in img-src and NOWHERE ELSE: the attachment preview draws an image
         from the engine's own retained Blob through an object URL, and a policy
         without it refused the render — the overlay showed name/type/size over an
         empty stage. An <img> is inert (no SVG script runs in one, and the engine
         types an SVG blob as octet-stream anyway) and a blob: URL is this
         document's own memory — no request leaves, connect-src stays 'none'. The
         browser and host clients already carry the same three sources. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'" />
    <!-- The window icon comes from the bundle; this is for the webview's own
         /favicon.ico probe, which would otherwise 404 into the console. Same
         file the installers use, emitted into the bundle by Vite. -->
    <link rel="icon" type="image/png" href="./src-tauri/icons/32x32.png" />
    <title>ohmail</title>
  </head>
  <body class="mo-canvas app-body">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
