[package]
name = "ohmail"
version = "0.13.1"
description = "ohmail — consent-first email. Windows/Linux preview shell."
authors = ["TrafficFlow GmbH <support@ohmail.app>"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.82"

# The binary the installers ship. Named for the product, which is written lower-case,
# and it is also the Linux command: the .deb puts it at /usr/bin/ohmail and CI asserts
# that. The .deb's own `Package:` field does NOT come from here — Tauri kebab-cases
# `productName` in tauri.conf.json — but that is "ohmail" too, so the two agree.
[[bin]]
name = "ohmail"
path = "src/main.rs"

[features]
# TWO ARTIFACTS, NOT ONE BINARY WITH A SWITCH.
#
# `local-engine` compiles the shell's ownership of the local engine's lifetime:
# start it with the app, watch it, and make certain it is gone when the app is.
# With the feature off, `src/engine.rs` is not in the binary at all, so the
# interface preview's audit story is a property of the BUILD rather than of a
# branch that happened not to be taken — a spawn path inside a binary that has
# nothing to spawn is a capability carried without being used.
#
# ── THE FLAG IS PASSED BY THE CALLER, NOT MOVED INTO `default` ───────────────
#
# Whichever artifact is being built, the two halves have to be selected
# together: a binary compiled WITH this feature needs the UI bundle built by
# `npm run ui:build:engine`, and one compiled without needs `npm run ui:build`.
# Mixing them gives a window with a bridge and no commands to call, or commands
# with nothing to call them.
#
# Keeping the DEFAULT engine-less is what keeps the preview buildable, testable
# and inspectable by anyone who clones this — `cargo build` and `npm run
# ui:build` with nothing set produce the pair the render smoke runs over. A
# default of `["local-engine"]` would make the demo half reachable only by
# remembering `--no-default-features`, which is how a split stops being tested.
#
# It is not dead code either way: `cargo test --features local-engine` is what
# proves the lifecycle, and those tests start real processes.
default = []
local-engine = [
    "dep:keyring",
    "dep:getrandom",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-deep-link",
    "dep:tauri-plugin-single-instance",
    # The tray icon is host mode's window into an app whose window is closed: when this
    # install publishes its mail to the user's own tailnet, closing the window hides it
    # instead of quitting, and the tray is then the only visible handle on the running
    # process. It is a TAURI feature rather than a dependency line, so it is listed here —
    # the preview neither hides on close nor draws a tray, and compiling the capability out
    # of that artifact is the same audit argument as every optional dependency above.
    "tauri/tray-icon",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2's default feature set MINUS `compression`, plus exactly two plugins in
# the published build: the auto-updater and the native dialog it prompts through.
# Nothing else. A third — the notification centre — is declared further down and
# is OPTIONAL, compiled in only with `local-engine`, so the preview's dependency
# graph and the `strings` audit below are unchanged by it.
#
# Dropping brotli costs about a quarter of a megabyte in the installer and buys
# the thing this product is actually selling: a binary anyone can audit without
# running it. With compression on, the embedded UI is an opaque blob — you
# cannot grep a downloaded .msi for the URLs it contains, so "it talks to
# nobody but its own update feed" would be a claim rather than a check.
# Uncompressed, it is a check:
#
#     strings ohmail.exe | grep -E 'https?://'
#
# returns a short, enumerable set of strings — W3C namespace constants, a
# documentation link in a panic message, the `http` crate's "http://" literal
# glued to the next string in rodata, and now the ONE update endpoint this build
# is allowed to reach:
#
#     https://github.com/trafficflowhq/ohmail/releases/latest/download/latest.json
#
# The READMEs enumerate them, and CI fails the build if any string that is NOT
# that one endpoint names ohmail or TrafficFlow infrastructure. See the README's
# "Verify it yourself".
#
# WHAT CHANGED WITH THE UPDATER, stated plainly rather than softened. This build
# now makes ONE deliberate network request — to the pinned HTTPS endpoint above,
# scheduled or triggered from the native "Check for Updates…" menu item — and
# `tauri-plugin-updater` pulls in `reqwest`/`hyper` TRANSITIVELY to make it. That
# HTTP client is real and is named here so the audit story stays honest: it is
# reached only from `src/updater.rs`, only for that one endpoint, and the webview
# still cannot touch it (capabilities/main.json grants the window nothing, and
# the updater is Rust-side with no IPC permission granted). Every downloaded
# update is minisign-verified against `plugins.updater.pubkey` before it is
# allowed to install; a tampered payload or a downgrade is refused. The
# filesystem is still untouched by this crate's own code, and in the DEFAULT
# build nothing spawns a process — the shell's ownership of the local engine's
# lifetime is behind the `local-engine` feature above, which is off, so
# `src/engine.rs` is not compiled into the published binary.
#
# ── AND WHAT THE ENGINE-BEARING BUILD CHANGES, WHICH IS MORE ─────────────────
#
# Everything above describes the DEFAULT build, and it stays exactly true of it.
# The artifact people download is now the OTHER one — compiled with
# `local-engine` and bundled with `src-tauri/tauri.engine.conf.json` — and two of
# its properties are different in ways no amount of careful wording should blur:
#
#  · **It connects to a mail server.** That is the product. The connection is
#    the engine's, over a pipe this process owns, to a host the user typed; no
#    such host is compiled in and none appears in the `strings` audit above,
#    which is why that audit is unchanged and still means what it says. What
#    changed is the claim around it: "it talks to nobody but its update feed" is
#    true of the preview artifact and false of this one.
#  · **Its Windows installer can reach the network.** `webviewInstallMode` is
#    `downloadBootstrapper` in the engine config, against `skip` in the base
#    one. `skip` was right for a build that drew fixtures and would have been
#    dishonest to give up; it is wrong for a mail client, whose window IS the
#    product — on a machine without WebView2, `skip` produces an installer that
#    completes and an app that cannot start, which is the user's problem on
#    exactly the machines least able to diagnose it. With the runtime already
#    present the installer still opens no connection. The README says both
#    halves; the Windows CI job asserts the bootstrapper is compiled in.
tauri = { version = "2", default-features = false, features = [
    "wry",
    "common-controls-v6",
    "dynamic-acl",
    "x11",
    "dbus",
] }

# The auto-updater. Fetches the pinned `latest.json` feed, compares versions,
# downloads the platform artifact and verifies its minisign signature against
# `plugins.updater.pubkey` before installing. Notify-and-install: the Rust side
# asks the user first (see `src/updater.rs`) and installs only on consent — never
# silently. Brings `reqwest` in transitively; that is the only HTTP client in the
# binary and it is reached from nowhere but the updater. MIT OR Apache-2.0 —
# permissive, like every dependency of this client: the only copyleft in the
# shipped binary is meant to be this project's own AGPL-3.0.
tauri-plugin-updater = "2"

# The native dialog the updater notifies through — "an update is available,
# install it?" and the up-to-date / error notices. A native window, symmetric
# with the macOS client's Sparkle prompt; it opens no socket and no file. Kept
# Rust-side and ungranted to the webview, same as the updater. MIT OR Apache-2.0.
tauri-plugin-dialog = "2"

# Version arithmetic for the updater's own downgrade guard. `tauri-plugin-updater`
# already refuses anything that is not strictly newer; `src/updater.rs` re-checks
# it with this crate before installing, because the updater is a remote-code path
# and one version comparison we own and test is cheap insurance. Already in the
# graph (the plugin uses it); MIT OR Apache-2.0.
semver = "1"

# A DIRECT dependency, not an optional one, since the updater's config lives in
# tauri.conf.json: `tauri::generate_context!` embeds every `plugins` entry as a
# `serde_json::Value`, so the macro references `::serde_json` at the crate root
# in EVERY build now, not only the local-engine one. Nothing new is compiled for
# it — `tauri` already depends on this exact crate — so the binary's dependency
# graph and the `strings` audit are unchanged; only the manifest names it
# directly. The engine's JSON frame parser (behind `local-engine`) uses it too.
# MIT OR Apache-2.0. Nothing here is under a copyleft licence, and nothing may
# be: this binary is conveyed to users under AGPL-3.0, and its own licence is
# meant to be the only copyleft in it.
serde_json = "1"

# THE ONE PER-INSTALL KEY, AND WHY IT NEEDS A CRATE AT ALL.
#
# A local install has to be able to store a mailbox password and still have it
# after the app is quit. The engine seals that password into its own database
# under a key it is handed at spawn — so the key cannot live in the same
# database, and it must not live in a file beside it either: a key next to the
# ciphertext it opens is not a key, it is an obfuscation. The operating system
# already has the right place for exactly one small secret per application, and
# this crate is the portable way to reach it: Keychain on macOS, Credential
# Manager on Windows, the Secret Service on Linux.
#
# Optional, so the default build's dependency graph is unchanged — the preview
# stores nothing and therefore needs nowhere to store it. MIT OR Apache-2.0, as
# is everything it pulls in; nothing here is copyleft and nothing may be, since
# this binary is conveyed to users under AGPL-3.0 and its own licence is meant
# to be the only copyleft in it.
keyring = { version = "4", optional = true }

# The key's 32 bytes, from the operating system's CSPRNG. `getrandom` and not a
# full random-number generator: this needs one call, once per install, and a
# seeded userspace generator would be a worse source for the only secret the
# shell ever mints. Already in the dependency graph — `tauri` depends on it —
# so the feature adds no third-party code to audit here either.
getrandom = { version = "0.3", optional = true }

# THE PLATFORM'S OWN NOTIFICATION CENTRE, and nothing more than that.
#
# A mail app is expected to be able to say "there is something new" through the
# operating system rather than only inside its own window. The webview cannot:
# its CSP leaves it no way to request the permission, and it has no bundle
# identity for the platform to attribute a notice to. This process has both, so
# the frontend asks for one notice — a title and a body — through a command, and
# this crate is what shows it.
#
# Optional, and enabled only by `local-engine`, for the same reason the keystore
# is: the published preview has no mail and therefore nothing to announce, so its
# dependency graph and its `strings` audit are unchanged. The webview is granted
# this shell's own `notify` command and NONE of this plugin's permissions, which
# is the difference between "the window may ask for one notice" and "the window
# may drive the notification API".
#
# MIT OR Apache-2.0, as is everything it pulls in — nothing here is copyleft and
# nothing may be, since this binary is conveyed under AGPL-3.0 and its own
# licence is meant to be the only copyleft in it.
tauri-plugin-notification = { version = "2", optional = true }

# START-AT-LOGIN, for the one mode that is a commitment rather than a session.
#
# Host mode publishes this install's mail to the user's OWN tailnet — their phone
# reads mail through this process while the laptop is awake — and an always-on
# role the user has to remember to start is a role that silently is not being
# performed. So enabling host mode also registers the app to start at login
# (a LaunchAgent on macOS, a Run registry key on Windows, an autostart .desktop
# entry on Linux — all of it this crate's), shown as a pre-checked line of the
# enable ceremony the user can uncheck, and REMOVED when host mode is turned
# off. The registration is reached only from the shell's own commands in
# `src/host.rs`; the webview is granted those commands and none of this
# plugin's own permissions.
#
# Optional and enabled only by `local-engine`, for the reason every optional
# dependency here is: the preview has no engine, no host mode, and no business
# registering itself to start with anybody's computer. MIT OR Apache-2.0, as is
# everything it pulls in — nothing here is copyleft and nothing may be, since
# this binary is conveyed under AGPL-3.0 and its own licence is meant to be the
# only copyleft in it.
tauri-plugin-autostart = { version = "2", optional = true }

# THE `ohmail://` SCHEME, AND THE TWO PLUGINS THAT MAKE IT ONE APP RATHER THAN
# SEVERAL.
#
# Signing a desktop install in used to end with a person reading a code off a
# browser page and retyping it into the app. The code is now handed back over a
# registered URL scheme instead, which needs two capabilities this process does
# not otherwise have:
#
#  · `tauri-plugin-deep-link` registers `ohmail://` with the platform (an
#    Info.plist entry on macOS, a registry key on Windows, a MimeType in the
#    .desktop file on Linux — all generated from `plugins.deep-link` in
#    tauri.engine.conf.json) and delivers an activation to this process as an
#    event rather than as an argv the app has to interpret;
#  · `tauri-plugin-single-instance` is what makes a scheme activation reach the
#    RUNNING app on Windows and Linux. Without it the platform launches a SECOND
#    copy of ohmail holding the link — a copy whose engine has no PKCE verifier,
#    so the handoff would fail, and which would then fight the first one for the
#    engine's data directory lock. macOS delivers to the running instance itself
#    and needs neither; the plugin is registered on all three because the
#    behaviour it produces is the one macOS already has.
#
# BOTH ARE OPTIONAL AND BOTH ARE OFF IN THE PREVIEW, for the reason the keystore
# and the notification centre are: the interface preview has no account and no
# sign-in, so a scheme registered for it would be a claim on a machine-wide
# namespace made by a build that cannot answer it. The scheme is declared in the
# engine build's config overlay, not in the base config, so the preview's bundle
# registers nothing at all.
#
# MIT OR Apache-2.0, both of them and everything they pull in — nothing here is
# copyleft and nothing may be, since this binary is conveyed under AGPL-3.0 and
# its own licence is meant to be the only copyleft in it.
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"], optional = true }

[dev-dependencies]
# The signature-verification biting test signs nothing at test time — it verifies
# a committed fixture (`test/fixtures/updater/payload.bin{,.sig}`) against the
# SAME public key shipped in `tauri.conf.json`, using the SAME primitive
# `tauri-plugin-updater` verifies with. Flip one byte of the payload and the
# verification refuses; that is the test. `base64` unwraps tauri's key/signature
# envelope exactly as the plugin does before handing the inner minisign bytes to
# `minisign-verify`. Both are dev-only — neither ships in the binary.
minisign-verify = "0.2"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
